<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 관리 페이지 👩‍🏫</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYOJZNuB72oFPskOunQa0V98eaXFuyfiw",
    authDomain: "point-junior-speaking.firebaseapp.com",
    projectId: "point-junior-speaking",
    storageBucket: "point-junior-speaking.firebasestorage.app",
    messagingSenderId: "155258649103",
    appId: "1:155258649103:web:3eb93c3a79c078acd7817a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window._db = db;
  window._storage = storage;
  window._collection = collection;
  window._getDocs = getDocs;
  window._query = query;
  window._orderBy = orderBy;
  window._deleteDoc = deleteDoc;
  window._doc = doc;
  window._ref = ref;
  window._deleteObject = deleteObject;
  window._firebaseReady = true;
  document.dispatchEvent(new Event('firebaseReady'));
</script>
<style>
  :root {
    --orange:#FF6B1A; --orange-light:#FF8C42; --orange-pale:#FFF0E6;
    --yellow:#FFD166; --green:#06D6A0; --blue:#4361EE;
    --bg:#F8F9FF; --white:#FFFFFF;
    --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-400:#9CA3AF;
    --gray-600:#6B7280; --gray-800:#1F2937;
    --shadow:0 4px 20px rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;}

  .header{background:linear-gradient(135deg,#4361EE,#7B89F4);padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(67,97,238,.3);position:sticky;top:0;z-index:100;}
  .header-logo{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;color:white;display:flex;align-items:center;gap:8px;}
  .header-right{display:flex;gap:12px;align-items:center;}
  .btn-refresh{background:rgba(255,255,255,.2);color:white;border:none;border-radius:10px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;}
  .btn-refresh:hover{background:rgba(255,255,255,.35);}

  .app{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

  /* STATS */
  .stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:32px;}
  .stat-card{background:white;border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);}
  .stat-num{font-family:'Baloo 2',cursive;font-size:2.2rem;font-weight:800;color:var(--blue);}
  .stat-label{font-size:.82rem;font-weight:700;color:var(--gray-400);margin-top:2px;}

  /* FILTERS */
  .filter-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
  .filter-label{font-size:.88rem;font-weight:700;color:var(--gray-600);}
  .filter-select{border:2px solid var(--gray-200);border-radius:10px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;color:var(--gray-800);outline:none;cursor:pointer;background:white;}
  .filter-select:focus{border-color:var(--blue);}
  .filter-input{border:2px solid var(--gray-200);border-radius:10px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;color:var(--gray-800);outline:none;flex:1;min-width:160px;background:white;}
  .filter-input:focus{border-color:var(--blue);}

  /* TABLE */
  .table-wrap{background:white;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;}
  .table-head{background:var(--bg);padding:14px 20px;display:grid;grid-template-columns:110px 90px 60px 1fr 140px 160px;gap:12px;font-size:.78rem;font-weight:800;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--gray-200);}
  .table-body{}
  .table-row{padding:14px 20px;display:grid;grid-template-columns:110px 90px 60px 1fr 140px 160px;gap:12px;align-items:center;border-bottom:1px solid var(--gray-100);transition:background .15s;}
  .table-row:hover{background:var(--bg);}
  .table-row:last-child{border-bottom:none;}
  .student-name{font-weight:800;font-size:.95rem;color:var(--gray-800);}
  .unit-badge{background:var(--orange-pale);color:var(--orange);border-radius:8px;padding:3px 10px;font-size:.78rem;font-weight:800;display:inline-block;}
  .sentence-num{background:var(--green);color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;}
  .sentence-text{font-size:.88rem;color:var(--gray-600);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .date-text{font-size:.82rem;color:var(--gray-400);font-weight:600;}
  .btn-play-file{background:linear-gradient(135deg,var(--blue),#7B89F4);color:white;border:none;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;white-space:nowrap;}
  .btn-play-file:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,97,238,.3);}
  .btn-delete-file{background:white;border:2px solid #FCA5A5;color:#EF4444;border-radius:10px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;white-space:nowrap;margin-left:4px;}
  .btn-delete-file:hover{background:#FEF2F2;border-color:#EF4444;}
  .action-btns{display:flex;gap:4px;align-items:center;}

  /* AUDIO PLAYER */
  .audio-panel{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid var(--gray-200);padding:14px 24px;display:none;align-items:center;gap:16px;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.08);}
  .audio-panel.show{display:flex;}
  .audio-info{flex:1;min-width:0;}
  .audio-name{font-weight:800;font-size:.95rem;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .audio-sentence{font-size:.82rem;color:var(--gray-400);font-weight:600;}
  audio{flex:2;height:36px;}
  .btn-close-audio{background:var(--gray-100);border:none;border-radius:10px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--gray-600);}

  /* LOADING */
  .loading{text-align:center;padding:60px;color:var(--gray-400);font-weight:700;font-size:1.1rem;}
  .empty{text-align:center;padding:60px;color:var(--gray-400);font-weight:700;}
  .empty div{font-size:3rem;margin-bottom:12px;}

  /* GROUPED VIEW */
  .group-header{padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:12px;}
  .group-name{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:var(--gray-800);}
  .group-count{background:var(--blue);color:white;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:800;}

  @media(max-width:700px){
    .table-head,.table-row{grid-template-columns:100px 70px 40px 1fr 100px;}
    .table-head .th-date,.table-row .date-text{display:none;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">👩‍🏫 선생님 관리 페이지</div>
  <div class="header-right">
    <span style="color:rgba(255,255,255,.7);font-size:.85rem;font-weight:700;" id="lastUpdate"></span>
    <button class="btn-refresh" onclick="loadData()">🔄 새로고침</button>
  </div>
</div>

<div class="app">

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-num" id="statTotal">-</div><div class="stat-label">전체 제출</div></div>
    <div class="stat-card"><div class="stat-num" id="statStudents">-</div><div class="stat-label">참여 학생</div></div>
    <div class="stat-card"><div class="stat-num" id="statToday">-</div><div class="stat-label">오늘 제출</div></div>
    <div class="stat-card"><div class="stat-num" id="statUnits">-</div><div class="stat-label">Unit 종류</div></div>
  </div>

  <!-- 발음 어려움 기록 -->
  <div class="hard-section">
    <div class="hard-title">
      📝 5번 이상 틀린 발음 기록
      <span class="hard-badge" id="hardBadge">0명</span>
    </div>
    <div class="hard-sub">5번 이상 시도했지만 어려웠던 발음이에요. 수업 시간에 함께 확인해주세요!</div>
    <div class="hard-list" id="hardList">
      <div class="hard-empty">아직 기록이 없어요 🎉</div>
    </div>
  </div>

  <div class="hard-section">
    <div class="hard-title">
      📝 5번 이상 틀린 발음 기록
      <span class="hard-badge" id="hardBadge">-</span>
    </div>
    <div class="hard-sub">5번 이상 시도했지만 어려웠던 발음이에요. 수업 시간에 함께 확인해주세요!</div>
    <div class="hard-list" id="hardList">
      <div class="hard-empty">불러오는 중...</div>
    </div>
  </div>

  <div class="filter-row">
    <span class="filter-label">필터:</span>
    <input class="filter-input" id="filterName" type="text" placeholder="학생 이름 검색..." oninput="renderTable()">
    <select class="filter-select" id="filterUnit" onchange="renderTable()">
      <option value="">전체 Unit</option>
      <option value="1">Unit 1</option>
      <option value="2">Unit 2</option>
      <option value="3">Unit 3</option>
      <option value="4">Unit 4</option>
      <option value="5">Unit 5</option>
      <option value="6">Unit 6</option>
    </select>
    <select class="filter-select" id="filterDate" onchange="renderTable()">
      <option value="">전체 날짜</option>
      <option value="today">오늘</option>
      <option value="week">이번 주</option>
    </select>
    <select class="filter-select" id="filterGroup" onchange="renderTable()">
      <option value="list">목록 보기</option>
      <option value="student">학생별 묶기</option>
    </select>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="loading">🔄 데이터 불러오는 중...</div>
  </div>

</div>

<!-- 오디오 플레이어 -->
<div class="audio-panel" id="audioPanel">
  <div class="audio-info">
    <div class="audio-name" id="audioName"></div>
    <div class="audio-sentence" id="audioSentence"></div>
  </div>
  <audio id="audioPlayer" controls></audio>
  <button class="btn-close-audio" onclick="closeAudio()">✕ 닫기</button>
</div>

<script>
let allData = [];

document.addEventListener('firebaseReady', () => { loadData(); });
if (window._firebaseReady) loadData();

async function loadData() {
  document.getElementById('tableWrap').innerHTML = '<div class="loading">🔄 데이터 불러오는 중...</div>';
  try {
    const q = window._query(
      window._collection(window._db, 'submissions'),
      window._orderBy('submittedAt', 'desc')
    );
    const snap = await window._getDocs(q);
    allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateStats();
    renderTable();
    loadHardWords();
    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 업데이트`;
  } catch(e) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty"><div>⚠️</div>데이터를 불러올 수 없어요.<br>Firebase 설정을 확인해주세요.</div>';
  }
}

async function loadHardWords() {
  try {
    const q = window._query(
      window._collection(window._db, 'hardWords'),
      window._orderBy('submittedAt', 'desc')
    );
    const snap = await window._getDocs(q);
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const list = document.getElementById('hardList');
    const badge = document.getElementById('hardBadge');
    if (!list) return;
    if (data.length === 0) {
      list.innerHTML = '<div class="hard-empty">아직 기록이 없어요 🎉</div>';
      badge.textContent = '0명';
      return;
    }
    const students = new Set(data.map(d => d.studentName));
    badge.textContent = students.size + '명';
    list.innerHTML = data.flatMap(d =>
      (d.records || []).map(r => `
        <div class="hard-item">
          <div class="hard-item-top">
            <span class="hard-student">👤 ${d.studentName}</span>
            <span class="hard-unit">${d.unitName}</span>
            <span class="hard-dial">#${r.dial}-${r.step}번째 문장</span>
          </div>
          <div class="hard-sentence">"${r.sentence}"</div>
          <div class="hard-words">
            ${r.words && r.words.length
              ? r.words.map(w => `<span class="hard-word">${w}</span>`).join('')
              : '<span class="hard-word">전체 재연습 필요</span>'}
          </div>
        </div>`)
    ).join('');
  } catch(e) { console.error('hardWords 로드 실패:', e); }
}

function updateStats() {
  const today = new Date().toDateString();
  document.getElementById('statTotal').textContent    = allData.length;
  document.getElementById('statStudents').textContent = new Set(allData.map(d => d.studentName)).size;
  document.getElementById('statToday').textContent    = allData.filter(d => {
    if (!d.submittedAt) return false;
    return new Date(d.submittedAt.seconds * 1000).toDateString() === today;
  }).length;
  document.getElementById('statUnits').textContent    = new Set(allData.map(d => d.unitId)).size;
}

function getFiltered() {
  const name  = document.getElementById('filterName').value.trim().toLowerCase();
  const unit  = document.getElementById('filterUnit').value;
  const date  = document.getElementById('filterDate').value;
  const now   = new Date();
  const todayStr = now.toDateString();
  const weekAgo  = new Date(now - 7 * 864e5);

  return allData.filter(d => {
    if (name && !d.studentName?.toLowerCase().includes(name)) return false;
    if (unit && String(d.unitId) !== unit) return false;
    if (date && d.submittedAt) {
      const t = new Date(d.submittedAt.seconds * 1000);
      if (date === 'today' && t.toDateString() !== todayStr) return false;
      if (date === 'week' && t < weekAgo) return false;
    }
    return true;
  });
}

function renderTable() {
  const data   = getFiltered();
  const group  = document.getElementById('filterGroup').value;
  const wrap   = document.getElementById('tableWrap');

  if (!data.length) {
    wrap.innerHTML = '<div class="empty"><div>📭</div>제출된 녹음이 없어요.</div>';
    return;
  }

  if (group === 'student') {
    renderGrouped(data, wrap);
  } else {
    renderList(data, wrap);
  }
}

function renderList(data, wrap) {
  wrap.innerHTML = `
    <div class="table-head">
      <div>학생</div><div>Script</div><div>대화#/문장#</div><div>파일명</div>
      <div class="th-date">날짜</div><div>관리</div>
    </div>
    <div class="table-body">
      ${data.map(d => rowHTML(d)).join('')}
    </div>`;
}

function renderGrouped(data, wrap) {
  const groups = {};
  data.forEach(d => {
    if (!groups[d.studentName]) groups[d.studentName] = [];
    groups[d.studentName].push(d);
  });
  wrap.innerHTML = Object.entries(groups).map(([name, rows]) => `
    <div class="group-header">
      <div class="group-name">👤 ${name}</div>
      <div class="group-count">${rows.length}개 제출</div>
    </div>
    <div class="table-head">
      <div>학생</div><div>Script</div><div>대화#/문장#</div><div>파일명</div>
      <div class="th-date">날짜</div><div>관리</div>
    </div>
    ${rows.map(d => rowHTML(d)).join('')}
  `).join('');
}

function rowHTML(d) {
  const ts = d.submittedAt ? new Date(d.submittedAt.seconds * 1000) : null;
  const dateStr = ts ? `${ts.getMonth()+1}/${ts.getDate()} ${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}` : '-';
  const escapedFile = (d.fileName||'').replace(/'/g,'&#39;');

  // 신규: dialogueNum/sentenceNum / 구버전: setNumber 모두 지원
  let numLabel = '-';
  if (d.dialogueNum) {
    numLabel = `#${d.dialogueNum}-${d.sentenceNum||'?'}`;
  } else if (d.setNumber) {
    numLabel = `#${d.setNumber}`;
  }
  const unitLabel = d.unitName || `Unit${d.unitId}`;
  const label = `${d.studentName} · ${unitLabel} · ${numLabel}`;

  return `
    <div class="table-row" id="row-${d.id}">
      <div class="student-name">${d.studentName||'-'}</div>
      <div><span class="unit-badge">${unitLabel}</span></div>
      <div><div class="sentence-num" style="font-size:.78rem;font-weight:800;color:var(--orange);">${numLabel}</div></div>
      <div class="sentence-text" title="${escapedFile}">${d.fileName||'-'}</div>
      <div class="date-text">${dateStr}</div>
      <div class="action-btns">
        ${d.fileUrl
          ? `<button class="btn-play-file" onclick="playFile('${d.fileUrl}','${label}','${escapedFile}')">▶ 듣기</button>`
          : '<span style="color:var(--gray-400);font-size:.82rem;">없음</span>'}
        <button class="btn-delete-file" onclick="deleteRecord('${d.id}','${d.fileUrl||''}','${escapedFile}')">🗑</button>
      </div>
    </div>`;
}

function playFile(url, name, sentence) {
  const panel = document.getElementById('audioPanel');
  document.getElementById('audioName').textContent = name;
  document.getElementById('audioSentence').textContent = sentence || '';
  const audio = document.getElementById('audioPlayer');
  audio.src = url;
  audio.play();
  panel.classList.add('show');
}

async function deleteRecord(docId, fileUrl, fileName) {
  if (!confirm(`🗑 이 기록을 삭제할까요?\n\n파일: ${fileName}\n\n삭제하면 복구할 수 없어요.`)) return;

  try {
    // Firestore 문서 삭제
    await window._deleteDoc(window._doc(window._db, 'submissions', docId));

    // Storage 파일 삭제 (파일명으로 경로 추정)
    if (fileUrl && fileName) {
      try {
        // allData에서 studentName, unitId 찾기
        const record = allData.find(d => d.id === docId);
        if (record) {
          const unitFolder = record.unitName ? record.unitName.replace(/\//g,'-') : `Unit${record.unitId}`;
          const path = `recordings/${record.studentName}/${unitFolder}/${record.fileName}`;
          const fileRef = window._ref(window._storage, path);
          await window._deleteObject(fileRef);
        }
      } catch(e) {
        console.warn('Storage 파일 삭제 실패:', e);
      }
    }

    // 화면에서 행 제거
    const row = document.getElementById(`row-${docId}`);
    if (row) {
      row.style.transition = 'opacity .3s';
      row.style.opacity = '0';
      setTimeout(() => {
        row.remove();
        // 데이터도 메모리에서 제거
        allData = allData.filter(d => d.id !== docId);
        updateStats();
        // 남은 데이터 없으면 빈 화면
        if (!document.querySelector('.table-row')) {
          document.getElementById('tableWrap').innerHTML =
            '<div class="empty"><div>📭</div>제출된 녹음이 없어요.</div>';
        }
      }, 300);
    }

    showDeleteToast('✅ 삭제 완료!');
  } catch(e) {
    console.error(e);
    showDeleteToast('❌ 삭제 실패. 다시 시도해주세요.');
  }
}

function showDeleteToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1F2937;color:white;padding:11px 22px;border-radius:14px;font-weight:700;font-size:.92rem;z-index:999;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function closeAudio() {
  document.getElementById('audioPlayer').pause();
  document.getElementById('audioPanel').classList.remove('show');
}
</script>
</body>
</html>
