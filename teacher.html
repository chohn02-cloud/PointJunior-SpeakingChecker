<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👩‍🏫 선생님 관리 페이지</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDYOJZNuB72oFPskOunQa0V98eaXFuyfiw",
    authDomain: "point-junior-speaking.firebaseapp.com",
    projectId: "point-junior-speaking",
    storageBucket: "point-junior-speaking.firebasestorage.app",
    messagingSenderId: "155258649103",
    appId: "1:155258649103:web:3eb93c3a79c078acd7817a"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  window._db = db; window._storage = storage;
  window._collection = collection; window._getDocs = getDocs;
  window._query = query; window._orderBy = orderBy;
  window._deleteDoc = deleteDoc; window._doc = doc;
  window._ref = ref; window._deleteObject = deleteObject;
  window._firebaseReady = true;
  document.dispatchEvent(new Event('firebaseReady'));
</script>
<style>
:root{
  --or:#FF6B1A;--orl:#FF8C42;--orp:#FFF0E6;
  --bl:#4361EE;--gr:#06D6A0;--rd:#EF233C;--pu:#7C3AED;
  --bg:#F8F9FC;--white:#FFFFFF;
  --g1:#F3F4F6;--g2:#E5E7EB;--g4:#9CA3AF;--g6:#6B7280;--g8:#1F2937;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--g8);min-height:100vh;}

/* HEADER */
.header{background:white;border-bottom:1px solid var(--g2);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-title{font-size:1.15rem;font-weight:800;color:var(--g8);}
.header-time{font-size:.78rem;font-weight:600;color:var(--g4);}
.header-btns{display:flex;gap:8px;}
.btn-refresh{background:var(--bl);color:white;border:none;border-radius:10px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;}
.btn-reset{background:#FEE2E2;border:1.5px solid #FCA5A5;color:var(--rd);border-radius:10px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;}

/* TABS */
.tabs-wrap{background:white;border-bottom:1px solid var(--g2);padding:0 28px;display:flex;gap:0;overflow-x:auto;}
.tab{padding:14px 20px;font-size:.88rem;font-weight:700;color:var(--g4);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--or);}
.tab.active{color:var(--or);border-bottom-color:var(--or);font-weight:800;}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:28px 24px;}

/* 상태 뱃지 */
.status-done{background:#D1FAE5;color:#059669;}
.status-part{background:#FEF3C7;color:#D97706;}
.status-none{background:#F3F4F6;color:#9CA3AF;}
.status-warn{background:#FEE2E2;color:#EF4444;}

/* CLASS SECTION */
.class-section{margin-bottom:32px;}
.class-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.class-title{font-size:1.1rem;font-weight:800;color:var(--g8);}
.class-count{background:var(--g1);border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;color:var(--g6);}

/* STUDENT CARDS */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.student-card{background:white;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
.student-card-header{padding:14px 18px;background:linear-gradient(135deg,var(--or),var(--orl));display:flex;align-items:center;gap:10px;}
.student-avatar{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:white;flex-shrink:0;}
.student-name{font-size:1rem;font-weight:800;color:white;}
.student-class{font-size:.72rem;color:rgba(255,255,255,.75);font-weight:600;}
.student-status{margin-left:auto;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.2);color:white;border-radius:99px;padding:3px 10px;}

/* SCRIPT PROGRESS */
.script-list{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.script-row{border:1.5px solid var(--g2);border-radius:12px;overflow:hidden;}
.script-row-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--g1);cursor:pointer;}
.script-name{font-size:.85rem;font-weight:800;color:var(--g8);}
.script-badge{font-size:.7rem;font-weight:800;border-radius:99px;padding:2px 8px;}
.badge-done{background:#D1FAE5;color:#059669;}
.badge-part{background:#FEF3C7;color:#D97706;}
.badge-none{background:var(--g2);color:var(--g6);}
.script-dial-count{font-size:.72rem;color:var(--g4);font-weight:600;margin-left:auto;}

/* DIALOGUE TABLE */
.dial-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.dial-table th{background:var(--g1);padding:7px 12px;text-align:left;font-weight:800;color:var(--g6);font-size:.72rem;}
.dial-table td{padding:8px 12px;border-top:1px solid var(--g1);vertical-align:middle;}
.dial-table tr:hover td{background:#FAFAFA;}
.dial-num-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:.68rem;font-weight:800;color:white;flex-shrink:0;}
.try-1{background:var(--gr);}
.try-2{background:#F59E0B;}
.try-5{background:var(--rd);}
.try-none{background:var(--g4);}
.play-btn{background:var(--bl);color:white;border:none;border-radius:8px;padding:5px 10px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;cursor:pointer;white-space:nowrap;}
.del-btn{background:white;border:1.5px solid #FCA5A5;color:var(--rd);border-radius:8px;padding:5px 8px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;cursor:pointer;margin-left:4px;}
.success-rate{font-weight:800;font-size:.78rem;}
.rate-high{color:var(--gr);}
.rate-mid{color:#F59E0B;}
.rate-low{color:var(--rd);}

/* AUDIO PANEL */
.audio-panel{display:none;position:fixed;bottom:24px;right:24px;background:white;border-radius:18px;box-shadow:var(--shadow-lg);padding:18px 20px;min-width:300px;max-width:380px;z-index:200;border:1px solid var(--g2);}
.audio-panel.show{display:block;}
.audio-panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.audio-panel-name{font-size:.88rem;font-weight:800;color:var(--g8);}
.audio-close{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--g4);}
.audio-player{width:100%;border-radius:8px;margin-top:4px;}

/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--g4);}
.empty-state div{font-size:2.5rem;margin-bottom:10px;}
.empty-state p{font-size:.9rem;font-weight:600;}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--g4);font-weight:700;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--g8);color:white;padding:10px 20px;border-radius:12px;font-weight:700;font-size:.86rem;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .student-grid{grid-template-columns:1fr;}
  .header{padding:0 16px;}
  .main{padding:16px;}
  .tabs-wrap{padding:0 16px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">👩‍🏫 선생님 관리 페이지</div>
    <div class="header-time" id="lastUpdate">-</div>
  </div>
  <div class="header-btns">
    <button class="btn-refresh" onclick="loadAll()">🔄 새로고침</button>
    <button class="btn-reset" onclick="resetAll()">🗑 초기화</button>
  </div>
</div>

<!-- 탭 -->
<div class="tabs-wrap">
  <div class="tab active" onclick="switchTab('all')" id="tab-all">전체</div>
  <div class="tab" onclick="switchTab('ES1')" id="tab-ES1">E.S.1반</div>
  <div class="tab" onclick="switchTab('ES2')" id="tab-ES2">E.S.2반</div>
  <div class="tab" onclick="switchTab('ES3')" id="tab-ES3">E.S.3반</div>
  <div class="tab" onclick="switchTab('PES')" id="tab-PES">P-E.S반</div>
</div>

<div class="main">


  <!-- 학생 목록 -->
  <div id="content"><div class="loading">🔄 데이터 불러오는 중...</div></div>
</div>

<!-- 오디오 패널 -->
<div class="audio-panel" id="audioPanel">
  <div class="audio-panel-top">
    <div class="audio-panel-name" id="audioName">-</div>
    <button class="audio-close" onclick="closeAudio()">✕</button>
  </div>
  <audio class="audio-player" id="audioPlayer" controls></audio>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 학생 명단 (speaking_practice.html과 동일하게 유지) ──
const CLASS_MAP = {
  "김태연":"E.S.1반","박주성":"E.S.1반","정진호":"E.S.1반",
  "한바로":"E.S.1반","안서윤":"E.S.1반","강민서":"E.S.1반",
  "김지안":"E.S.2반","백지선":"E.S.2반","김승아":"E.S.2반",
  "정선우":"E.S.3반",
  "강준서":"P-E.S반",
};
const CLASS_LIST = ["E.S.1반","E.S.2반","E.S.3반","P-E.S반"];
const TAB_KEY = {"all":"전체","ES1":"E.S.1반","ES2":"E.S.2반","ES3":"E.S.3반","PES":"P-E.S반"};

let allSubs = [];    // submissions
let allHard = [];    // hardWords (passLog)
let currentTab = 'all';

// ── 데이터 로드 ──
async function loadAll() {
  document.getElementById('content').innerHTML = '<div class="loading">🔄 데이터 불러오는 중...</div>';
  try {
    const [snapSub, snapHard] = await Promise.all([
      window._getDocs(window._query(window._collection(window._db,'submissions'), window._orderBy('submittedAt','desc'))),
      window._getDocs(window._query(window._collection(window._db,'hardWords'), window._orderBy('submittedAt','desc')))
    ]);
    allSubs = snapSub.docs.map(d => ({id:d.id,...d.data()}));
    allHard = snapHard.docs.map(d => ({id:d.id,...d.data()}));
    render();
    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 업데이트`;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><div>⚠️</div><p>데이터를 불러올 수 없어요</p></div>';
  }
}



// ── 탭 전환 ──
function switchTab(key) {
  currentTab = key;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  render();
}

// ── 메인 렌더 ──
function render() {
  const targetClasses = currentTab === 'all' ? CLASS_LIST : [TAB_KEY[currentTab]];

  // 학생별 데이터 그룹핑
  const studentData = buildStudentData();

  let html = '';
  for (const cls of targetClasses) {
    const members = Object.entries(CLASS_MAP).filter(([,c])=>c===cls).map(([n])=>n);
    if (members.length === 0) continue;

    // 관리자 포인트가 테스트한 것도 포함
    const unknownStudents = Object.keys(studentData).filter(n =>
      !Object.keys(CLASS_MAP).includes(n) && n !== '포인트'
    );

    const showMembers = currentTab === 'all'
      ? [...members, ...unknownStudents.filter(n => !members.includes(n))]
      : members;

    html += `<div class="class-section">
      <div class="class-header">
        <div class="class-title">${cls}</div>
        <div class="class-count">${members.length}명</div>
      </div>
      <div class="student-grid">
        ${members.map(name => renderStudentCard(name, studentData[name] || {}, cls)).join('')}
      </div>
    </div>`;
  }

  // 관리자/미분류 학생
  const knownNames = Object.keys(CLASS_MAP);
  const unknown = Object.keys(studentData).filter(n => !knownNames.includes(n));
  if (unknown.length > 0 && currentTab === 'all') {
    html += `<div class="class-section">
      <div class="class-header"><div class="class-title">기타</div></div>
      <div class="student-grid">
        ${unknown.map(name => renderStudentCard(name, studentData[name] || {}, '기타')).join('')}
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML = html || '<div class="empty-state"><div>📭</div><p>해당 반 데이터가 없어요</p></div>';
}

// ── 학생별 데이터 구조화 ──
function buildStudentData() {
  const data = {};

  // submissions 처리
  allSubs.forEach(s => {
    const n = s.studentName;
    if (!data[n]) data[n] = { scripts: {} };
    const key = s.unitName || `Unit${s.unitId}`;
    if (!data[n].scripts[key]) data[n].scripts[key] = { dials: {} };
    const dNum = s.dialogueNum || 1;
    data[n].scripts[key].dials[dNum] = {
      ...data[n].scripts[key].dials[dNum],
      fileUrl: s.fileUrl,
      fileName: s.fileName,
      subId: s.id,
      submittedAt: s.submittedAt,
      unitName: s.unitName,
      unitId: s.unitId,
      dialogueNum: dNum,
      studentName: n,
    };
  });

  // hardWords (passLog) 처리
  allHard.forEach(h => {
    const n = h.studentName;
    if (!data[n]) data[n] = { scripts: {} };
    const key = h.unitName || `Unit${h.unitId}`;
    if (!data[n].scripts[key]) data[n].scripts[key] = { dials: {} };
    const dNum = h.dialogueNum || 1;
    if (!data[n].scripts[key].dials[dNum]) data[n].scripts[key].dials[dNum] = {};
    data[n].scripts[key].dials[dNum].passLog = h.passLog || [];
    data[n].scripts[key].dials[dNum].hardRecords = h.hardRecords || h.records || [];
  });

  return data;
}

// ── 학생 카드 렌더 ──
function renderStudentCard(name, data, cls) {
  const scripts = data.scripts || {};
  const scriptKeys = Object.keys(scripts);
  const totalDials = scriptKeys.reduce((sum, k) => sum + Object.keys(scripts[k].dials).length, 0);

  // 전체 경고 여부 확인
  let hasAnyWarning = false;
  let hasAnyFailure = false;
  let allRate = 0, allRateCount = 0;
  Object.values(scripts).forEach(sc => {
    Object.values(sc.dials || {}).forEach(d => {
      if ((d.hardRecords||[]).length > 0) hasAnyWarning = true;
      (d.passLog||[]).forEach(p => {
        allRateCount++;
        if (p.tries < 5) allRate++;
      });
    });
  });
  const avgRate = allRateCount > 0 ? Math.round(allRate/allRateCount*100) : null;

  let statusLabel, statusColor;
  if (totalDials === 0) {
    statusLabel = '❌ 미제출';
    statusColor = 'background:rgba(239,35,60,.3)';
  } else if (hasAnyWarning || (avgRate !== null && avgRate < 70)) {
    statusLabel = '⚠️ 확인 필요';
    statusColor = 'background:rgba(245,158,11,.3)';
  } else {
    statusLabel = '✅ 완료';
    statusColor = 'background:rgba(6,214,160,.25)';
  }

  const initial = name[0];

  const scriptsHtml = scriptKeys.length === 0
    ? '<div style="padding:14px 18px;color:#9CA3AF;font-size:.82rem;font-weight:600;">아직 제출한 녹음이 없어요</div>'
    : scriptKeys.map(key => renderScriptSection(name, key, scripts[key])).join('');

  return `
    <div class="student-card">
      <div class="student-card-header">
        <div class="student-avatar">${initial}</div>
        <div>
          <div class="student-name">${name}</div>
          <div class="student-class">${cls}</div>
        </div>
        <div class="student-status" style="${statusColor}">${statusLabel}</div>
        <button onclick="deleteStudent('${name}')" style="background:rgba(255,255,255,.2);border:none;color:white;border-radius:8px;padding:3px 8px;font-family:'Nunito',sans-serif;font-size:.68rem;font-weight:800;cursor:pointer;margin-left:6px;">🗑</button>
      </div>
      <div class="script-list">${scriptsHtml}</div>
    </div>`;
}

// ── Script 섹션 렌더 ──
let expandedSections = new Set(); // 펼쳐진 섹션 추적

function toggleSection(id) {
  if (expandedSections.has(id)) {
    expandedSections.delete(id);
  } else {
    expandedSections.add(id);
  }
  const body = document.getElementById('sb-' + id);
  const arrow = document.getElementById('sa-' + id);
  if (body) body.style.display = expandedSections.has(id) ? 'block' : 'none';
  if (arrow) arrow.textContent = expandedSections.has(id) ? '▲' : '▼';
}

function renderScriptSection(studentName, scriptKey, scriptData) {
  const dials = scriptData.dials || {};
  const dialNums = Object.keys(dials).sort((a,b)=>Number(a)-Number(b));
  const count = dialNums.length;
  const sectionId = (studentName + scriptKey).replace(/[^a-zA-Z0-9가-힣]/g,'_');

  // 전체 성공률 계산
  let totalSentences = 0, successSentences = 0, hasFailure = false;
  dialNums.forEach(dn => {
    const d = dials[dn];
    const plog = d.passLog || [];
    const hard = d.hardRecords || [];
    plog.forEach(p => {
      totalSentences++;
      if (p.tries < 5) successSentences++;
    });
    if (hard.length > 0) hasFailure = true;
  });
  const rate = totalSentences > 0 ? Math.round(successSentences/totalSentences*100) : null;

  // 상태 결정
  let statusHtml = '';
  if (count === 0) {
    statusHtml = '<span class="script-badge badge-none">미제출</span>';
  } else if (hasFailure || (rate !== null && rate < 70)) {
    statusHtml = '<span class="script-badge" style="background:#FEF3C7;color:#D97706;">⚠️ 확인 필요</span>';
  } else if (rate !== null) {
    statusHtml = '<span class="script-badge badge-done">✅ 완료</span>';
  }

  const rateHtml = rate !== null
    ? `<span class="success-rate ${rate>=80?'rate-high':rate>=50?'rate-mid':'rate-low'}" style="font-size:.82rem;font-weight:800;">${rate}%</span>`
    : '';

  return `
    <div class="script-row">
      <div class="script-row-header" onclick="toggleSection('${sectionId}')" style="cursor:pointer;">
        <span class="script-name">📖 ${scriptKey}</span>
        ${statusHtml}
        ${rateHtml}
        ${count > 0 ? `<span class="script-dial-count" id="sa-${sectionId}">▼</span>` : ''}
      </div>
      <div id="sb-${sectionId}" style="display:none;">
        ${count > 0 ? `
        <table class="dial-table">
          <thead>
            <tr>
              <th>대화#</th>
              <th>발음 성공률</th>
              <th>문장별 결과</th>
              <th>완료 시간</th>
              <th>녹음</th>
            </tr>
          </thead>
          <tbody>
            ${dialNums.map(dn => renderDialRow(studentName, scriptKey, dials[dn], dn)).join('')}
          </tbody>
        </table>` : '<div style="padding:12px 16px;color:#9CA3AF;font-size:.8rem;">기록이 없어요</div>'}
      </div>
    </div>`;
}

// ── 대화 행 렌더 ──
function renderDialRow(studentName, scriptKey, dial, dialNum) {
  const plog = (dial.passLog || []).sort((a,b)=>a.step-b.step);
  const hard = dial.hardRecords || [];

  // 성공률
  const total = plog.length;
  const success = plog.filter(p=>p.tries < 5).length;
  const rate = total > 0 ? Math.round(success/total*100) : null;
  const rateHtml = rate !== null
    ? `<span class="success-rate ${rate>=80?'rate-high':rate>=50?'rate-mid':'rate-low'}">${rate}%<span style="font-size:.68rem;font-weight:600;color:#9CA3AF;"> (${success}/${total})</span></span>`
    : '<span style="color:#9CA3AF;font-size:.75rem;">기록없음</span>';

  // 문장별 뱃지
  const badges = plog.map(p => {
    const cls = p.tries===1?'try-1':p.tries>=5?'try-5':'try-2';
    const label = p.tries===1?'✓':p.tries>=5?'✕':p.tries;
    return `<span class="dial-num-badge ${cls}" title="${p.step}번째: ${p.tries>=5?'실패':p.tries+'번만에 통과'}">${label}</span>`;
  }).join(' ');

  // 완료 시간
  const ts = dial.submittedAt ? new Date(dial.submittedAt.seconds*1000) : null;
  const timeStr = ts
    ? `${ts.getMonth()+1}/${ts.getDate()} ${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}`
    : '-';

  // 녹음 버튼
  const recHtml = dial.fileUrl
    ? `<button class="play-btn" onclick="playAudio('${dial.fileUrl}','${studentName} #${dialNum}')">▶ 듣기</button>
       <button class="del-btn" onclick="deleteRec('${dial.subId}','${dial.fileUrl}','${dial.fileName||''}','${studentName}','${scriptKey}')">🗑</button>`
    : '<span style="color:#9CA3AF;font-size:.72rem;">없음</span>';

  return `
    <tr>
      <td><b>#${dialNum}</b></td>
      <td>${rateHtml}</td>
      <td>${badges || '<span style="color:#9CA3AF;font-size:.72rem;">-</span>'}</td>
      <td style="font-size:.75rem;color:#6B7280;">${timeStr}</td>
      <td>${recHtml}</td>
    </tr>`;
}

// ── 오디오 ──
function playAudio(url, name) {
  const panel = document.getElementById('audioPanel');
  document.getElementById('audioName').textContent = name;
  const player = document.getElementById('audioPlayer');
  player.src = url;
  player.play();
  panel.classList.add('show');
}
function closeAudio() {
  const player = document.getElementById('audioPlayer');
  player.pause(); player.src = '';
  document.getElementById('audioPanel').classList.remove('show');
}

// ── 삭제 ──
async function deleteRec(subId, fileUrl, fileName, studentName, unitName) {
  if (!confirm(`🗑 이 기록을 삭제할까요?\n\n${studentName} · ${unitName}\n\n되돌릴 수 없어요.`)) return;
  try {
    await window._deleteDoc(window._doc(window._db,'submissions',subId));
    if (fileName && studentName && unitName) {
      try {
        const path = `recordings/${studentName}/${unitName.replace(/\//g,'-')}/${fileName}`;
        await window._deleteObject(window._ref(window._storage, path));
      } catch(e) { console.warn(e); }
    }
    toast('✅ 삭제 완료!');
    await loadAll();
  } catch(e) {
    toast('❌ 삭제 실패');
  }
}

// ── 전체 초기화 ──
async function resetAll() {
  if (!confirm('⚠️ 정말 모든 기록을 삭제할까요?\n\n제출 기록과 발음 기록이 모두 삭제됩니다.\n되돌릴 수 없어요!')) return;
  if (!confirm('마지막 확인! 정말 삭제할까요?')) return;
  try {
    const [snap1, snap2] = await Promise.all([
      window._getDocs(window._query(window._collection(window._db,'submissions'))),
      window._getDocs(window._query(window._collection(window._db,'hardWords')))
    ]);
    for (const d of snap1.docs) await window._deleteDoc(window._doc(window._db,'submissions',d.id));
    for (const d of snap2.docs) await window._deleteDoc(window._doc(window._db,'hardWords',d.id));
    alert('✅ 모든 기록이 삭제됐어요!');
    loadAll();
  } catch(e) { alert('❌ 삭제 실패: ' + e.message); }
}

// ── 학생 전체 기록 삭제 ──
async function deleteStudent(name) {
  if (!confirm(`🗑 "${name}" 학생의 모든 기록을 삭제할까요?\n\n제출 기록과 발음 기록이 모두 삭제됩니다.\n(Storage 파일은 Firebase에서 직접 삭제해주세요)\n\n되돌릴 수 없어요!`)) return;
  try {
    // submissions 삭제
    const snap1 = await window._getDocs(window._query(window._collection(window._db,'submissions')));
    for (const d of snap1.docs) {
      if (d.data().studentName === name) {
        await window._deleteDoc(window._doc(window._db,'submissions',d.id));
      }
    }
    // hardWords 삭제
    const snap2 = await window._getDocs(window._query(window._collection(window._db,'hardWords')));
    for (const d of snap2.docs) {
      if (d.data().studentName === name) {
        await window._deleteDoc(window._doc(window._db,'hardWords',d.id));
      }
    }
    toast(`✅ ${name} 학생 기록 삭제 완료!`);
    await loadAll();
  } catch(e) {
    toast('❌ 삭제 실패: ' + e.message);
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

document.addEventListener('firebaseReady', loadAll);
</script>
