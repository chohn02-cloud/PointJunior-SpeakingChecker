function normalize(s){
  return (s||"").toString().trim().toLowerCase().replace(/\s+/g," ");
}
// 영어 정답에 괄호가 있으면: 삭제형(괄호 통째로 빼고), 삽입형(괄호 내용 그대로 넣고),
// 그리고 괄호가 딱 하나뿐이고 그 내용이 전치사/관사 같은 기능어가 아니면(=완전히 다른 철자) 그 내용 자체도 별도 정답으로 인정
function expandParenVariants(str){
  if(!/\(/.test(str)) return [str];
  const FUNC_WORDS = new Set(["to","of","from","in","with","on","at","for","about","into","as","out","up","away","that","the","a","an","off","down","over"]);
  const groups = [];
  let template = "";
  let lastIndex = 0;
  let idx = 0;
  const re = /\(([^)]*)\)/g;
  let m;
  while((m = re.exec(str))){
    template += str.slice(lastIndex, m.index) + `{{${idx}}}`;
    const content = m[1].replace(/~/g,"").trim();
    groups.push(content);
    lastIndex = re.lastIndex;
    idx++;
  }
  template += str.slice(lastIndex);
  let variants = [template];
  groups.forEach((content, i)=>{
    const next = [];
    variants.forEach(v=>{
      next.push(v.replace(`{{${i}}}`, "").replace(/\s+/g," ").trim());
      if(content) next.push(v.replace(`{{${i}}}`, content).replace(/\s+/g," ").trim());
    });
    variants = next;
  });
  variants = [...new Set(variants.map(v=>v.trim()).filter(Boolean))];
  if(groups.length === 1){
    const content = groups[0];
    if(content && !FUNC_WORDS.has(content.toLowerCase())){
      variants.push(content);
    }
  }
  return variants;
}
function isCorrectAnswer(given, engField){
  const options = String(engField).split("/").map(s=>s.trim()).filter(Boolean);
  const allVariants = options.flatMap(expandParenVariants);
  const g = normalize(given);
  return allVariants.some(o => normalize(o) === g);
}
function isPolysemyCorrect(given, meaningsArr){
  const tokens = (given||"").split(/[\/,;、，]|\n/).map(normalize).filter(Boolean);
  return meaningsArr.every(m => tokens.some(t => t === normalize(m)));
}
function withTimeout(promise, ms){
  ms = ms || 15000;
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error("요청이 너무 오래 걸려요. 인터넷 연결을 확인해줘.")), ms))
  ]);
}

async function loadDailyTestsIntoCategories(){
  const snap = await withTimeout(db.collection("dailyTests").orderBy("createdAt","desc").get());
  const books = {};
  snap.docs.forEach(doc=>{
    const d = doc.data();
    books[doc.id] = {
      label: d.label,
      days: { "1": (d.words||[]).map(w=>({ type:"word", kor:w.kor, eng:w.eng })) }
    };
  });
  CATEGORIES.dailytest.books = books;
}

/* ====================== point voca: 범위 목록 ====================== */
function renderPvRanges(){
  // POINTVOCA_RANGES의 id 형식: pv_{챕터}_{1or2} -> 챕터별로 묶기
  const chapters = {};
  POINTVOCA_RANGES.forEach(r=>{
    const m = r.id.match(/^pv_(\d+)_/);
    const ch = m ? +m[1] : 0;
    chapters[ch] = chapters[ch] || [];
    chapters[ch].push(r);
  });
  const chapterNums = Object.keys(chapters).map(Number).sort((a,b)=>a-b);

  let currentRangeId = null;
  let currentChapter = null;

  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot"><img src="logo.png" alt="Point Junior"></div><div class="brand"><b>point voca</b></div></div>
    <h1>챕터를 선택해줘 ⭐</h1>
    <div class="sub">(1)부터 (10)까지 있어. 먼저 챕터를 고르고, 그 다음 세부 범위를 골라줘</div>
    <div id="pv-current-hint"></div>
    <div class="grid" id="pv-chapter-grid" style="grid-template-columns:repeat(5,1fr);"></div>
    <div id="pv-subrange" style="display:none;"></div>
    <button class="btn-ghost" id="btn-back-categories2">← 폴더 목록으로</button>
  `;
  const chapterGrid = document.getElementById("pv-chapter-grid");
  const subrangeBox = document.getElementById("pv-subrange");

  function paintChapters(){
    chapterGrid.style.display = "grid";
    subrangeBox.style.display = "none";
    chapterGrid.innerHTML = chapterNums.map(ch=>`
      <div class="daybtn" data-ch="${ch}" style="${ch===currentChapter ? 'border-color:var(--gold);background:rgba(212,175,106,.12);' : ''}">
        <div class="n">${ch===currentChapter ? "🔥 " : ""}(${ch})</div>
      </div>
    `).join("");
    chapterGrid.querySelectorAll("[data-ch]").forEach(el=>{
      el.onclick = ()=>{
        paintSubrange(+el.dataset.ch);
      };
    });
  }

  function paintSubrange(ch){
    chapterGrid.style.display = "none";
    subrangeBox.style.display = "block";
    const ranges = chapters[ch];
    subrangeBox.innerHTML = `
      <div class="sub" style="margin-bottom:8px;">(${ch}) 세부 범위를 골라줘</div>
      <div class="grid" id="pv-sub-grid" style="grid-template-columns:repeat(2,1fr);"></div>
      <button class="btn-ghost" id="btn-back-chapters">← 챕터 목록으로</button>
    `;
    const subGrid = document.getElementById("pv-sub-grid");
    subGrid.innerHTML = ranges.map(r=>`
      <div class="daybtn" data-id="${r.id}" style="${r.id===currentRangeId ? 'border-color:var(--gold);background:rgba(212,175,106,.12);' : ''}">
        <div class="n">${r.id===currentRangeId ? "🔥 " : ""}${r.label}</div>
        <div class="c">${r.words.length}단어</div>
      </div>
    `).join("");
    subGrid.querySelectorAll("[data-id]").forEach(el=>{
      el.onclick = ()=>{
        state.pvRangeId = el.dataset.id;
        state.loginIntent = "pointvoca";
        if(state.studentName){
          startPointVocaTest();
        } else {
          state.screen = "login";
          render();
        }
      };
    });
    document.getElementById("btn-back-chapters").onclick = ()=>{ paintChapters(); };
  }

  paintChapters();
  document.getElementById("btn-back-categories2").onclick = ()=>{ state.screen = "categories"; render(); };

  db.collection("pointVocaSchedule").doc("current").get().then(snap=>{
    if(snap.exists){
      const d = snap.data();
      currentRangeId = d.rangeId;
      const m = d.rangeId.match(/^pv_(\d+)_/);
      currentChapter = m ? +m[1] : null;
      document.getElementById("pv-current-hint").innerHTML =
        `<div class="schedule-box">🔥 이번 범위: ${d.label}</div>`;
      paintChapters();
    }
  }).catch(err=> console.error("현재 범위 조회 실패:", err.message));
}

/* ====================== 화면3: Day 선택 (통과 여부 표시) ====================== */
async function renderDays(){

/* ====================== point voca: 시험 준비 ====================== */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

async function getPvRulesForClass(cls){
  try{
    const snap = await withTimeout(db.collection("pointVocaSettings").doc(cls).get());
    if(snap.exists){
      const d = snap.data();
      if(d.direction) return {
        direction: d.direction,
        multiMeaning: d.multiMeaning || "one",
        firstCount: d.firstCount ? +d.firstCount : 25
      };
    }
  }catch(err){
    console.error("point voca 설정 조회 실패:", err.message);
  }
  return POINTVOCA_DEFAULT_RULES[cls] || POINTVOCA_UNIVERSAL_DEFAULT;
}

async function startPointVocaTest(){
  const range = POINTVOCA_RANGES.find(r=>r.id===state.pvRangeId);
  const rules = await getPvRulesForClass(state.studentClass);
  if(!rules){
    alert(state.studentClass + "반은 아직 point voca 설정이 안 됐어요. 선생님께 확인해줘.");
    state.screen = "pvRanges";
    render();
    return;
  }
  state.pvDirection = rules.direction; // "krWrite" | "enWrite"
  state.pvMultiMeaning = rules.multiMeaning; // "all" | "one"
  state.pvFirstCount = rules.firstCount || 25;

  let isRetest = false;
  try{
    const snap = await withTimeout(db.collection("pointVocaResults")
      .where("studentName","==",state.studentName)
      .where("rangeId","==",state.pvRangeId).get());
    isRetest = snap.docs.length > 0;
  }catch(err){
    console.error("point voca 기록 조회 실패:", err.message);
  }
  state.pvIsRetest = isRetest;

  let words = shuffleArray(range.words);
  if(!isRetest) words = words.slice(0, Math.min(state.pvFirstCount, words.length));

  state.currentQuestions = words.map((w,i)=>({ qid:"pv"+i, word:w.word, senses:w.senses }));
  state.answers = {};
  state.screen = "pvTest";
  saveProgressToStorage();
  render();
}

function pvPromptFor(q){
  if(state.pvDirection === "enWrite"){
    // 한글 뜻 보여주고 영어 쓰기: 모든 의미를 다 보여줌
    return q.senses.map(s=>s.join(", ")).join(" / ");
  }
  const hint = q.senses.length > 1 ? ` <span style="color:var(--muted);font-size:12.5px;">(뜻 ${q.senses.length}개)</span>` : "";
  return q.word + hint;
}

// point voca 전용 느슨한 한글 비교: 괄호/물결표/공백 무시하고, 완전히 다른 경우만 오답 처리
function pvNormalizeKr(s){
  return (s||"").toString().trim()
    .replace(/[\(（][^\)）]*[\)）]/g, "")
    .replace(/\[[^\]]*\]/g, "")
    .replace(/[~∼]/g, "")
    .replace(/\s+/g, "")
    .toLowerCase();
}
function pvCharSimilarity(a, b){
  if(!a.length || !b.length) return a === b ? 1 : 0;
  const bigrams = s=>{ const set=new Map(); for(let i=0;i<s.length-1;i++){ const bg=s.slice(i,i+2); set.set(bg,(set.get(bg)||0)+1); } return set; };
  const A = bigrams(a), B = bigrams(b);
  let inter = 0;
  A.forEach((cnt, bg)=>{ if(B.has(bg)) inter += Math.min(cnt, B.get(bg)); });
  const totalA = [...A.values()].reduce((s,v)=>s+v,0);
  const totalB = [...B.values()].reduce((s,v)=>s+v,0);
  const union = totalA + totalB - inter;
  return union ? inter/union : 1;
}
function pvKrMatches(given, syn){
  const g = pvNormalizeKr(given), s = pvNormalizeKr(syn);
  if(!g || !s) return false;
  if(g === s) return true;
  if(g.includes(s) || s.includes(g)) return true; // 어미 차이 등 부분 포함이면 인정
  return pvCharSimilarity(g, s) >= 0.5; // 그 외엔 비슷한 정도로 판단 (어미/조사 차이 등 포용)
}

function isPvCorrect(q, given){
  const g = (given||"").trim();
  if(!g) return false;
  if(state.pvDirection === "enWrite"){
    const answerWord = q.word.replace(/\s*\([^)]*\)\s*/g, "").trim();
    return normalize(g) === normalize(answerWord);
  }
  // krWrite: 학생이 쓴 걸 조각내서, 그중 하나라도 정답 의미 중 하나와 비슷하면 정답으로 인정
  // (뜻이 여러 개여도 학생이 하나라도 제대로 맞히면 정답 처리 — 여러 개 쓰는 건 권장 사항일 뿐, 감점 요소 아님)
  const tokens = g.split(/[\/,;、，]/).map(t=>t.trim()).filter(Boolean);
  const allTokens = tokens.length ? tokens : [g];
  return q.senses.some(clause => clause.some(syn => allTokens.some(t => pvKrMatches(t, syn))));
}

async function submitPvTest(){

  const qs = state.currentQuestions;
  let correctCount = 0;
  const wrongs = [];
  qs.forEach(q=>{

  state.pvTotal = qs.length;
  state.pvWrongs = wrongs;

/* ====================== 시험 준비 (단어장) ====================== */
function prepareTest(){
  const book = CATEGORIES[state.categoryId].books[state.bookId];
  const words = book.days[state.day];
  state.round = 1;
  state.firstScore = null;
  state.totalQuestions = words.length;
  state.currentQuestions = words.map((w,i)=> buildQuestion(w, i));
  state.originalQuestions = state.currentQuestions.slice();
  state.answers = {};
  state.drillMode = false;
  saveProgressToStorage();
}
function buildQuestion(w, i){
  if(w.type === "polysemy"){
    return { qid: "q"+i, mode: "polysemy", word: w.word, hint: w.hint, meanings: w.meanings };
  }
  return { qid: "q"+i, mode: "word", kor: w.kor, eng: w.eng };
}

/* ====================== 채점 + 라운드 진행 ====================== */
async function submitRound(){
  state.submitting = true;
  const btn = document.getElementById("btn-submit");
  if(btn){ btn.disabled = true; btn.textContent = "채점 중..."; }

  const qs = state.currentQuestions;
  const wrongs = [];
  let correctCount = 0;
  qs.forEach(q=>{
    const given = state.answers[q.qid];
    if(q.mode === "polysemy"){
      if(isPolysemyCorrect(given, q.meanings)){
        correctCount++;
      } else {
        wrongs.push({ qid: q.qid, mode:"polysemy", word:q.word, hint:q.hint, meanings:q.meanings, myAnswer: given || "(미응답)" });
      }
    } else {
      if(isCorrectAnswer(given, q.eng)){
        correctCount++;
      } else {
        wrongs.push({ qid: q.qid, mode:"word", kor: q.kor, eng: q.eng, myAnswer: given || "(미응답)" });
      }
    }
  });

  if(state.round === 1){
    state.firstScore = correctCount;
  }
  state.submitting = false;

  if(!wrongs.length){
    // 다 맞음 -> 바로 통과
    await savePassRecord(); // 항상 state.firstScore로 기록됨
    clearProgressStorage();
    state.screen = "passed";
    render();
    return;
  }

  state.lastRoundWrongs = wrongs;
  state.lastRoundCorrect = correctCount;
  state.lastRoundTotal = qs.length;

  if(state.drillMode){
    // 이미 틀린 것만 반복하는 중 -> 계속 그 상태 유지
    state.lastRoundForceFull = false;
    state.lastRoundJustLocked = false;
    state.lastRoundJustEnteredDrill = false;
  } else if(wrongs.length <= 2){
    // 커트라인(-2) 이내지만 완벽하진 않음 -> 틀린 것만 한 번 더 보여주고 통과 (전체 재시험은 아님)
    state.drillMode = true;
    state.lastRoundForceFull = false;
    state.lastRoundJustLocked = false;
    state.lastRoundJustEnteredDrill = true;
  } else if(state.round >= 3){
    // 3번째 시도까지도 3개 이상 오답 -> 처음 점수로 확정, 이후로는 틀린 것만 연습 모드로 전환
    state.drillMode = true;
    state.lastRoundForceFull = false;
    state.lastRoundJustLocked = true;
    state.lastRoundJustEnteredDrill = false;
  } else {
    // 3개 이상 오답, 아직 전체 재시험 기회 있음 -> 공부하고 처음부터 다시
    state.lastRoundForceFull = true;
    state.lastRoundJustLocked = false;
    state.lastRoundJustEnteredDrill = false;
  }

  state.screen = "roundResult";
  render();
}

function renderRoundResult(){
  const wrongs = state.lastRoundWrongs;
  const book = CATEGORIES[state.categoryId].books[state.bookId];
  const forceFull = state.lastRoundForceFull;
  const justLocked = state.lastRoundJustLocked;
  const justEnteredDrill = state.lastRoundJustEnteredDrill;

  let statusMsg, buttonLabel;
  if(forceFull){
    statusMsg = `${wrongs.length}개 틀렸어. 3개 이상 틀리면 공부하고 처음부터 다시 봐야 해! (${state.round}/3번째 시도)`;
    buttonLabel = "📖 다시 공부하고 시험보기";
  } else if(justLocked){
    statusMsg = `3번 도전했지만 아직 ${wrongs.length}개가 남았어. 점수는 처음 시험 점수(${state.firstScore}/${state.totalQuestions})로 확정됐고, 이제부터는 틀린 문제만 완전히 맞힐 때까지 연습할게!`;
    buttonLabel = "🔁 틀린 문제만 연습하기";
  } else if(justEnteredDrill){
    statusMsg = `${wrongs.length}개 틀렸지만 통과 기준(최대 2개)엔 들었어! 그래도 확실히 익히게 틀린 것만 한 번 더 볼게 (점수는 이미 확정됨)`;
    buttonLabel = "🔁 틀린 문제만 다시 풀기";
  } else {
    statusMsg = `아직 ${wrongs.length}개 남았어. 다 맞을 때까지 틀린 것만 다시 풀어보자 (점수는 이미 확정됨)`;
    buttonLabel = "🔁 틀린 문제만 다시 풀기";
  }

  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot"><img src="logo.png" alt="Point Junior"></div><div class="brand"><b>${book.label}</b> · Day ${state.day}</div></div>
    <h1>${state.round}번째 결과</h1>
    <div class="card center">
      <div class="score-big">${state.lastRoundCorrect} / ${state.lastRoundTotal}</div>
      <div class="score-sub">${statusMsg}</div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">❌ 틀린 문제</div>
      ${wrongs.map((w,i)=>{
        if(w.mode === "polysemy"){
          return `<div class="wrong-item">
            <div class="q">${i+1}. ${w.word} (${w.hint})</div>
            <div class="a">정답: ${w.meanings.join(" / ")}</div>
            <div class="mine">내 답: ${w.myAnswer}</div>
          </div>`;
        }
        return `<div class="wrong-item">
          <div class="q">${i+1}. ${w.kor}</div>
          <div class="a">정답: ${w.eng}</div>
          <div class="mine">내 답: ${w.myAnswer}</div>
        </div>`;
      }).join("")}
    </div>
    <button class="btn-primary" id="btn-retry">${buttonLabel}</button>
  `;
  document.getElementById("btn-retry").onclick = ()=>{
    if(forceFull){
      state.screen = "studyReview";
      saveProgressToStorage();
      render();
      return;
    }
    // 드릴 모드(막 들어왔거나 계속 중) -> 틀린 것만 다시
    state.currentQuestions = wrongs.map(w=> w.mode === "polysemy"
      ? { qid: w.qid, mode:"polysemy", word:w.word, hint:w.hint, meanings:w.meanings }
      : { qid: w.qid, mode:"word", kor: w.kor, eng: w.eng }
    );
    state.answers = {};
    state.round += 1;
    state.screen = "test";
    saveProgressToStorage();
    render();
  };
}

  let usedIds = new Set();
  try{
    const curSnap = await withTimeout(db.collection("pointVocaSchedule").doc("current").get());
    if(curSnap.exists) currentRangeId = curSnap.data().rangeId;
  }catch(err){ console.error(err.message); }

  try{
    const logSnap = await withTimeout(db.collection("pointVocaScheduleLog").orderBy("setAt","desc").get());
    const historyEl = document.getElementById("pv-sched-history");
    const entries = logSnap.docs.map(d=>d.data());
    entries.forEach(e=> usedIds.add(e.rangeId));
    if(!entries.length){
      historyEl.innerHTML = `<div class="empty">아직 설정한 적 없어요</div>`;
    } else {
      historyEl.innerHTML = entries.map(e=>`
        <div class="history-item"><div class="t">${e.label}</div><div class="m">${new Date(e.setAt).toLocaleString('ko-KR')}</div></div>
      `).join("");
    }
  }catch(err){
    document.getElementById("pv-sched-history").innerHTML = `<div class="err">이력을 불러오지 못했어요 (${err.message})</div>`;
  }

  if(currentRangeId) usedIds.add(currentRangeId);
  const progressGrid = document.getElementById("pv-progress-grid");
  progressGrid.innerHTML = POINTVOCA_RANGES.map(r=>`
    <div class="daybtn" style="${r.id===currentRangeId ? 'border-color:var(--gold);background:rgba(212,175,106,.12);' : ''}">
      <div class="n" style="font-size:13px;">${usedIds.has(r.id) ? "✅" : "⬜"} ${r.label}</div>
    </div>
  `).join("");

  const select = document.getElementById("pv-sched-select");
  if(currentRangeId) select.value = currentRangeId;

  document.getElementById("pv-sched-save").onclick = async ()=>{
    const rangeId = select.value;
    const range = POINTVOCA_RANGES.find(r=>r.id===rangeId);
    const msg = document.getElementById("pv-sched-msg");
    try{
      await withTimeout(db.collection("pointVocaSchedule").doc("current").set({
        rangeId, label: range.label, setAt: new Date().toISOString()
      }));
      await withTimeout(db.collection("pointVocaScheduleLog").add({
        rangeId, label: range.label, setAt: new Date().toISOString()
      }));
      msg.innerHTML = `<div class="ok-msg">✅ "${range.label}"로 설정했어요</div>`;
      renderTeacherPvSchedule();
    }catch(err){
      msg.innerHTML = `<div class="err">저장 실패: ${err.message}</div>`;
    }
  };
}

/* ====================== Daily Test 등록 (선생님) ====================== */
async function renderTeacherDailyTest(){
  const todayLabel = new Date().toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot"><img src="logo.png" alt="Point Junior"></div><div class="brand"><b>Point Junior</b> 단어시험 관리</div></div>
    <h1>📝 Daily Test 등록</h1>
    <div class="sub">한 줄에 "한글,영어" 형식으로 하나씩 입력해줘 (예: 사과,apple). 등록하면 학생 화면 Daily Test 폴더에 바로 나타나요.</div>
    <div class="card">
      <label>제목 (기본은 오늘 날짜)</label>
      <input type="text" id="dt-label" value="${todayLabel}" placeholder="예: 8월 18일 Daily Test">
      <label>단어 목록</label>
      <textarea id="dt-words" rows="10" placeholder="사과,apple&#10;바나나,banana&#10;..." style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px;color:inherit;font-family:inherit;font-size:14.5px;margin-top:6px;"></textarea>
      <button class="btn-primary" id="dt-save" style="margin-top:10px;">등록하기</button>
      <div id="dt-save-msg"></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">등록된 Daily Test 목록</div>
      <div id="dt-list" class="sub">불러오는 중...</div>
    </div>
    <button class="btn-ghost" id="btn-back-dt">← 관리 화면으로</button>
  `;
  document.getElementById("btn-back-dt").onclick = ()=>{ state.screen = "teacherDashboard"; render(); };

  document.getElementById("dt-save").onclick = async ()=>{
    const label = document.getElementById("dt-label").value.trim();
    const raw = document.getElementById("dt-words").value;
    const msg = document.getElementById("dt-save-msg");
    if(!label){ msg.innerHTML = `<div class="err">제목을 입력해줘</div>`; return; }
    const words = raw.split("\n").map(line=>{
      const parts = line.split(",");
      if(parts.length < 2) return null;
      const kor = parts[0].trim();
      const eng = parts.slice(1).join(",").trim();
      if(!kor || !eng) return null;
      return { kor, eng };
    }).filter(Boolean);
    if(!words.length){ msg.innerHTML = `<div class="err">"한글,영어" 형식으로 한 줄에 하나씩 입력해줘</div>`; return; }
    try{
      await withTimeout(db.collection("dailyTests").add({
        label, words, createdAt: new Date().toISOString()
      }));
      msg.innerHTML = `<div class="ok-msg">✅ ${words.length}개 단어로 등록했어요</div>`;
      document.getElementById("dt-words").value = "";
      loadDailyTestList();
    }catch(err){
      msg.innerHTML = `<div class="err">등록 실패: ${err.message}</div>`;
    }
  };

  async function loadDailyTestList(){
    const listEl = document.getElementById("dt-list");
    try{
      const snap = await withTimeout(db.collection("dailyTests").orderBy("createdAt","desc").get());
      if(!snap.docs.length){
        listEl.innerHTML = `<div class="empty">아직 등록한 Daily Test가 없어요</div>`;
        return;
      }
      listEl.innerHTML = snap.docs.map(doc=>{
        const d = doc.data();
        return `<div class="history-item" data-id="${doc.id}">
          <div class="t">${d.label} <span style="color:var(--muted);font-size:12px;">(${(d.words||[]).length}단어)</span></div>
          <button class="link-btn dt-del" data-id="${doc.id}">삭제</button>
        </div>`;
      }).join("");
      listEl.querySelectorAll(".dt-del").forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm("이 Daily Test를 삭제할까? 학생 화면에서도 사라져요.")) return;
          try{
            await withTimeout(db.collection("dailyTests").doc(btn.dataset.id).delete());
            loadDailyTestList();
          }catch(err){
            alert("삭제 실패: " + err.message);
          }
        };
      });
    }catch(err){
      listEl.innerHTML = `<div class="err">목록을 불러오지 못했어요 (${err.message})</div>`;
    }
  }
  loadDailyTestList();
}

/* ====================== 신규 학생 등록 (선생님) ====================== */
async function renderTeacherAddStudent(){
  const classes = [...new Set(STUDENTS.map(s=>s.class))].filter(c=>c!=="테스트").sort();
  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot"><img src="logo.png" alt="Point Junior"></div><div class="brand"><b>Point Junior</b> 단어시험 관리</div></div>
    <h1>👤 신규 학생 등록</h1>
    <div class="sub">비밀번호 없이 이름만으로 로그인하니까, 이름이랑 반만 등록하면 바로 시험 볼 수 있어요.</div>
    <div class="card">
      <label>이름</label>
      <input type="text" id="as-name" placeholder="예: 김하늘">
      <label>반</label>
      <input type="text" id="as-class" list="as-class-list" placeholder="예: CL1">
      <datalist id="as-class-list">${classes.map(c=>`<option value="${c}">`).join("")}</datalist>
      <div id="as-msg"></div>
      <button class="btn-primary" id="as-save" style="margin-top:10px;">등록하기</button>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">새로 등록한 학생 (기존 명단 제외)</div>
      <div id="as-list" class="sub">불러오는 중...</div>
    </div>
    <button class="btn-ghost" id="btn-back-as">← 관리 화면으로</button>
  `;
  document.getElementById("btn-back-as").onclick = ()=>{ state.screen = "teacherDashboard"; render(); };

  document.getElementById("as-save").onclick = async ()=>{
    const name = document.getElementById("as-name").value.trim();
    const cls = document.getElementById("as-class").value.trim();
    const msg = document.getElementById("as-msg");
    if(!name || !cls){ msg.innerHTML = `<div class="err">이름이랑 반을 다 입력해줘</div>`; return; }
    if(STUDENTS.some(s=>s.name===name)){
      msg.innerHTML = `<div class="err">이미 있는 이름이야. 동명이인이면 이름을 다르게 등록해줘 (예: 김하늘2)</div>`;
      return;
    }
    try{
      await withTimeout(db.collection("students").add({ name, class: cls, addedAt: new Date().toISOString() }));
      STUDENTS.push({ name, class: cls });
      msg.innerHTML = `<div class="ok-msg">✅ "${name}" (${cls}) 등록 완료! 바로 로그인 가능해요</div>`;
      document.getElementById("as-name").value = "";
      document.getElementById("as-class").value = "";
      loadAddedStudents();
    }catch(err){
      msg.innerHTML = `<div class="err">등록 실패: ${err.message}</div>`;
    }
  };

  async function loadAddedStudents(){
    const listEl = document.getElementById("as-list");
    try{
      const snap = await withTimeout(db.collection("students").orderBy("addedAt","desc").get());
      if(!snap.docs.length){
        listEl.innerHTML = `<div class="empty">아직 새로 등록한 학생이 없어요</div>`;
        return;
      }
      listEl.innerHTML = snap.docs.map(doc=>{
        const d = doc.data();
        return `<div class="history-item" data-id="${doc.id}">
          <div class="t">${d.name} <span style="color:var(--muted);font-size:12px;">(${d.class})</span></div>
          <button class="link-btn as-del" data-id="${doc.id}" data-name="${d.name}">삭제</button>
        </div>`;
      }).join("");
      listEl.querySelectorAll(".as-del").forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm("이 학생을 삭제할까?")) return;
          try{
            await withTimeout(db.collection("students").doc(btn.dataset.id).delete());
            const idx = STUDENTS.findIndex(s=>s.name===btn.dataset.name);
            if(idx > -1) STUDENTS.splice(idx, 1);
            loadAddedStudents();
          }catch(err){
            alert("삭제 실패: " + err.message);
          }
        };
      });
    }catch(err){
      listEl.innerHTML = `<div class="err">목록을 불러오지 못했어요 (${err.message})</div>`;
    }
  }
  loadAddedStudents();
}
</script>
</body>
