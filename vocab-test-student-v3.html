<style>
  :root{
    --navy-1:#0b1530; --navy-2:#132352; --navy-3:#1b2f6b;

    --ok:#4fd1a5; --bad:#ff6b6b; --warn:#f5b942; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,var(--navy-1),var(--navy-3) 60%,var(--navy-2));
    min-height:100vh;color:var(--ink);}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .logo-row{display:flex;align-items:center;gap:10px;margin:6px 0 18px;}
  .logo-dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-1);font-size:15px;}
  .brand{font-size:15px;color:var(--muted);}
  .brand b{color:var(--ink);}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .card{background:linear-gradient(155deg,#152a5e,#0f1c42);border:1px solid rgba(212,175,106,.18);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  select,input[type=text],input[type=password]{width:100%;background:#0c1636;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15px;margin-top:6px;font-family:inherit;}
  label{font-size:13px;color:var(--muted);display:block;margin-top:12px;}
  button{font-family:inherit;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy-1);width:100%;margin-top:16px;}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ink);width:100%;margin-top:10px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
  .daybtn{background:#0c1738;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;}
  .daybtn:active{transform:scale(.97);}
  .daybtn .n{font-size:16px;font-weight:800;color:var(--gold-2);}
  .daybtn .c{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .folder-card{background:#0c1738;border:1px solid rgba(212,175,106,.2);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;}
  .folder-card:active{transform:scale(.98);}
  .folder-emoji{font-size:26px;}
  .folder-title{font-weight:700;font-size:15.5px;}
  .folder-meta{font-size:12px;color:var(--muted);}
  .qcard{background:#0c1738;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.07);}
  .qnum{color:var(--gold-2);font-weight:800;font-size:12.5px;margin-bottom:5px;}
  .qtext{font-size:16px;line-height:1.5;margin-bottom:8px;}
  .err{color:var(--bad);font-size:13px;margin-top:8px;}
  .ok-msg{color:var(--ok);font-size:13px;margin-top:8px;}
  .center{text-align:center;}
  .score-big{font-size:42px;font-weight:800;text-align:center;margin:10px 0 2px;color:var(--gold-2);}
  .score-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:4px;}
  .round-badge{display:inline-block;background:rgba(212,175,106,.15);color:var(--gold-2);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px;}
  .wrong-item{background:#0c1738;border-left:3px solid var(--bad);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .wrong-item .q{font-size:13.5px;margin-bottom:3px;}
  .wrong-item .a{font-size:13px;color:var(--ok);}
  .wrong-item .mine{font-size:12px;color:var(--bad);margin-top:2px;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0;font-weight:400;cursor:pointer;}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px;}
  .history-item{background:#0c1738;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;}
  .history-item .t{font-weight:700;margin-bottom:2px;}
  .history-item .m{color:var(--muted);font-size:12px;}
  .progress-bar{height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin:8px 0 14px;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));}
</style>

function normalize(s){
  return (s||"").toString().trim().toLowerCase().replace(/\s+/g," ");
}
function isCorrectAnswer(given, engField){
  const options = String(engField).split("/").map(s=>s.trim()).filter(Boolean);
  const g = normalize(given);
  return options.some(o => normalize(o) === g);
}
function isPolysemyCorrect(given, meaningsArr){
  const tokens = (given||"").split(/[\/,;、，]|\n/).map(normalize).filter(Boolean);
  return meaningsArr.every(m => tokens.some(t => t === normalize(m)));
}

  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error("요청이 너무 오래 걸려요. 인터넷 연결을 확인해줘.")), ms))
  ]);
}

/* ====================== 시험 준비 ====================== */
function prepareTest(){
  const book = WORDBOOKS[state.bookId];
  const words = book.days[state.day];
  state.round = 1;
  state.firstScore = null;
  state.totalQuestions = words.length;
  state.currentQuestions = words.map((w,i)=> buildQuestion(w, i));
  state.answers = {};
}
function buildQuestion(w, i){
  if(w.type === "polysemy"){
    return { qid: "q"+i, mode: "polysemy", word: w.word, hint: w.hint, meanings: w.meanings };
  }
  return { qid: "q"+i, mode: "word", kor: w.kor, eng: w.eng };
}

/* ====================== 화면4: 시험 ====================== */
function renderTest(){
  const qs = state.currentQuestions;
  const book = WORDBOOKS[state.bookId];
  const hasPolysemy = qs.some(q=>q.mode==="polysemy");
  const hasWord = qs.some(q=>q.mode==="word");
  const instruction = hasPolysemy && !hasWord
    ? "영단어를 보고 그 단어의 뜻을 (여러 개면 다 / 로 구분해서) 써줘"
    : hasPolysemy && hasWord
      ? "영어 단어 문제는 뜻을, 뜻 문제는 영단어를 써줘"
      : "뜻을 보고 알맞은 영단어를 입력해줘";
  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot">P</div><div class="brand"><b>${book.label}</b> · Day ${state.day}</div></div>
    ${state.round > 1 ? `<div class="round-badge">🔁 ${state.round}번째 시도 · 틀린 문제만</div>` : `<div class="round-badge">1차 시험 · ${qs.length}문제</div>`}
    <h1>써줘 ✍️</h1>
    <div class="sub">${state.studentName} 학생 · ${instruction}</div>
    <div id="qlist"></div>
    <button class="btn-primary" id="btn-submit">제출하기</button>
  `;
  const qlist = document.getElementById("qlist");
  qlist.innerHTML = qs.map((q,i)=>{
    if(q.mode === "polysemy"){
      return `<div class="qcard">
        <div class="qnum">문제 ${i+1} · 다의어</div>
        <div class="qtext">${q.word} <span style="color:var(--muted);font-size:12.5px;">(${q.hint})</span></div>
        <input type="text" id="ans_${q.qid}" placeholder="뜻을 여러 개면 / 로 구분해서 써줘" autocomplete="off" spellcheck="false">
      </div>`;
    }
    return `<div class="qcard">
      <div class="qnum">문제 ${i+1}</div>
      <div class="qtext">${q.kor}</div>
      <input type="text" id="ans_${q.qid}" placeholder="영어로 입력해줘" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>`;
  }).join("");
  qlist.querySelectorAll("input[type=text]").forEach(inp=>{
    inp.oninput = ()=>{ state.answers[inp.id.replace("ans_","")] = inp.value; };
  });
  document.getElementById("btn-submit").onclick = ()=>{
    if(state.submitting) return;
    if(confirm("제출할까?")) submitRound();
  };
}

/* ====================== 채점 + 라운드 진행 ====================== */
async function submitRound(){
  state.submitting = true;
  const btn = document.getElementById("btn-submit");
  if(btn){ btn.disabled = true; btn.textContent = "채점 중..."; }

  const qs = state.currentQuestions;
  const wrongs = [];
  let correctCount = 0;
  qs.forEach(q=>{
    const given = state.answers[q.qid];
    if(q.mode === "polysemy"){
      if(isPolysemyCorrect(given, q.meanings)){
        correctCount++;
      } else {
        wrongs.push({ qid: q.qid, mode:"polysemy", word:q.word, hint:q.hint, meanings:q.meanings, myAnswer: given || "(미응답)" });
      }
    } else {
      if(isCorrectAnswer(given, q.eng)){
        correctCount++;
      } else {
        wrongs.push({ qid: q.qid, mode:"word", kor: q.kor, eng: q.eng, myAnswer: given || "(미응답)" });
      }
    }
  });

  if(state.round === 1){
    state.firstScore = correctCount;
  }

  state.submitting = false;

  if(!wrongs.length){
    // 통과!
    await savePassRecord();
    state.screen = "passed";
    render();
  } else {
    state.lastRoundWrongs = wrongs;
    state.lastRoundCorrect = correctCount;
    state.lastRoundTotal = qs.length;
    state.screen = "roundResult";
    render();
  }
}

function renderRoundResult(){
  const wrongs = state.lastRoundWrongs;
  const book = WORDBOOKS[state.bookId];
  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot">P</div><div class="brand"><b>${book.label}</b> · Day ${state.day}</div></div>
    <h1>${state.round}번째 결과</h1>
    <div class="card center">
      <div class="score-big">${state.lastRoundCorrect} / ${state.lastRoundTotal}</div>
      <div class="score-sub">틀린 ${wrongs.length}개는 다시 풀어야 해</div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">❌ 틀린 문제</div>
      ${wrongs.map((w,i)=>{
        if(w.mode === "polysemy"){
          return `<div class="wrong-item">
            <div class="q">${i+1}. ${w.word} (${w.hint})</div>
            <div class="a">정답: ${w.meanings.join(" / ")}</div>
            <div class="mine">내 답: ${w.myAnswer}</div>
          </div>`;
        }
        return `<div class="wrong-item">
          <div class="q">${i+1}. ${w.kor}</div>
          <div class="a">정답: ${w.eng}</div>
          <div class="mine">내 답: ${w.myAnswer}</div>
        </div>`;
      }).join("")}
    </div>
    <button class="btn-primary" id="btn-retry">🔁 틀린 문제만 다시 풀기</button>
  `;
  document.getElementById("btn-retry").onclick = ()=>{
    state.currentQuestions = wrongs.map(w=> w.mode === "polysemy"
      ? { qid: w.qid, mode:"polysemy", word:w.word, hint:w.hint, meanings:w.meanings }
      : { qid: w.qid, mode:"word", kor: w.kor, eng: w.eng }
    );
    state.answers = {};
    state.round += 1;
    state.screen = "test";
    render();
  };
}

/* ====================== 통과 저장 + 화면 ====================== */
async function savePassRecord(){
  const book = WORDBOOKS[state.bookId];
  try{
    await withTimeout(db.collection("vocabTestResults").add({
      studentName: state.studentName,
      wordbookId: state.bookId,
      wordbookLabel: book.label,
      day: state.day,
      firstScore: state.firstScore,
      totalQuestions: state.totalQuestions,
      rounds: state.round,
      passedAt: new Date().toISOString()
    }));
  }catch(err){
    console.error("기록 저장 실패:", err.message);
    // 저장 실패해도 학생 화면은 통과 처리로 계속 진행 (다시 시험 안 보게)
  }
}

function renderPassed(){
  const book = WORDBOOKS[state.bookId];
  const pct = Math.round((state.firstScore/state.totalQuestions)*100);
  app.innerHTML = `
    <div class="logo-row"><div class="logo-dot">P</div><div class="brand"><b>${book.label}</b> · Day ${state.day}</div></div>
    <h1>🎉 통과했어!</h1>
    <div class="card center">
      <div class="score-big">${state.firstScore} / ${state.totalQuestions}</div>
      <div class="score-sub">1차 시험 점수 (${pct}점)</div>
      <div class="progress-bar"><div class="fill" style="width:${pct}%;"></div></div>
      <div class="score-sub">${state.round}번 만에 다 맞혔어!</div>
    </div>
    <button class="btn-primary" id="btn-another-day">다른 Day 보기</button>
    <button class="btn-ghost" id="btn-retest-same">이 Day 다시 풀기</button>
  `;
  document.getElementById("btn-another-day").onclick = ()=>{ state.screen = "days"; render(); };
  document.getElementById("btn-retest-same").onclick = ()=>{ prepareTest(); state.screen = "test"; render(); };
}

  `;

      .where("studentName","==",state.studentName).get());
    const records = snap.docs.map(d=>d.data()).sort((a,b)=> (b.passedAt||"").localeCompare(a.passedAt||""));
