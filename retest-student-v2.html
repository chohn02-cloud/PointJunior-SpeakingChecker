<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포인트 주니어 재시험</title>
<style>
  :root{
    --navy-1:#0b1530;
    --navy-2:#132352;
    --navy-3:#1b2f6b;
    --gold:#d4af6a;
    --gold-2:#f0d998;
    --ink:#e9edf7;
    --muted:#9aa5c7;
    --card:#101a3d;
    --card-2:#152a5e;
    --ok:#4fd1a5;
    --bad:#ff6b6b;
    --warn:#f5b942;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,var(--navy-1),var(--navy-3) 60%,var(--navy-2));
    min-height:100vh;
    color:var(--ink);
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .logo-row{display:flex;align-items:center;gap:10px;margin:8px 0 22px;}
  .logo-dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-1);font-size:15px;}
  .brand{font-size:15px;letter-spacing:.5px;color:var(--muted);}
  .brand b{color:var(--ink);}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .card{
    background:linear-gradient(155deg,#152a5e,#0f1c42);
    border:1px solid rgba(212,175,106,.18);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  select,input[type=text],input[type=date],input[type=time],input[type=password],textarea{
    width:100%;
    background:#0c1636;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:12px 14px;
    color:var(--ink);
    font-size:15px;
    margin-top:6px;
  }
  label{font-size:13px;color:var(--muted);display:block;margin-top:12px;}
  button{
    font-family:inherit;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy-1);width:100%;margin-top:16px;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ink);width:100%;margin-top:10px;}
  .btn-danger{background:rgba(255,107,107,.15);color:var(--bad);border:1px solid rgba(255,107,107,.4);width:100%;margin-top:10px;}
  .badge{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700;letter-spacing:.2px;}
  .b-wait{background:rgba(154,165,199,.18);color:var(--muted);}
  .b-ready{background:rgba(212,175,106,.18);color:var(--gold-2);}
  .b-progress{background:rgba(79,209,165,.15);color:var(--ok);}
  .b-review{background:rgba(245,185,66,.18);color:var(--warn);}
  .b-pass{background:rgba(79,209,165,.22);color:var(--ok);}
  .b-fail{background:rgba(255,107,107,.18);color:var(--bad);}
  .rt-title{font-size:16.5px;font-weight:700;margin:2px 0 4px;}
  .rt-meta{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .qcard{background:#0c1738;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07);}
  .qnum{color:var(--gold-2);font-weight:800;font-size:13px;margin-bottom:6px;}
  .qtext{font-size:15.5px;line-height:1.55;margin-bottom:10px;white-space:pre-wrap;}
  .choice{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);margin-bottom:8px;cursor:pointer;}
  .choice.selected{border-color:var(--gold);background:rgba(212,175,106,.12);}
  .choice input{accent-color:var(--gold);}
  .modal-bg{position:fixed;inset:0;background:rgba(4,8,22,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--navy-2);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px 26px;border-top:1px solid rgba(212,175,106,.3);}
  .modal h3{margin:0 0 6px;font-size:17px;}
  .modal p{color:var(--muted);font-size:13.5px;margin:0 0 8px;}
  .timer{position:sticky;top:0;background:var(--navy-1);padding:10px 14px;border-radius:14px;text-align:center;font-weight:800;font-size:15px;color:var(--gold-2);margin-bottom:14px;z-index:5;border:1px solid rgba(212,175,106,.25);}
  .wrong-item{background:#0c1738;border-left:3px solid var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .wrong-item .q{font-size:14px;margin-bottom:4px;color:var(--ink);}
  .wrong-item .a{font-size:13.5px;color:var(--ok);}
  .wrong-item .mine{font-size:12.5px;color:var(--bad);margin-top:2px;}
  .center{text-align:center;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
  .score-big{font-size:44px;font-weight:800;text-align:center;margin:10px 0 2px;color:var(--gold-2);}
  .score-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0;font-weight:400;cursor:pointer;}
  .err{color:var(--bad);font-size:13px;margin-top:8px;}
  .slot{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .slot input{flex:1;}
  .slot-remove{background:rgba(255,107,107,.15);color:var(--bad);padding:10px 12px;border-radius:10px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
/* ====================== 설정 (여기만 수정하면 됩니다) ====================== */

// TODO: 기존 point-junior-speaking 프로젝트의 Firebase config를 그대로 붙여넣으세요
// (PointJunior-SpeakingChecker 또는 All Write 앱에서 쓰던 값과 동일해야 같은 DB를 씁니다)
const firebaseConfig = {
  apiKey: "AIzaSyDYOJZNuB72oFPskOunQa0V98eaXFuyfiw",
  authDomain: "point-junior-speaking.firebaseapp.com",
  projectId: "point-junior-speaking",
  storageBucket: "point-junior-speaking.firebasestorage.app",
  messagingSenderId: "155258649103",
  appId: "1:155258649103:web:3eb93c3a79c078acd7817a",
  measurementId: "G-G689DSZZZ5"
};

// 재시험 관리 화면(retest-teacher.html)에서 시험을 만들 때 쓰는 것과 동일한 비번입니다.
// 학생 화면에서 "선생님 확인"에 쓰이는 즉석 승인용 PIN (선생님이 학생 옆에서 직접 입력)
const TEACHER_PIN = "2384";

// 통과 커트라인: 이 개수 "이내"로 틀리면 통과
const PASS_CUTOFF_WRONG = 7;

// TODO: 학급/학생 명단 - 기존 앱들과 동일하게 하드코딩 방식 사용
const CLASSES = {
  "E.S.1반": ["김민준", "이서연", "박도윤"],
  "E.S.2반": ["최지우", "정하윤", "강시우"],
  "E.S.3반": ["윤서준", "임하은", "조은우"],
  "P-E.S반": ["한지호", "오수아"],
  "중1반": ["신유진", "배준호"],
  "중2반": ["송민서", "황태윤"],
  "중3반": ["문가온", "장서윤"]
};

/* ====================== Firebase 초기화 ====================== */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ====================== 상태 ====================== */
let state = {
  screen: "login",
  className: null,
  studentName: null,
  assignments: [],
  activeAssignment: null,
  activeExam: null,
  answers: {},
  timeLeftSec: null,
  timerHandle: null,
  gradeResult: null,
  error: null
};

const app = document.getElementById("app");

function render(){
  if(state.screen === "login") return renderLogin();
  if(state.screen === "dashboard") return renderDashboard();
  if(state.screen === "exam") return renderExam();
  if(state.screen === "graded") return renderGraded();
  if(state.screen === "reschedule") return renderReschedule();
}

/* ====================== 로그인 ====================== */
function renderLogin(){
  const classOptions = Object.keys(CLASSES).map(c=>`<option value="${c}">${c}</option>`).join("");
  app.innerHTML = `
    <div class="logo-row">
      <div class="logo-dot">P</div>
      <div class="brand"><b>Point Junior</b> 재시험</div>
    </div>
    <h1>안녕! 반가워 👋</h1>
    <div class="sub">반이랑 이름 선택하고 들어와줘</div>
    <div class="card">
      <label>반</label>
      <select id="sel-class">
        <option value="">반 선택</option>
        ${classOptions}
      </select>
      <label>이름</label>
      <select id="sel-name" disabled>
        <option value="">반을 먼저 선택해줘</option>
      </select>
      <div id="login-err" class="err" style="display:none;"></div>
      <button class="btn-primary" id="btn-login">시작하기</button>
    </div>
  `;
  const selClass = document.getElementById("sel-class");
  const selName = document.getElementById("sel-name");
  selClass.onchange = ()=>{
    const c = selClass.value;
    if(!c){ selName.disabled = true; selName.innerHTML = `<option value="">반을 먼저 선택해줘</option>`; return; }
    selName.disabled = false;
    selName.innerHTML = `<option value="">이름 선택</option>` + CLASSES[c].map(n=>`<option value="${n}">${n}</option>`).join("");
  };
  document.getElementById("btn-login").onclick = async ()=>{
    const c = selClass.value, n = selName.value;
    const errBox = document.getElementById("login-err");
    if(!c || !n){ errBox.style.display="block"; errBox.textContent="반이랑 이름을 모두 선택해줘"; return; }
    state.className = c; state.studentName = n;
    await loadAssignments();
    state.screen = "dashboard";
    render();
  };
}

/* ====================== 데이터 로드 ====================== */
async function loadAssignments(){
  const snap = await db.collection("retestAssignments")
    .where("studentName","==",state.studentName)
    .where("className","==",state.className)
    .get();
  state.assignments = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>{
    return (a.windowStart||"").localeCompare(b.windowStart||"");
  });
}

function nowWithinWindow(a){
  const now = new Date();
  const start = a.windowStart ? new Date(a.windowStart) : null;
  const end = a.windowEnd ? new Date(a.windowEnd) : null;
  if(start && now < start) return "before";
  if(end && now > end) return "after";
  return "within";
}

function statusBadge(a){
  const map = {
    pending: ["b-wait","응시 대기"],
    in_progress: ["b-progress","진행 중"],
    graded_awaiting_notebook: ["b-review","오답노트 작성중"],
    awaiting_final_check: ["b-review","선생님 최종확인 대기"],
    passed: ["b-pass","통과 ✅"],
    needs_reschedule: ["b-fail","재재시험 필요"],
    reschedule_requested: ["b-wait","일정 승인 대기"],
    reschedule_approved: ["b-ready","재재시험 응시 가능"]
  };
  const [cls,label] = map[a.status] || ["b-wait", a.status];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ====================== 대시보드 ====================== */
function renderDashboard(){
  const list = state.assignments;
  app.innerHTML = `
    <div class="logo-row">
      <div class="logo-dot">P</div>
      <div class="brand"><b>Point Junior</b> 재시험</div>
      <div style="margin-left:auto;">
        <button class="link-btn" id="btn-logout">로그아웃</button>
      </div>
    </div>
    <h1>${state.studentName} 학생</h1>
    <div class="sub">${state.className} · 봐야 할 재시험 목록이야</div>
    <div id="list"></div>
  `;
  document.getElementById("btn-logout").onclick = ()=>{
    state = {...state, screen:"login", className:null, studentName:null, assignments:[]};
    render();
  };
  const listBox = document.getElementById("list");
  if(!list.length){
    listBox.innerHTML = `<div class="card empty">지금은 봐야 할 재시험이 없어 🎉</div>`;
    return;
  }
  listBox.innerHTML = list.map((a,i)=>{
    const win = nowWithinWindow(a);
    const period = a.windowStart && a.windowEnd
      ? `${fmtDT(a.windowStart)} ~ ${fmtDT(a.windowEnd)}`
      : "기간 미지정";
    let actionHtml = "";
    if(a.status === "pending"){
      if(win === "before") actionHtml = `<div class="rt-meta">아직 응시 기간이 아니야 (${period})</div>`;
      else if(win === "after") actionHtml = `<div class="rt-meta" style="color:var(--bad)">응시 기간이 지났어요. 선생님께 문의해줘.</div>`;
      else actionHtml = `<button class="btn-primary" data-act="start" data-idx="${i}">응시하기</button>`;
    } else if(a.status === "graded_awaiting_notebook"){
      actionHtml = `<button class="btn-primary" data-act="notebook" data-idx="${i}">오답노트 확인하러 가기</button>`;
    } else if(a.status === "awaiting_final_check"){
      actionHtml = `<button class="btn-primary" data-act="final" data-idx="${i}">선생님 최종 확인 받기</button>`;
    } else if(a.status === "needs_reschedule"){
      actionHtml = `<button class="btn-primary" data-act="reschedule" data-idx="${i}">재재시험 일정 요청하기</button>`;
    } else if(a.status === "reschedule_requested"){
      actionHtml = `<div class="rt-meta">선생님이 일정을 확인하고 있어. 조금만 기다려줘!</div>`;
    } else if(a.status === "reschedule_approved"){
      actionHtml = `<div class="rt-meta">확정된 일정: ${fmtDT(a.approvedSchedule)}</div>`;
    }
    return `
      <div class="card">
        <div class="rt-title">${a.examTitle || "재시험"} ${statusBadge(a)}</div>
        <div class="rt-meta">${a.subject || ""} · 응시 기간: ${period}${a.attemptNumber>1 ? ` · ${a.attemptNumber}차 시험`:""}</div>
        ${actionHtml}
      </div>
    `;
  }).join("");

  listBox.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.idx;
      const a = list[idx];
      const act = btn.dataset.act;
      if(act === "start") openTeacherGate(a, startExam);
      else if(act === "notebook") { state.activeAssignment = a; state.screen = "graded"; render(); }
      else if(act === "final") openTeacherGate(a, finalizeCheck);
      else if(act === "reschedule") { state.activeAssignment = a; state.screen = "reschedule"; render(); }
    };
  });
}

function fmtDT(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const mm = d.getMonth()+1, dd = d.getDate();
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return `${mm}/${dd} ${hh}:${mi}`;
}

/* ====================== 선생님 확인(PIN) 모달 ====================== */
function openTeacherGate(assignment, onSuccess){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>선생님 확인이 필요해요 🔒</h3>
      <p>선생님, 옆에서 비밀번호를 입력해주세요.</p>
      <input type="password" id="pin-input" placeholder="비밀번호" inputmode="numeric">
      <div id="pin-err" class="err" style="display:none;">비밀번호가 틀렸어요</div>
      <button class="btn-primary" id="pin-ok">확인</button>
      <button class="btn-ghost" id="pin-cancel">취소</button>
    </div>
  `;
  document.body.appendChild(bg);
  const input = document.getElementById("pin-input");
  input.focus();
  document.getElementById("pin-cancel").onclick = ()=> bg.remove();
  document.getElementById("pin-ok").onclick = async ()=>{
    if(input.value === TEACHER_PIN){
      bg.remove();
      await onSuccess(assignment);
    } else {
      document.getElementById("pin-err").style.display = "block";
    }
  };
}

/* ====================== 시험 시작 ====================== */
async function startExam(assignment){
  const examSnap = await db.collection("retestExams").doc(assignment.examId).get();
  if(!examSnap.exists){ alert("시험 문제를 찾을 수 없어요. 선생님께 알려주세요."); return; }
  state.activeExam = { id: examSnap.id, ...examSnap.data() };
  state.activeAssignment = assignment;
  state.answers = {};
  state.timeLeftSec = (state.activeExam.timeLimitMinutes || 20) * 60;

  await db.collection("retestAssignments").doc(assignment.id).update({
    status: "in_progress",
    startedAt: new Date().toISOString()
  });
  assignment.status = "in_progress";

  state.screen = "exam";
  render();
  startTimer();
}

function startTimer(){
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timeLeftSec--;
    const el = document.getElementById("timer-display");
    if(el) el.textContent = fmtTimer(state.timeLeftSec);
    if(state.timeLeftSec <= 0){
      clearInterval(state.timerHandle);
      submitExam(true);
    }
  }, 1000);
}
function fmtTimer(s){
  if(s<0) s=0;
  const m = Math.floor(s/60), sec = s%60;
  return `⏱ ${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")} 남음`;
}

/* ====================== 시험 화면 ====================== */
function renderExam(){
  const exam = state.activeExam;
  app.innerHTML = `
    <div class="timer" id="timer-display">${fmtTimer(state.timeLeftSec)}</div>
    <h1>${exam.title}</h1>
    <div class="sub">문제를 다 풀면 아래 제출 버튼을 눌러줘</div>
    <div id="qlist"></div>
    <button class="btn-primary" id="btn-submit">제출하기</button>
  `;
  const qlist = document.getElementById("qlist");
  qlist.innerHTML = exam.questions.map((q,i)=>{
    if(q.type === "mc"){
      const choices = (q.choices||[]).map((c,ci)=>`
        <label class="choice" data-q="${q.id}" data-c="${ci}">
          <input type="radio" name="q_${q.id}" value="${ci}">
          <span>${c}</span>
        </label>
      `).join("");
      return `<div class="qcard"><div class="qnum">문제 ${i+1}</div><div class="qtext">${q.text}</div>${choices}</div>`;
    } else {
      return `<div class="qcard"><div class="qnum">문제 ${i+1}</div><div class="qtext">${q.text}</div>
        <input type="text" id="ans_${q.id}" placeholder="답을 입력해줘">
      </div>`;
    }
  }).join("");

  qlist.querySelectorAll(".choice").forEach(lbl=>{
    lbl.onclick = ()=>{
      const qid = lbl.dataset.q, cidx = lbl.dataset.c;
      state.answers[qid] = cidx;
      qlist.querySelectorAll(`.choice[data-q="${qid}"]`).forEach(l=>l.classList.remove("selected"));
      lbl.classList.add("selected");
      lbl.querySelector("input").checked = true;
    };
  });
  qlist.querySelectorAll('input[type=text]').forEach(inp=>{
    inp.oninput = ()=>{ state.answers[inp.id.replace("ans_","")] = inp.value; };
  });

  document.getElementById("btn-submit").onclick = ()=>{
    if(confirm("제출하면 다시 수정할 수 없어. 제출할까?")) submitExam(false);
  };
}

/* ====================== 자동 채점 ====================== */
function normalize(s){
  return (s||"").toString().trim().toLowerCase().replace(/\s+/g," ");
}
async function submitExam(timedOut){
  clearInterval(state.timerHandle);
  const exam = state.activeExam;
  const wrongs = [];
  let wrongCount = 0;

  exam.questions.forEach(q=>{
    const given = state.answers[q.id];
    let correct = false;
    if(q.type === "mc"){
      correct = String(given) === String(q.correctIndex);
    } else {
      const acceptable = Array.isArray(q.answer) ? q.answer : [q.answer];
      correct = acceptable.some(a => normalize(a) === normalize(given));
    }
    if(!correct){
      wrongCount++;
      wrongs.push({
        questionId: q.id,
        text: q.text,
        correctAnswer: q.type === "mc" ? (q.choices?.[q.correctIndex] ?? "") : (Array.isArray(q.answer)?q.answer[0]:q.answer),
        myAnswer: q.type === "mc" ? (q.choices?.[given] ?? "(미응답)") : (given || "(미응답)")
      });
    }
  });

  const result = {
    totalQuestions: exam.questions.length,
    wrongCount,
    wrongItems: wrongs,
    timedOut: !!timedOut,
    submittedAt: new Date().toISOString(),
    willPass: wrongCount <= PASS_CUTOFF_WRONG
  };

  await db.collection("retestAssignments").doc(state.activeAssignment.id).update({
    status: "graded_awaiting_notebook",
    gradeResult: result
  });
  state.activeAssignment.status = "graded_awaiting_notebook";
  state.activeAssignment.gradeResult = result;
  state.gradeResult = result;

  state.screen = "graded";
  render();
}

/* ====================== 채점 결과 + 오답노트 화면 ====================== */
function renderGraded(){
  const a = state.activeAssignment;
  const r = a.gradeResult;
  const wrongHtml = r.wrongItems.map((w,i)=>`
    <div class="wrong-item">
      <div class="q">${i+1}. ${w.text}</div>
      <div class="a">정답: ${w.correctAnswer}</div>
      <div class="mine">내 답: ${w.myAnswer}</div>
    </div>
  `).join("");

  const nextAction = a.status === "graded_awaiting_notebook"
    ? `<button class="btn-primary" id="btn-to-final">노트 다 썼어요! 선생님 확인받기</button>`
    : a.status === "awaiting_final_check"
      ? `<button class="btn-primary" id="btn-teacher-final">선생님 최종 확인</button>`
      : "";

  app.innerHTML = `
    <h1>채점 결과</h1>
    <div class="card center">
      <div class="score-big">${r.totalQuestions - r.wrongCount} / ${r.totalQuestions}</div>
      <div class="score-sub">틀린 문제 ${r.wrongCount}개 · 통과 커트라인: ${PASS_CUTOFF_WRONG}개 이내</div>
    </div>
    <div class="card">
      <div class="rt-title" style="margin-bottom:8px;">📝 틀린 문제는 노트에 각각 10번씩 적어줘</div>
      ${wrongHtml || `<div class="empty">틀린 문제가 없어! 바로 선생님께 보여줘 🎉</div>`}
    </div>
    ${nextAction}
    <button class="btn-ghost" id="btn-back">목록으로</button>
  `;
  const toFinal = document.getElementById("btn-to-final");
  if(toFinal) toFinal.onclick = async ()=>{
    await db.collection("retestAssignments").doc(a.id).update({ status:"awaiting_final_check" });
    a.status = "awaiting_final_check";
    render();
  };
  const tFinal = document.getElementById("btn-teacher-final");
  if(tFinal) tFinal.onclick = ()=> openTeacherGate(a, finalizeCheck);

  document.getElementById("btn-back").onclick = async ()=>{ await loadAssignments(); state.screen="dashboard"; render(); };
}

/* ====================== 최종 선생님 확인 → 통과/재재시험 ====================== */
async function finalizeCheck(assignment){
  const r = assignment.gradeResult;
  if(r.willPass){
    await db.collection("retestAssignments").doc(assignment.id).update({
      status: "passed",
      passedAt: new Date().toISOString()
    });
    assignment.status = "passed";
    alert("재시험 통과했어요! 축하해요 🎉");
  } else {
    await db.collection("retestAssignments").doc(assignment.id).update({
      status: "needs_reschedule"
    });
    assignment.status = "needs_reschedule";
    alert(`아쉽지만 ${PASS_CUTOFF_WRONG}개 이내로 틀려야 통과예요. 재재시험 일정을 잡아볼까요?`);
  }
  await loadAssignments();
  state.screen = "dashboard";
  render();
}

/* ====================== 재재시험 일정 요청 ====================== */
function renderReschedule(){
  const a = state.activeAssignment;
  app.innerHTML = `
    <h1>재재시험 일정 요청</h1>
    <div class="sub">가능한 날짜와 시간을 1~3개 적어줘. 선생님이 확인 후 확정해줄 거야.</div>
    <div class="card">
      <div id="slots"></div>
      <button class="btn-ghost" id="add-slot">+ 시간 추가</button>
      <div id="resched-err" class="err" style="display:none;"></div>
      <button class="btn-primary" id="btn-send-resched">요청 보내기</button>
    </div>
    <button class="btn-ghost" id="btn-back2">목록으로</button>
  `;
  const slots = document.getElementById("slots");
  function addSlot(){
    const row = document.createElement("div");
    row.className = "slot";
    row.innerHTML = `
      <input type="date">
      <input type="time">
      <button type="button" class="slot-remove">삭제</button>
    `;
    row.querySelector(".slot-remove").onclick = ()=> row.remove();
    slots.appendChild(row);
  }
  addSlot();
  document.getElementById("add-slot").onclick = addSlot;

  document.getElementById("btn-send-resched").onclick = async ()=>{
    const rows = [...slots.querySelectorAll(".slot")];
    const proposed = rows.map(row=>{
      const [dateInp,timeInp] = row.querySelectorAll("input");
      if(!dateInp.value || !timeInp.value) return null;
      return `${dateInp.value}T${timeInp.value}`;
    }).filter(Boolean);
    if(!proposed.length){
      const err = document.getElementById("resched-err");
      err.style.display = "block";
      err.textContent = "날짜와 시간을 최소 1개는 입력해줘";
      return;
    }
    await db.collection("retestAssignments").doc(a.id).update({
      status: "reschedule_requested",
      proposedSchedules: proposed
    });
    a.status = "reschedule_requested";
    await loadAssignments();
    state.screen = "dashboard";
    render();
  };
  document.getElementById("btn-back2").onclick = async ()=>{ await loadAssignments(); state.screen="dashboard"; render(); };
}

/* ====================== 시작 ====================== */
render();
</script>
