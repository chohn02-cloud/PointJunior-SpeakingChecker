<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point Junior Speaking ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDYOJZNuB72oFPskOunQa0V98eaXFuyfiw",
    authDomain: "point-junior-speaking.firebaseapp.com",
    projectId: "point-junior-speaking",
    storageBucket: "point-junior-speaking.firebasestorage.app",
    messagingSenderId: "155258649103",
    appId: "1:155258649103:web:3eb93c3a79c078acd7817a"
  };
  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);
  window._fbStorage = storage; window._fbDb = db;
  window._fbRef = ref; window._fbUpload = uploadBytesResumable;
  window._fbGetURL = getDownloadURL; window._fbCollection = collection;
  window._fbAddDoc = addDoc; window._fbTimestamp = serverTimestamp;
  window._firebaseReady = true;
</script>
<style>
  :root {
    --orange:#FF6B1A; --orange-light:#FF8C42; --orange-pale:#FFF0E6;
    --yellow:#FFD166; --green:#06D6A0; --blue:#4361EE; --red:#EF233C;
    --purple:#7C3AED; --purple-light:#A855F7;
    --bg:#FFFBF7; --gray-200:#EDE8E0; --gray-400:#B0A898;
    --gray-600:#7A6F62; --gray-800:#3D3228;
    --shadow-md:0 6px 24px rgba(255,107,26,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;}

  /* KAKAO */
  .kakao-banner{display:none;position:fixed;top:0;left:0;right:0;background:#FEE500;z-index:9999;padding:12px 20px;}
  .kakao-banner.show{display:block;}
  .kakao-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .kakao-text{flex:1;font-size:.88rem;font-weight:800;color:#3A1D00;}
  .kakao-text span{display:block;font-size:.78rem;font-weight:600;color:#6B4500;margin-top:2px;}
  .btn-kakao-open{background:#3A1D00;color:#FEE500;border:none;border-radius:10px;padding:9px 16px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800;cursor:pointer;}
  .kakao-spacer{display:none;height:58px;}.kakao-spacer.show{display:block;}

  /* HEADER */
  .header{background:linear-gradient(135deg,var(--orange),var(--orange-light));padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(255,107,26,.35);position:sticky;top:0;z-index:100;}
  .header-logo{font-size:1.1rem;font-weight:800;color:white;display:flex;align-items:center;gap:8px;}
  .header-name{background:rgba(255,255,255,.25);color:white;font-weight:800;font-size:.82rem;padding:4px 12px;border-radius:99px;}

  .app{max-width:820px;margin:0 auto;padding:24px 18px 60px;}
  .screen{display:none;}.screen.active{display:block;}

  /* NAME */
  .name-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;text-align:center;padding:20px;}
  .name-logo{margin-bottom:14px;animation:bounce 1.2s ease infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .name-title{font-size:1.9rem;font-weight:800;color:var(--gray-800);margin-bottom:8px;}
  .name-title span{color:var(--orange);}
  .name-sub{font-size:.95rem;font-weight:600;color:var(--gray-400);margin-bottom:28px;}
  .name-row{display:flex;gap:10px;width:100%;max-width:380px;}
  .name-input{flex:1;border:2.5px solid var(--gray-200);border-radius:14px;padding:14px 18px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;color:var(--gray-800);outline:none;background:white;}
  .name-input:focus{border-color:var(--orange);}
  .name-input::placeholder{color:var(--gray-400);}
  .btn-start{background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border:none;border-radius:14px;padding:14px 24px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;}

  /* UNIT SELECT */
  .sec-title{font-size:1.65rem;font-weight:800;color:var(--gray-800);margin-bottom:6px;}
  .sec-title span{color:var(--orange);}
  .sec-sub{color:var(--gray-600);font-size:.92rem;font-weight:600;margin-bottom:24px;}
  .unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .unit-card{background:white;border:2.5px solid var(--gray-200);border-radius:18px;padding:20px 16px;cursor:pointer;transition:all .2s;position:relative;}
  .unit-card:hover{border-color:var(--orange-light);box-shadow:var(--shadow-md);transform:translateY(-3px);}
  .unit-date{font-size:1.3rem;font-weight:800;color:var(--orange);margin-bottom:4px;}
  .unit-count{font-size:.78rem;color:var(--gray-400);font-weight:600;}
  .unit-done-badge{position:absolute;top:10px;right:10px;background:var(--green);color:white;border-radius:99px;padding:2px 9px;font-size:.7rem;font-weight:800;}

  /* PRACTICE */
  .prac-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-btn{background:white;border:2px solid var(--gray-200);border-radius:12px;padding:7px 12px;font-size:.82rem;font-weight:700;color:var(--gray-600);cursor:pointer;}
  .unit-badge{font-size:.88rem;font-weight:800;color:var(--orange);background:var(--orange-pale);border-radius:99px;padding:4px 14px;}

  /* PROGRESS */
  .prog-area{margin-bottom:18px;}
  .prog-label{display:flex;justify-content:space-between;font-weight:700;font-size:.82rem;color:var(--gray-600);margin-bottom:6px;}
  .prog-label span:last-child{color:var(--orange);}
  .prog-bg{background:var(--gray-200);border-radius:99px;height:10px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:99px;transition:width .5s;}
  .step-dots{display:flex;gap:5px;margin-top:8px;justify-content:center;flex-wrap:wrap;}
  .step-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-200);transition:all .3s;}
  .step-dot.done{background:var(--green);}
  .step-dot.current{background:var(--orange);transform:scale(1.4);}

  /* SENTENCE CARD */
  .dial-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .dial-num{font-size:1rem;font-weight:800;color:white;background:var(--orange);border-radius:10px;padding:3px 12px;}
  .dial-prog-text{font-size:.8rem;font-weight:700;color:var(--gray-400);}
  .sentence-card{background:white;border-radius:18px;padding:22px 26px;box-shadow:var(--shadow-md);margin-bottom:14px;}
  .sentence-card.full-mode{border:2.5px solid var(--orange);background:var(--orange-pale);}
  .s-label{font-size:.73rem;font-weight:800;color:var(--orange);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .s-text{font-size:1.6rem;font-weight:700;color:var(--gray-800);line-height:1.35;}
  .full-lines{display:flex;flex-direction:column;gap:7px;}
  .full-line{font-size:1.15rem;font-weight:700;color:var(--gray-800);line-height:1.4;}
  .full-line .sp{color:var(--orange);margin-right:4px;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:13px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:800;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;}
  .btn:disabled{opacity:.35;cursor:default;}
  .nav-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
  .btn-prev{background:white;border:2.5px solid var(--gray-200);color:var(--gray-600);font-size:.85rem;padding:11px 14px;border-radius:12px;min-width:72px;}
  .btn-prev:hover:not(:disabled){border-color:var(--orange);color:var(--orange);}
  .btn-listen{background:linear-gradient(135deg,var(--blue),#7B89F4);color:white;flex:1;font-size:1rem;padding:13px;}
  .btn-skip{background:white;border:2.5px solid rgba(67,97,238,.4);color:var(--blue);font-size:.85rem;padding:11px 14px;border-radius:12px;min-width:72px;}
  .btn-skip:hover:not(:disabled){background:var(--blue);color:white;}

  /* STT 버튼 (개별 문장) */
  .btn-speak{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:white;width:100%;font-size:1.05rem;padding:16px;border-radius:15px;margin-bottom:10px;box-shadow:0 4px 14px rgba(124,58,237,.3);}
  .btn-speak.listening{animation:pulse-stt 1s ease-in-out infinite;}
  @keyframes pulse-stt{0%,100%{box-shadow:0 4px 14px rgba(124,58,237,.3);}50%{box-shadow:0 4px 28px rgba(124,58,237,.6);transform:scale(1.02);}}

  /* 발음 결과 */
  .pronun-box{display:none;border-radius:16px;padding:18px;margin-bottom:12px;text-align:center;}
  .pronun-box.show{display:block;}
  .pronun-box.correct{background:#ECFDF5;border:2.5px solid var(--green);}
  .pronun-box.wrong{background:#FFF1F2;border:2.5px solid var(--red);}
  .pronun-emoji{font-size:2.2rem;margin-bottom:6px;}
  .pronun-msg{font-size:1rem;font-weight:800;color:var(--gray-800);margin-bottom:4px;}
  .pronun-detail{font-size:.82rem;font-weight:600;color:var(--gray-600);line-height:1.5;}
  .pronun-detail b{color:var(--red);}

  /* 완료 버튼 (개별 문장) */
  .btn-done{background:linear-gradient(135deg,var(--green),#00B886);color:white;width:100%;font-size:1rem;padding:15px;border-radius:15px;margin-bottom:10px;}
  .btn-done:disabled{background:var(--gray-200);color:var(--gray-400);box-shadow:none;}

  /* 녹음 영역 (전체 대화) */
  .rec-area{background:white;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:2px solid var(--gray-200);}
  .rec-area-title{font-size:.75rem;font-weight:800;color:var(--gray-400);letter-spacing:.08em;margin-bottom:10px;}
  .rec-btns{display:flex;gap:8px;margin-bottom:8px;}
  .btn-rec{background:linear-gradient(135deg,var(--red),#FF6B8A);color:white;flex:1;font-size:1rem;padding:14px;border-radius:13px;}
  .btn-rec.recording{animation:pulse-rec 1s ease-in-out infinite;}
  @keyframes pulse-rec{0%,100%{box-shadow:0 4px 14px rgba(239,35,60,.3);}50%{box-shadow:0 4px 28px rgba(239,35,60,.6);}}
  .btn-play-rec{background:white;border:2.5px solid var(--gray-200);color:var(--gray-600);padding:14px 16px;border-radius:13px;font-size:.9rem;font-weight:800;}
  .btn-play-rec:hover:not(:disabled){border-color:var(--blue);color:var(--blue);}
  .rec-hint{font-size:.82rem;font-weight:600;color:var(--gray-400);}
  .rec-timer{font-size:.9rem;font-weight:800;color:var(--red);margin-right:8px;}

  /* 전체 완료 버튼 */
  .btn-full-done{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:white;width:100%;font-size:1rem;padding:15px;border-radius:15px;animation:pdone 2s ease-in-out infinite;}
  @keyframes pdone{0%,100%{box-shadow:0 4px 14px rgba(124,58,237,.3);}50%{box-shadow:0 6px 22px rgba(124,58,237,.5);transform:translateY(-2px);}}
  .btn-full-done:disabled{background:var(--gray-200);color:var(--gray-400);box-shadow:none;animation:none;}

  /* 업로드 */
  .upload-area{display:none;background:var(--orange-pale);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
  .upload-area.show{display:block;}
  .upload-label{font-size:.82rem;font-weight:700;color:var(--orange);margin-bottom:6px;display:flex;justify-content:space-between;}
  .upload-bg{background:rgba(255,107,26,.2);border-radius:99px;height:7px;overflow:hidden;}
  .upload-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .2s;width:0%;}

  /* DONE LIST */
  .done-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .done-item{display:flex;align-items:center;gap:10px;background:white;border:2px solid var(--gray-200);border-radius:11px;padding:9px 13px;}
  .done-item.active-item{border-color:var(--orange);background:var(--orange-pale);}
  .done-num{width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:white;flex-shrink:0;}
  .done-text{font-weight:700;font-size:.82rem;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* COMPLETE */
  .comp-wrap{text-align:center;padding:28px 20px 14px;}
  .comp-emoji{font-size:3.8rem;margin-bottom:12px;animation:bounce 1s ease infinite;}
  .comp-title{font-size:1.9rem;font-weight:800;color:var(--gray-800);margin-bottom:7px;}
  .comp-title span{color:var(--orange);}
  .comp-sub{font-size:.92rem;color:var(--gray-600);font-weight:600;margin-bottom:4px;}
  .comp-meta{font-size:.82rem;color:var(--gray-400);font-weight:700;margin-bottom:16px;}
  .comp-notice{background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border-radius:16px;padding:16px 20px;font-size:.92rem;font-weight:700;line-height:1.7;text-align:center;}
  .comp-notice strong{font-size:.98rem;display:block;margin-bottom:3px;}
  .btn-home{background:white;border:2.5px solid var(--gray-200);color:var(--gray-600);width:100%;font-size:.9rem;padding:13px;border-radius:14px;margin-top:14px;max-width:320px;}

  /* RESUME MODAL */
  .resume-overlay{position:fixed;inset:0;background:rgba(30,20,10,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .resume-box{background:white;border-radius:24px;padding:30px 26px 24px;max-width:380px;width:100%;text-align:center;}
  .resume-emoji{font-size:2.8rem;margin-bottom:10px;}
  .resume-title{font-size:1.2rem;font-weight:800;color:var(--gray-800);margin-bottom:6px;}
  .resume-sub{font-size:.88rem;font-weight:600;color:var(--gray-400);margin-bottom:20px;line-height:1.6;}
  .resume-btns{display:flex;flex-direction:column;gap:10px;}
  .btn-resume{background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border:none;border-radius:14px;padding:14px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;}
  .btn-restart{background:white;border:2.5px solid var(--gray-200);color:var(--gray-600);border-radius:14px;padding:13px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gray-800);color:white;padding:10px 20px;border-radius:12px;font-weight:700;font-size:.86rem;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="kakao-banner" id="kakaoBanner">
  <div class="kakao-inner">
    <div class="kakao-text">📱 카카오톡에서 열었어요!
      <span>소리 듣기·녹음을 하려면 외부 브라우저로 열어주세요.</span>
    </div>
    <button class="btn-kakao-open" onclick="openExternalBrowser()">🌐 외부 브라우저로 열기</button>
  </div>
</div>
<div class="kakao-spacer" id="kakaoSpacer"></div>

<div class="header">
  <div class="header-logo"><img src="logo.png" alt="Point Academy" style="height:40px;width:auto;object-fit:contain;"> Point Junior Speaking</div>
  <div class="header-name" id="headerName" style="display:none"></div>
</div>

<div class="app">

  <!-- 이름 -->
  <div class="screen active" id="screenName">
    <div class="name-wrap">
      <div class="name-logo"><img src="logo.png" alt="Point Academy" style="height:100px;width:auto;object-fit:contain;"></div>
      <div class="name-title">안녕하세요! <span>이름</span>을<br>알려주세요</div>
      <div class="name-sub">녹음 파일이 선생님께 자동으로 전달돼요 😊</div>
      <div class="name-row">
        <input class="name-input" id="nameInput" type="text" placeholder="예) 홍길동" maxlength="10"
          onkeydown="if(event.key==='Enter')confirmName()">
        <button class="btn-start" onclick="confirmName()">시작! →</button>
      </div>
    </div>
  </div>

  <!-- Script 선택 -->
  <div class="screen" id="screenUnits">
    <div class="sec-title">어떤 <span>Script</span>를 공부할까요?</div>
    <div class="sec-sub" id="greetingLine">원하는 날짜의 Script를 골라보세요 🎉</div>
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <!-- 연습 -->
  <div class="screen" id="screenPractice">
    <div class="prac-topbar">
      <button class="back-btn" onclick="goHome()">← 나가기</button>
      <div class="unit-badge" id="unitBadgeLabel">Script</div>
    </div>
    <div class="prog-area">
      <div class="prog-label"><span id="progLabel">대화 1/10</span><span id="progPct">0%</span></div>
      <div class="prog-bg"><div class="prog-fill" id="progressFill" style="width:0%"></div></div>
      <div class="step-dots" id="stepDots"></div>
    </div>
    <div class="dial-header">
      <div class="dial-num" id="dialNum">#1</div>
      <div class="dial-prog-text" id="dialProg"></div>
    </div>
    <div class="sentence-card" id="sentenceCard">
      <div class="s-label" id="sLabel">발음하기</div>
      <div id="sContent"></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-prev" id="btnPrev" onclick="prevStep()">◀ 이전</button>
      <button class="btn btn-listen" id="btnListen" onclick="listenCurrent()">🔊 듣기</button>
      <button class="btn btn-skip" id="btnSkip" onclick="nextStep()">다음 ▶</button>
    </div>

    <!-- 개별 문장: STT 발음 확인 -->
    <div id="areaSTT">
      <button class="btn btn-speak" id="btnSpeak" onclick="startSpeak()">🎤 말하기</button>
      <div class="pronun-box" id="pronunBox">
        <div class="pronun-emoji" id="pronunEmoji"></div>
        <div class="pronun-msg" id="pronunMsg"></div>
        <div class="pronun-detail" id="pronunDetail"></div>
      </div>
      <button class="btn btn-done" id="btnDone" onclick="markDone()" disabled>✅ 발음 완료!</button>
    </div>

    <!-- 전체 대화: 녹음 -->
    <div id="areaRec" style="display:none;">
      <div class="rec-area">
        <div class="rec-area-title">🎙 전체 대화 녹음하기</div>
        <div class="rec-btns">
          <button class="btn btn-rec" id="btnRec" onclick="toggleRec()">🔴 녹음 시작</button>
          <button class="btn btn-play-rec" id="btnPlayRec" onclick="playRec()" disabled>▶ 듣기</button>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="rec-timer" id="recTimer" style="display:none">00:00</span>
          <span class="rec-hint" id="recHint">녹음 후 들어보고 완료를 눌러주세요</span>
        </div>
      </div>
      <div class="upload-area" id="uploadArea">
        <div class="upload-label"><span>📤 전송 중...</span><span id="uploadPct">0%</span></div>
        <div class="upload-bg"><div class="upload-fill" id="uploadFill"></div></div>
      </div>
      <button class="btn btn-full-done" id="btnFullDone" onclick="markFullDone()" disabled>🎉 전체 발음 완료!</button>
    </div>

    <div class="done-list" id="doneList"></div>
  </div>

  <!-- 완료 -->
  <div class="screen" id="screenComplete">
    <div class="comp-wrap">
      <div class="comp-emoji">🏆</div>
      <div class="comp-title">Script <span id="completeUnit"></span> 완료!</div>
      <div class="comp-sub" id="completeNameLine">정말 잘했어요! 💪</div>
      <div class="comp-meta" id="completeMeta"></div>
    </div>
    <div class="comp-notice">
      <strong>✅ 녹음이 선생님께 자동으로 전달됐어요!</strong>
      수고했어요! 오늘도 열심히 공부했군요 🎉
    </div>
    <div style="display:flex;justify-content:center;">
      <button class="btn btn-home" onclick="goHome()">🏠 Script 목록으로</button>
    </div>
  </div>
</div>

<!-- 이어하기 팝업 -->
<div class="resume-overlay" id="resumeModal" style="display:none;">
  <div class="resume-box">
    <div class="resume-emoji">📌</div>
    <div class="resume-title" id="resumeTitle"></div>
    <div class="resume-sub" id="resumeSub"></div>

function openExternalBrowser() {
  const url = window.location.href;
  if (/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase())) {
    window.location.href = url;
  } else {
    try { window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; }
    catch(e) { window.open(url,'_blank'); }
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderUnits() {
  document.getElementById('unitGrid').innerHTML = units.map(u => `
    <div class="unit-card" onclick="selectUnit(${u.id})">
      ${completedUnits[u.id] ? '<div class="unit-done-badge">완료 ✓</div>' : ''}
      <div class="unit-date">${u.emoji} ${u.name}</div>
      <div class="unit-count">💬 ${u.dialogues.length}개 대화</div>
    </div>`).join('');
}

function selectUnit(id) {
  currentUnit = units.find(u => u.id === id);
  doneDialogues = new Set(); uploadQueue = [];
  const saved = loadProgress(studentName, id);
  if (saved && saved.nextSet > 0 && saved.nextSet < currentUnit.dialogues.length) {
    saved.doneSets.forEach(i => doneDialogues.add(i));
    showResumeModal(saved);
  } else {
    dialogueIdx = 0; stepIdx = 0; startPractice();
  }
}

function startPractice() {
  document.getElementById('unitBadgeLabel').textContent = currentUnit.name;
  document.getElementById('doneList').innerHTML = '';
  showScreen('screenPractice');
  renderDots(); loadStep();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function saveProgress(name, unitId, doneSetArr, nextSet) {
  localStorage.setItem('pj_progress_' + name + '_' + unitId, JSON.stringify({ doneSets: doneSetArr, nextSet }));
}
function loadProgress(name, unitId) {
  const raw = localStorage.getItem('pj_progress_' + name + '_' + unitId);
  return raw ? JSON.parse(raw) : null;
}
function clearProgress(name, unitId) {
  localStorage.removeItem('pj_progress_' + name + '_' + unitId);
}
function showResumeModal(saved) {

  document.getElementById('resumeSub').innerHTML = `#${saved.doneSets.length}대화까지 완료했어요.<br><b>#${saved.nextSet+1}대화</b>부터 이어서 할까요?`;
  document.getElementById('resumeModal').style.display = 'flex';

function resumeFromSaved() {
  document.getElementById('resumeModal').style.display = 'none';
  const saved = loadProgress(studentName, currentUnit.id);
  saved.doneSets.forEach(i => doneDialogues.add(i));
  dialogueIdx = saved.nextSet; stepIdx = 0; startPractice();
}
function restartFromBeginning() {
  document.getElementById('resumeModal').style.display = 'none';
  clearProgress(studentName, currentUnit.id);
  doneDialogues = new Set(); dialogueIdx = 0; stepIdx = 0; startPractice();

// DOTS & PROGRESS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderDots() {
  document.getElementById('stepDots').innerHTML = currentUnit.dialogues.map((_,i) =>
    `<div class="step-dot" id="dot${i}"></div>`).join('');
}
function updateDots() {
  currentUnit.dialogues.forEach((_,i) => {
    const d = document.getElementById('dot'+i);
    if (!d) return;
    d.className = 'step-dot' + (doneDialogues.has(i) ? ' done' : i===dialogueIdx ? ' current' : '');
  });
  const total = currentUnit.dialogues.length;
  const pct = Math.round(doneDialogues.size / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `대화 ${dialogueIdx+1} / ${total}`;
  document.getElementById('progPct').textContent = pct + '%';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LOAD STEP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function loadStep() {
  const lines = currentUnit.dialogues[dialogueIdx].lines;
  const isFullStep = (stepIdx === lines.length);
  const speakers = ['A','B','A','B','A','B','A','B','A','B'];

  document.getElementById('dialNum').textContent = `#${dialogueIdx+1}`;
  document.getElementById('dialProg').textContent = isFullStep
    ? `전체 대화 (${lines.length}문장)` : `${stepIdx+1} / ${lines.length} 문장`;

  updateDots();
  document.getElementById('btnPrev').disabled = (stepIdx===0 && dialogueIdx===0);
  document.getElementById('btnSkip').disabled = isFullStep;

  const card = document.getElementById('sentenceCard');
  const label = document.getElementById('sLabel');
  const content = document.getElementById('sContent');

  if (isFullStep) {
    // 전체 대화: 녹음 영역 표시
    card.classList.add('full-mode');
    label.textContent = '🎭 전체 대화 발음하기';
    content.innerHTML = `<div class="full-lines">${lines.map((l,i)=>
      `<div class="full-line"><span class="sp">${speakers[i]||'?'}:</span>${l}</div>`).join('')}</div>`;
    document.getElementById('areaSTT').style.display = 'none';
    document.getElementById('areaRec').style.display = 'block';
    resetRecUI();
  } else {
    // 개별 문장: STT 발음 확인
    card.classList.remove('full-mode');
    label.textContent = `${stepIdx+1}번째 문장`;
    content.innerHTML = `<div class="s-text">${lines[stepIdx]}</div>`;
    document.getElementById('areaSTT').style.display = 'block';
    document.getElementById('areaRec').style.display = 'none';
    resetSTT();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function listenCurrent() {
  const lines = currentUnit.dialogues[dialogueIdx].lines;
  stepIdx === lines.length ? speakSeq(lines, 0) : speak(lines[stepIdx]);
}
function speak(text) {
  const s = window.speechSynthesis; if (!s) return; s.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85; u.pitch=1.05;
  const voices = s.getVoices();
  const pref = voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('samantha'))
    || voices.find(v=>v.lang==='en-US'&&!v.name.toLowerCase().includes('compact'))
    || voices.find(v=>v.lang.startsWith('en-'));
  if (pref) u.voice = pref;
  s.speak(u);
}
function speakSeq(lines, idx) {
  if (idx >= lines.length) return;
  const s = window.speechSynthesis; if (!s) return; s.cancel();
  const u = new SpeechSynthesisUtterance(lines[idx]);
  u.lang='en-US'; u.rate=0.85; u.pitch=1.05;
  const voices = s.getVoices();
  const pref = voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('samantha'))
    || voices.find(v=>v.lang==='en-US'&&!v.name.toLowerCase().includes('compact'))
    || voices.find(v=>v.lang.startsWith('en-'));
  if (pref) u.voice = pref;
  u.onend = () => setTimeout(() => speakSeq(lines, idx+1), 700);
  s.speak(u);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STT (개별 문장 발음 확인)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function resetSTT() {
  stopRecognition();
  document.getElementById('btnSpeak').textContent = '🎤 말하기';
  document.getElementById('btnSpeak').classList.remove('listening');
  document.getElementById('pronunBox').className = 'pronun-box';
  document.getElementById('btnDone').disabled = true;
  document.getElementById('btnDone').textContent = '✅ 발음 완료!';
}

function startSpeak() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  const target = currentUnit.dialogues[dialogueIdx].lines[stepIdx];
  runSTT(target);
}

function runSTT(targetText) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // STT 미지원 → 바로 완료 버튼 활성화
    document.getElementById('btnDone').disabled = false;
    return;
  }
  if (recognition) { try { recognition.abort(); } catch(e){} }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  isRecognizing = true;

  const btn = document.getElementById('btnSpeak');
  btn.textContent = '🎤 듣고 있어요...';
  btn.classList.add('listening');
  document.getElementById('pronunBox').className = 'pronun-box';

  recognition.onresult = (e) => {
    const spoken = e.results[0][0].transcript.trim();
    btn.textContent = '🎤 다시 말하기';
    btn.classList.remove('listening');
    isRecognizing = false;
    evaluatePronun(spoken, targetText);
  };
  recognition.onerror = () => {
    isRecognizing = false;
    btn.textContent = '🎤 다시 말하기';
    btn.classList.remove('listening');
    showToast('다시 눌러서 말해주세요! 🎤');
  };
  recognition.onend = () => {
    isRecognizing = false;
    if (btn.classList.contains('listening')) {
      btn.textContent = '🎤 다시 말하기';
      btn.classList.remove('listening');
    }
  };
  try { recognition.start(); } catch(e) {
    btn.textContent = '🎤 다시 말하기';
    btn.classList.remove('listening');
    document.getElementById('btnDone').disabled = false;
  }
}

function stopRecognition() {
  if (recognition && isRecognizing) {
    try { recognition.abort(); } catch(e){}
    isRecognizing = false;
  }
}

function evaluatePronun(spoken, target) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
  const tw = norm(target).split(/\s+/);
  const sw = norm(spoken).split(/\s+/);
  let matched = 0;
  tw.forEach(w => { if (sw.includes(w)) matched++; });
  const score = matched / tw.length;

  const box   = document.getElementById('pronunBox');
  const emoji = document.getElementById('pronunEmoji');
  const msg   = document.getElementById('pronunMsg');
  const det   = document.getElementById('pronunDetail');

  if (score >= 0.75) {
    box.className = 'pronun-box show correct';
    emoji.textContent = '🎉';
    msg.textContent = '잘했어요! 발음이 좋아요!';
    det.innerHTML = `"${spoken}"`;
    document.getElementById('btnDone').disabled = false;
  } else {
    box.className = 'pronun-box show wrong';
    emoji.textContent = '🔄';
    msg.textContent = '한 번 더 해봐요!';
    const missing = tw.filter(w=>!sw.includes(w)).slice(0,3);
    det.innerHTML = missing.length
      ? `다시 연습해봐요: <b>${missing.join(', ')}</b>`
      : '다시 한 번 또렷하게 말해봐요!';
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 녹음 (전체 대화)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function resetRecUI() {
  if (isRecording) stopRec();
  recordedBlob = null;
  recordedPlayer.src = '';
  document.getElementById('btnRec').textContent = '🔴 녹음 시작';
  document.getElementById('btnRec').classList.remove('recording');
  document.getElementById('btnPlayRec').disabled = true;
  document.getElementById('recTimer').style.display = 'none';
  document.getElementById('recTimer').textContent = '00:00';
  document.getElementById('recHint').textContent = '녹음 후 들어보고 완료를 눌러주세요';
  document.getElementById('btnFullDone').disabled = true;
  document.getElementById('btnFullDone').textContent = '🎉 전체 발음 완료!';
  clearInterval(recTimerInterval);
  recSeconds = 0;
}

async function toggleRec() {
  if (isRecording) stopRec();
  else {
    window.speechSynthesis && window.speechSynthesis.cancel();
    await startRec();
  }
}
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||''
    mediaRecorder = new MediaRecorder(stream, mime?{mimeType:mime}:{});
    mediaRecorder.ondataavailable = e => { if (e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = handleRecStop;
    mediaRecorder.start(100);
    isRecording = true;
    recSeconds = 0;
    document.getElementById('btnRec').textContent = '⏹ 녹음 중지';
    document.getElementById('btnRec').classList.add('recording');
    document.getElementById('recTimer').style.display = 'inline';
    document.getElementById('recHint').textContent = '전체 대화를 말해주세요...';
    recTimerInterval = setInterval(() => {
      recSeconds++;
      const m = String(Math.floor(recSeconds/60)).padStart(2,'0');
      const s = String(recSeconds%60).padStart(2,'0');
      document.getElementById('recTimer').textContent = `${m}:${s}`;
    }, 1000);
  } catch(e) { showToast('마이크 권한을 허용해주세요! 🎤'); }
}
function stopRec() {
  if (!mediaRecorder||!isRecording) return;
  clearInterval(recTimerInterval);
  isRecording = false;
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t=>t.stop());
}
function handleRecStop() {
  const mime = mediaRecorder.mimeType || 'audio/webm';
  recordedBlob = new Blob(audioChunks, {type:mime});
  recordedPlayer.src = URL.createObjectURL(recordedBlob);
  document.getElementById('btnRec').textContent = '🔴 다시 녹음';
  document.getElementById('btnRec').classList.remove('recording');
  document.getElementById('btnPlayRec').disabled = false;
  document.getElementById('recHint').textContent = '▶ 듣기로 확인하고 완료를 눌러주세요!';
  document.getElementById('btnFullDone').disabled = false;
}
function playRec() {
  if (recordedPlayer.src) { recordedPlayer.currentTime=0; recordedPlayer.play(); }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DONE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function markDone() {
  const lines = currentUnit.dialogues[dialogueIdx].lines;
  if (stepIdx < lines.length-1) {
    stepIdx++; loadStep();
  } else {
    stepIdx = lines.length; loadStep();
    showToast('🎉 전체 대화를 녹음해봐요!');
  }
}

async function markFullDone() {
  doneDialogues.add(dialogueIdx);
  document.getElementById('btnFullDone').disabled = true;
  document.getElementById('btnFullDone').textContent = '✔ 완료!';

  // 녹음 Firebase 업로드
  if (recordedBlob) await uploadOne(recordedBlob, dialogueIdx);

  updateDots();
  addToDoneList(dialogueIdx);

  const total = currentUnit.dialogues.length;
  const next = findNextUndone(dialogueIdx);
  saveProgress(studentName, currentUnit.id, [...doneDialogues], next!==-1?next:0);

  if (doneDialogues.size >= total) {
    clearProgress(studentName, currentUnit.id);
    // Firestore에 완료 기록
    if (window._firebaseReady) {
      try {
        await window._fbAddDoc(window._fbCollection(window._fbDb, 'completions'), {
          studentName, unitId: currentUnit.id, unitName: currentUnit.name,
          completedAt: window._fbTimestamp()
        });
      } catch(e) { console.error(e); }
    }
    setTimeout(() => finishUnit(), 800);
  } else {
    showToast(`✅ #${dialogueIdx+1} 완료! 다음 대화로 이동해요`);
    if (next!==-1) setTimeout(() => { dialogueIdx=next; stepIdx=0; loadStep(); }, 700);
  }
}

async function uploadOne(blob, dIdx) {
  if (!window._firebaseReady) return;
  const mime = blob.type||'audio/webm';
  const ext = mime.includes('webm')?'webm':mime.includes('mp4')?'mp4':'ogg';
  const now = new Date();
  const ds = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const fileName = `${studentName}_${currentUnit.name.replace(/\//g,'-')}_D${dIdx+1}_${ds}.${ext}`;
  const path = `recordings/${studentName}/${currentUnit.name.replace(/\//g,'-')}/${fileName}`;
  const sr = window._fbRef(window._fbStorage, path);
  const task = window._fbUpload(sr, blob);
  document.getElementById('uploadArea').classList.add('show');
  await new Promise(resolve => {
    task.on('state_changed',
      snap => {
        const p = Math.round(snap.bytesTransferred/snap.totalBytes*100);
        document.getElementById('uploadFill').style.width=p+'%';
        document.getElementById('uploadPct').textContent=p+'%';
      },
      err => { console.error(err); resolve(); },
      async () => {
        const url = await window._fbGetURL(task.snapshot.ref);
        document.getElementById('uploadArea').classList.remove('show');
        try {
          await window._fbAddDoc(window._fbCollection(window._fbDb,'submissions'),{
            studentName, unitId:currentUnit.id, unitName:currentUnit.name,
            dialogueNum:dIdx+1, fileName, fileUrl:url,
            submittedAt:window._fbTimestamp()
          });
        } catch(e){ console.error(e); }
        resolve();
      }
    );
  });
}

function findNextUndone(from) {
  const n = currentUnit.dialogues.length;
  for (let i=from+1;i<n;i++) if (!doneDialogues.has(i)) return i;
  for (let i=0;i<from;i++) if (!doneDialogues.has(i)) return i;
  return -1;
}
function addToDoneList(idx) {
  const list = document.getElementById('doneList');
  const ex = list.querySelector(`[data-idx="${idx}"]`); if(ex) ex.remove();
  const item = document.createElement('div');
  item.className='done-item active-item'; item.dataset.idx=idx;
  item.innerHTML=`<div class="done-num">${idx+1}</div>
    <div class="done-text">#${idx+1}: ${currentUnit.dialogues[idx].lines[0].slice(0,45)}...</div>`;
  document.getElementById('doneList').appendChild(item);
  item.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// FINISH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function finishUnit() {
  completedUnits[currentUnit.id] = true;
  localStorage.setItem('pj_done', JSON.stringify(completedUnits));
  const now = new Date();
  document.getElementById('completeUnit').textContent = currentUnit.name;
  document.getElementById('completeNameLine').textContent = `${studentName} 학생, 정말 잘했어요! 💪`;
  document.getElementById('completeMeta').textContent =
    `📅 ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 완료`;
  showScreen('screenComplete');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NAV & UTILS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function prevStep() {
  if (stepIdx>0) { stepIdx--; loadStep(); }
  else if (dialogueIdx>0) { dialogueIdx--; stepIdx=0; loadStep(); }
}
function nextStep() {
  const lines = currentUnit.dialogues[dialogueIdx].lines;
  if (stepIdx<lines.length) { stepIdx++; loadStep(); }
}
function goHome() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopRecognition();
  if (isRecording) stopRec();
  showScreen('screenUnits'); renderUnits();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function init() {
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = ()=>window.speechSynthesis.getVoices();
  }
  renderUnits(); detectKakao();
}
init();
</script>
