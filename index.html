 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point Junior Speaking ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B1A;
    --orange-light: #FF8C42;
    --orange-pale: #FFF0E6;
    --orange-deep: #E55A0E;
    --yellow: #FFD166;
    --yellow-light: #FFF5D0;
    --green: #06D6A0;
    --green-light: #E0FFF6;
    --red: #EF233C;
    --red-light: #FFE8EB;
    --blue: #4361EE;
    --bg: #FFFBF7;
    --white: #FFFFFF;
    --gray-100: #F7F4F0;
    --gray-200: #EDE8E0;
    --gray-400: #B0A898;
    --gray-600: #7A6F62;
    --gray-800: #3D3228;
    --shadow-sm: 0 2px 8px rgba(255,107,26,0.12);
    --shadow-md: 0 6px 24px rgba(255,107,26,0.18);
    --shadow-lg: 0 16px 48px rgba(255,107,26,0.22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- BG DECORATION ---- */
  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(255,209,102,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -80px; left: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,107,26,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ---- HEADER ---- */
  .header {
    background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
    padding: 0 32px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255,107,26,0.35);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo span { font-size: 1.8rem; }
  .header-badge {
    background: rgba(255,255,255,0.25);
    color: white;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 5px 14px;
    border-radius: 99px;
    letter-spacing: 0.05em;
  }

  /* ---- MAIN WRAPPER ---- */
  .app {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- SCREENS ---- */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- UNIT SELECT ---- */
  .section-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--gray-800);
    margin-bottom: 8px;
  }
  .section-title span { color: var(--orange); }
  .section-sub {
    color: var(--gray-600);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 32px;
  }

  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .unit-card {
    background: white;
    border: 2.5px solid var(--gray-200);
    border-radius: 20px;
    padding: 24px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .unit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--orange), var(--yellow));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .unit-card:hover {
    border-color: var(--orange-light);
    box-shadow: var(--shadow-md);
    transform: translateY(-4px);
  }
  .unit-card:hover::before { opacity: 1; }
  .unit-num {
    font-family: 'Baloo 2', cursive;
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--orange);
    line-height: 1;
    margin-bottom: 6px;
  }
  .unit-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--gray-800);
    margin-bottom: 4px;
  }
  .unit-count {
    font-size: 0.82rem;
    color: var(--gray-400);
    font-weight: 600;
  }
  .unit-done-badge {
    position: absolute;
    top: 14px; right: 14px;
    background: var(--green);
    color: white;
    border-radius: 99px;
    padding: 2px 10px;
    font-size: 0.72rem;
    font-weight: 800;
  }

  /* ---- PRACTICE SCREEN ---- */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: 2px solid var(--gray-200);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 24px;
  }
  .back-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* Progress bar */
  .progress-area {
    margin-bottom: 28px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--gray-600);
    margin-bottom: 8px;
  }
  .progress-label span:last-child { color: var(--orange); }
  .progress-bar-bg {
    background: var(--gray-200);
    border-radius: 99px;
    height: 12px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--yellow));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .step-dots {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    justify-content: center;
  }
  .step-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--gray-200);
    transition: all 0.3s;
  }
  .step-dot.done { background: var(--green); }
  .step-dot.current { background: var(--orange); transform: scale(1.4); }

  /* Sentence card */
  .sentence-card {
    background: white;
    border-radius: 28px;
    padding: 36px 40px;
    box-shadow: var(--shadow-md);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .sentence-card::after {
    content: '🎤';
    position: absolute;
    bottom: -10px; right: 20px;
    font-size: 5rem;
    opacity: 0.06;
  }
  .sentence-step-label {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--orange);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sentence-step-label::before {
    content: '';
    display: block;
    width: 28px; height: 3px;
    background: var(--orange);
    border-radius: 2px;
  }
  .sentence-text {
    font-family: 'Baloo 2', cursive;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--gray-800);
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .sentence-ko {
    font-size: 1rem;
    color: var(--gray-400);
    font-weight: 600;
  }

  /* Controls row */
  .controls-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }

  .btn-listen {
    background: linear-gradient(135deg, var(--blue), #7B89F4);
    color: white;
    box-shadow: 0 4px 16px rgba(67,97,238,0.3);
  }
  .btn-listen:hover { box-shadow: 0 6px 24px rgba(67,97,238,0.45); transform: translateY(-2px); }

  .btn-record {
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    color: white;
    box-shadow: 0 4px 16px rgba(255,107,26,0.35);
    flex: 1;
  }
  .btn-record:hover { box-shadow: 0 6px 24px rgba(255,107,26,0.5); transform: translateY(-2px); }
  .btn-record.recording {
    background: linear-gradient(135deg, var(--red), #FF6B8A);
    animation: pulse-record 1.2s infinite;
  }
  @keyframes pulse-record {
    0%,100% { box-shadow: 0 4px 16px rgba(239,35,60,0.35); }
    50% { box-shadow: 0 4px 32px rgba(239,35,60,0.6); transform: scale(1.02); }
  }

  .btn-submit {
    background: linear-gradient(135deg, var(--green), #00B886);
    color: white;
    box-shadow: 0 4px 16px rgba(6,214,160,0.3);
    width: 100%;
  }
  .btn-submit:hover { box-shadow: 0 6px 24px rgba(6,214,160,0.45); transform: translateY(-2px); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-next {
    background: linear-gradient(135deg, var(--orange), var(--yellow));
    color: white;
    box-shadow: 0 4px 16px rgba(255,107,26,0.35);
    width: 100%;
    font-size: 1.1rem;
    padding: 18px 28px;
  }
  .btn-next:hover { box-shadow: 0 6px 24px rgba(255,107,26,0.5); transform: translateY(-2px); }

  /* Audio player */
  .audio-player {
    background: var(--gray-100);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .audio-player audio { flex: 1; height: 36px; }
  .audio-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--gray-600);
    white-space: nowrap;
  }

  /* Result card */
  .result-card {
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 20px;
    display: none;
  }
  .result-card.show { display: block; }
  .result-card.pass {
    background: var(--green-light);
    border: 2px solid var(--green);
  }
  .result-card.fail {
    background: var(--red-light);
    border: 2px solid var(--red);
  }
  .result-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .result-card.pass .result-title { color: #00A070; }
  .result-card.fail .result-title { color: var(--red); }
  .result-detail {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--gray-600);
  }
  .transcript-box {
    margin-top: 10px;
    background: white;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--gray-800);
    font-weight: 600;
  }
  .transcript-box span { color: var(--gray-400); font-size: 0.85rem; }

  /* Waveform animation */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 28px;
  }
  .wave-bar {
    width: 4px;
    background: var(--orange);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { animation-delay: 0s; height: 10px; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 20px; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 14px; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 24px; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 16px; }
  .wave-bar:nth-child(6) { animation-delay: 0.5s; height: 20px; }
  .wave-bar:nth-child(7) { animation-delay: 0.6s; height: 12px; }
  @keyframes wave {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(0.3); }
  }

  /* ---- COMPLETE SCREEN ---- */
  .complete-wrap {
    text-align: center;
    padding: 40px 20px;
  }
  .complete-emoji { font-size: 5rem; margin-bottom: 16px; animation: bounce 1s ease infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .complete-title {
    font-family: 'Baloo 2', cursive;
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--gray-800);
    margin-bottom: 10px;
  }
  .complete-title span { color: var(--orange); }
  .complete-sub {
    font-size: 1.1rem;
    color: var(--gray-600);
    font-weight: 600;
    margin-bottom: 36px;
  }
  .score-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .score-chip {
    background: white;
    border: 2.5px solid var(--gray-200);
    border-radius: 18px;
    padding: 18px 28px;
    text-align: center;
    min-width: 130px;
  }
  .score-chip-num {
    font-family: 'Baloo 2', cursive;
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--orange);
  }
  .score-chip-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Loading / STT */
  .loading-state {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--orange-pale);
    border-radius: 14px;
    margin-bottom: 20px;
    font-weight: 700;
    color: var(--orange-deep);
    font-size: 0.95rem;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 3px solid rgba(229,90,14,0.2);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--gray-800);
    color: white;
    padding: 12px 24px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 0.95rem;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 600px) {
    .sentence-text { font-size: 1.5rem; }
    .sentence-card { padding: 24px 22px; }
    .controls-row { flex-direction: column; }
    .btn-listen, .btn-record { width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo"><span>🌟</span> Point Junior Speaking</div>
  <div class="header-badge" id="headerInfo">Unit 선택</div>
</div>

<div class="app">

  <!-- SCREEN 1: Unit Select -->
  <div class="screen active" id="screenUnits">
    <div class="section-title">어떤 <span>Unit</span>을 공부할까요?</div>
    <div class="section-sub">원하는 Unit을 골라서 스피킹 연습을 시작하세요! 🎉</div>
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <!-- SCREEN 2: Practice -->
  <div class="screen" id="screenPractice">
    <button class="back-btn" onclick="goHome()">← 돌아가기</button>

    <div class="progress-area">
      <div class="progress-label">
        <span id="progLabel">문장 1 / 10</span>
        <span id="progPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="step-dots" id="stepDots"></div>
    </div>

    <div class="sentence-card">
      <div class="sentence-step-label">오늘의 문장</div>
      <div class="sentence-text" id="sentenceText">-</div>
      <div class="sentence-ko" id="sentenceKo">-</div>
    </div>

    <div class="controls-row">
      <button class="btn btn-listen" id="btnListen" onclick="listenSentence()">
        🔊 듣기
      </button>
      <button class="btn btn-record" id="btnRecord" onclick="toggleRecord()">
        🎤 녹음 시작
      </button>
    </div>

    <div id="audioPlayback" style="display:none" class="audio-player">
      <span class="audio-label">내 녹음</span>
      <audio id="playbackAudio" controls></audio>
    </div>

    <div class="loading-state" id="loadingSTT" style="display:none">
      <div class="spinner"></div>
      발음을 분석하고 있어요...
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="transcript-box" id="transcriptBox"></div>
    </div>

    <button class="btn btn-submit" id="btnSubmit" onclick="submitRecording()" disabled>✅ 제출하기</button>
    <button class="btn btn-next" id="btnNext" style="display:none" onclick="nextSentence()">다음 문장 →</button>
  </div>

  <!-- SCREEN 3: Complete -->
  <div class="screen" id="screenComplete">
    <div class="complete-wrap">
      <div class="complete-emoji">🏆</div>
      <div class="complete-title">Unit <span id="completeUnit">1</span> 완료!</div>
      <div class="complete-sub">정말 잘했어요! 오늘도 열심히 공부했군요 💪</div>
      <div class="score-row">
        <div class="score-chip">
          <div class="score-chip-num" id="scorePass">0</div>
          <div class="score-chip-label">통과 ✅</div>
        </div>
        <div class="score-chip">
          <div class="score-chip-num" id="scoreFail">0</div>
          <div class="score-chip-label">재도전 🔄</div>
        </div>
        <div class="score-chip">
          <div class="score-chip-num" id="scoreTotal">10</div>
          <div class="score-chip-label">전체 문장</div>
        </div>
      </div>
      <button class="btn btn-next" style="max-width:340px;margin:0 auto" onclick="goHome()">🏠 Unit 목록으로</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const units = [
  {
    id: 1,
    name: "Greetings",
    emoji: "👋",
    sentences: [
      { en: "Hello! How are you?", ko: "안녕하세요! 어떻게 지내세요?" },
      { en: "I'm fine, thank you!", ko: "저는 잘 지내요, 감사해요!" },
      { en: "Nice to meet you.", ko: "만나서 반가워요." },
      { en: "Good morning!", ko: "좋은 아침이에요!" },
      { en: "Good night, everyone.", ko: "모두 안녕히 주무세요." },
      { en: "See you tomorrow!", ko: "내일 봐요!" },
      { en: "Have a great day!", ko: "좋은 하루 보내세요!" },
      { en: "How was your day?", ko: "오늘 하루 어땠어요?" },
      { en: "I'm so happy to see you!", ko: "당신을 만나서 너무 기뻐요!" },
      { en: "Take care of yourself.", ko: "몸 조심하세요." }
    ]
  },
  {
    id: 2,
    name: "My Family",
    emoji: "👨‍👩‍👧‍👦",
    sentences: [
      { en: "I have a big family.", ko: "저는 대가족이에요." },
      { en: "My mom is very kind.", ko: "우리 엄마는 매우 친절해요." },
      { en: "My dad loves cooking.", ko: "우리 아빠는 요리를 좋아해요." },
      { en: "I have a younger sister.", ko: "저는 여동생이 있어요." },
      { en: "My brother is funny.", ko: "우리 오빠는 재미있어요." },
      { en: "We eat together every day.", ko: "우리는 매일 함께 밥을 먹어요." },
      { en: "My grandma tells great stories.", ko: "우리 할머니는 재미있는 이야기를 해줘요." },
      { en: "I love my family so much.", ko: "저는 가족을 정말 사랑해요." },
      { en: "We go on trips together.", ko: "우리는 함께 여행을 가요." },
      { en: "My family makes me happy.", ko: "가족이 있어서 저는 행복해요." }
    ]
  },
  {
    id: 3,
    name: "School Life",
    emoji: "🏫",
    sentences: [
      { en: "I go to school every morning.", ko: "저는 매일 아침 학교에 가요." },
      { en: "My teacher is very nice.", ko: "우리 선생님은 매우 좋아요." },
      { en: "I like math class.", ko: "저는 수학 시간이 좋아요." },
      { en: "We read books together.", ko: "우리는 함께 책을 읽어요." },
      { en: "I sit next to my best friend.", ko: "저는 가장 친한 친구 옆에 앉아요." },

// ===== STATE =====
let currentUnit = null;
let currentIdx = 0;
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let isRecording = false;
let passCount = 0;
let failCount = 0;
let completedUnits = JSON.parse(localStorage.getItem('completedUnits') || '{}');
let synth = window.speechSynthesis;

// ===== INIT =====
function init() {
  renderUnits();
}

function renderUnits() {
  const grid = document.getElementById('unitGrid');
  grid.innerHTML = units.map(u => `
    <div class="unit-card" onclick="startUnit(${u.id})">
      ${completedUnits[u.id] ? '<div class="unit-done-badge">완료 ✓</div>' : ''}
      <div class="unit-num">${u.emoji}</div>
      <div class="unit-name">Unit ${u.id}: ${u.name}</div>
      <div class="unit-count">📝 ${u.sentences.length}개 문장</div>
    </div>
  `).join('');
}

function startUnit(id) {
  currentUnit = units.find(u => u.id === id);
  currentIdx = 0;
  passCount = 0;
  failCount = 0;
  showScreen('screenPractice');
  document.getElementById('headerInfo').textContent = `Unit ${id}: ${currentUnit.name}`;
  renderDots();
  loadSentence();
}

function renderDots() {
  const dots = document.getElementById('stepDots');
  dots.innerHTML = currentUnit.sentences.map((_, i) => `<div class="step-dot" id="dot${i}"></div>`).join('');
}

function loadSentence() {
  const s = currentUnit.sentences[currentIdx];
  document.getElementById('sentenceText').textContent = s.en;
  document.getElementById('sentenceKo').textContent = s.ko;

  // Progress
  const pct = Math.round((currentIdx / currentUnit.sentences.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `문장 ${currentIdx + 1} / ${currentUnit.sentences.length}`;
  document.getElementById('progPct').textContent = pct + '%';

  // Dots
  currentUnit.sentences.forEach((_, i) => {
    const dot = document.getElementById('dot' + i);
    dot.className = 'step-dot' + (i < currentIdx ? ' done' : i === currentIdx ? ' current' : '');
  });

  // Reset UI
  recordedBlob = null;
  document.getElementById('audioPlayback').style.display = 'none';
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('btnRecord').textContent = '🎤 녹음 시작';
  document.getElementById('btnRecord').classList.remove('recording');
  document.getElementById('btnRecord').disabled = false;
  document.getElementById('btnListen').disabled = false;
  document.getElementById('loadingSTT').style.display = 'none';
  const rc = document.getElementById('resultCard');
  rc.className = 'result-card';

  // Auto listen
  setTimeout(() => listenSentence(), 400);
}

function listenSentence() {
  if (!synth) return;
  synth.cancel();
  const s = currentUnit.sentences[currentIdx];
  const utter = new SpeechSynthesisUtterance(s.en);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1.1;

  // Try to find a natural voice
  const voices = synth.getVoices();
  const preferred = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('samantha'))
    || voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('compact'))
    || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utter.voice = preferred;

  synth.speak(utter);
}

async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('btnRecord').textContent = '⏹ 녹음 중지';
    document.getElementById('btnRecord').classList.add('recording');
    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('resultCard').className = 'result-card';
  } catch(e) {
    showToast('마이크 권한이 필요해요! 🎤');
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    isRecording = false;
    document.getElementById('btnRecord').textContent = '🎤 다시 녹음';
    document.getElementById('btnRecord').classList.remove('recording');
  }
}

function handleRecordingStop() {
  recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
  const url = URL.createObjectURL(recordedBlob);
  const audio = document.getElementById('playbackAudio');
  audio.src = url;
  document.getElementById('audioPlayback').style.display = 'flex';
  document.getElementById('btnSubmit').disabled = false;
}

async function submitRecording() {
  if (!recordedBlob) return;

  document.getElementById('loadingSTT').style.display = 'flex';
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnRecord').disabled = true;
  document.getElementById('btnListen').disabled = true;

  // Use Web Speech API for STT
  const result = await recognizeSpeech();
  document.getElementById('loadingSTT').style.display = 'none';
  showResult(result);
}

function recognizeSpeech() {
  return new Promise((resolve) => {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      // Fallback: simulate with a pass based on blob existence
      resolve({ transcript: '(음성 인식 미지원)', passed: true });
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      const target = currentUnit.sentences[currentIdx].en.toLowerCase().replace(/[^a-z\s]/g, '');
      const got = transcript.toLowerCase().replace(/[^a-z\s]/g, '');
      const score = similarity(target, got);
      resolve({ transcript, passed: score >= 0.55 });
    };
    recognition.onerror = () => {
      resolve({ transcript: '인식 실패', passed: false });
    };
    recognition.onend = () => {};

    // Re-record and recognize: play back the blob through recognition
    // Since we can't pipe blob to recognition, we just start recognition and ask user to speak
    // Actually trigger a fresh recognition
    recognition.start();

    // Auto stop after 6s
    setTimeout(() => { try { recognition.stop(); } catch(e){} }, 6000);

    // Show hint
    showToast('한 번 더 크게 말해주세요! 🎤');
  });
}

function similarity(a, b) {
  const aWords = a.split(/\s+/);
  const bWords = b.split(/\s+/);
  let matches = 0;
  aWords.forEach(w => { if (bWords.includes(w)) matches++; });
  return matches / aWords.length;
}

function showResult(result) {
  const rc = document.getElementById('resultCard');
  const rt = document.getElementById('resultTitle');
  const rd = document.getElementById('resultDetail');
  const tb = document.getElementById('transcriptBox');

  if (result.passed) {
    passCount++;
    rc.className = 'result-card pass show';
    rt.textContent = '🎉 훌륭해요! 통과!';
    rd.textContent = '발음이 정확해요! 정말 잘했어요 😊';
  } else {
    failCount++;
    rc.className = 'result-card fail show';
    rt.textContent = '💪 한 번 더 도전해봐요!';
    rd.textContent = '조금 더 연습하면 완벽해질 거예요!';
  }
  tb.innerHTML = `<span>인식된 내용 :</span> ${result.transcript}`;

  document.getElementById('btnNext').style.display = 'block';
  document.getElementById('btnSubmit').style.display = 'none';
}

function nextSentence() {
  currentIdx++;
  if (currentIdx >= currentUnit.sentences.length) {
    finishUnit();
  } else {
    document.getElementById('btnSubmit').style.display = 'block';
    document.getElementById('btnSubmit').disabled = true;
    loadSentence();
  }
}

function finishUnit() {
  completedUnits[currentUnit.id] = true;
  localStorage.setItem('completedUnits', JSON.stringify(completedUnits));

  document.getElementById('completeUnit').textContent = currentUnit.id;
  document.getElementById('scorePass').textContent = passCount;
  document.getElementById('scoreFail').textContent = failCount;
  document.getElementById('scoreTotal').textContent = currentUnit.sentences.length;

  showScreen('screenComplete');
  document.getElementById('headerInfo').textContent = '완료! 🏆';
}

function goHome() {
  synth && synth.cancel();
  showScreen('screenUnits');
  document.getElementById('headerInfo').textContent = 'Unit 선택';
  renderUnits();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init voices (async load)
if (synth) {
  synth.getVoices();
  synth.onvoiceschanged = () => synth.getVoices();
}

init();
</script>
