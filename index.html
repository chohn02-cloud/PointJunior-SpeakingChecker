<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point Junior Speaking ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDYOJZNuB72oFPskOunQa0V98eaXFuyfiw",
    authDomain: "point-junior-speaking.firebaseapp.com",
    projectId: "point-junior-speaking",
    storageBucket: "point-junior-speaking.firebasestorage.app",
    messagingSenderId: "155258649103",
    appId: "1:155258649103:web:3eb93c3a79c078acd7817a"
  };
  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);
  window._fb = { storage, db, ref, uploadBytesResumable, getDownloadURL, collection, addDoc, serverTimestamp };
  window._firebaseReady = true;
</script>
<style>
:root{--or:#FF6B1A;--orl:#FF8C42;--orp:#FFF0E6;--gr:#06D6A0;--bl:#4361EE;--rd:#EF233C;--pu:#7C3AED;--pul:#A855F7;--bg:#FFFBF7;--g2:#EDE8E0;--g4:#B0A898;--g6:#7A6F62;--g8:#3D3228;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;}

.kakao-banner{display:none;position:fixed;top:0;left:0;right:0;background:#FEE500;z-index:9999;padding:10px 16px;}
.kakao-banner.show{display:block;}
.kakao-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kakao-text{flex:1;font-size:.85rem;font-weight:800;color:#3A1D00;}
.kakao-text small{display:block;font-size:.75rem;font-weight:600;color:#6B4500;}
.btn-kk{background:#3A1D00;color:#FEE500;border:none;border-radius:8px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;}
.kk-space{display:none;height:52px;}.kk-space.show{display:block;}

.header{background:linear-gradient(135deg,var(--or),var(--orl));padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 16px rgba(255,107,26,.35);}
.hlogo{font-size:1rem;font-weight:800;color:white;display:flex;align-items:center;gap:7px;}
.hname{background:rgba(255,255,255,.25);color:white;font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:99px;}

.app{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
.screen{display:none;}.screen.active{display:block;}

/* NAME */
.name-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;text-align:center;padding:20px;}
.name-logo{margin-bottom:12px;animation:bounce 1.2s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.name-title{font-size:1.8rem;font-weight:800;color:var(--g8);margin-bottom:7px;}
.name-title span{color:var(--or);}
.name-sub{font-size:.9rem;font-weight:600;color:var(--g4);margin-bottom:24px;}
.name-row{display:flex;gap:8px;width:100%;max-width:360px;}
.name-input{flex:1;border:2.5px solid var(--g2);border-radius:12px;padding:13px 16px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--g8);outline:none;background:white;}
.name-input:focus{border-color:var(--or);}
.name-input::placeholder{color:var(--g4);}
.btn-go{background:linear-gradient(135deg,var(--or),var(--orl));color:white;border:none;border-radius:12px;padding:13px 20px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;}

/* UNITS */
.sec-title{font-size:1.5rem;font-weight:800;color:var(--g8);margin-bottom:5px;}
.sec-title span{color:var(--or);}
.sec-sub{color:var(--g6);font-size:.9rem;font-weight:600;margin-bottom:20px;}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.unit-card{background:white;border:2.5px solid var(--g2);border-radius:16px;padding:18px 14px;cursor:pointer;transition:all .2s;position:relative;}
.unit-card:hover{border-color:var(--orl);box-shadow:0 6px 20px rgba(255,107,26,.15);transform:translateY(-2px);}
.unit-name{font-size:1.2rem;font-weight:800;color:var(--or);margin-bottom:3px;}
.unit-cnt{font-size:.75rem;color:var(--g4);font-weight:600;}
.unit-done{position:absolute;top:8px;right:8px;background:var(--gr);color:white;border-radius:99px;padding:2px 8px;font-size:.68rem;font-weight:800;}

/* PRACTICE */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.back-btn{background:white;border:2px solid var(--g2);border-radius:10px;padding:6px 12px;font-size:.8rem;font-weight:700;color:var(--g6);cursor:pointer;}
.ubadge{font-size:.85rem;font-weight:800;color:var(--or);background:var(--orp);border-radius:99px;padding:4px 12px;}

.prog-area{margin-bottom:16px;}
.prog-label{display:flex;justify-content:space-between;font-weight:700;font-size:.8rem;color:var(--g6);margin-bottom:5px;}
.prog-label span:last-child{color:var(--or);}
.prog-bg{background:var(--g2);border-radius:99px;height:9px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--or),#FFD166);border-radius:99px;transition:width .4s;}
.dots{display:flex;gap:4px;margin-top:6px;justify-content:center;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g2);transition:all .25s;}
.dot.done{background:var(--gr);}
.dot.cur{background:var(--or);transform:scale(1.4);}

.dial-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.dial-num{font-size:.95rem;font-weight:800;color:white;background:var(--or);border-radius:8px;padding:3px 10px;}
.dial-prog{font-size:.78rem;font-weight:700;color:var(--g4);}

.scard{background:white;border-radius:16px;padding:20px 22px;box-shadow:0 4px 18px rgba(255,107,26,.12);margin-bottom:12px;}
.scard.full{border:2px solid var(--or);background:var(--orp);}
.slabel{font-size:.7rem;font-weight:800;color:var(--or);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.stext{font-size:1.5rem;font-weight:700;color:var(--g8);line-height:1.35;}
.full-lines{display:flex;flex-direction:column;gap:6px;}
.full-line{font-size:1.1rem;font-weight:700;color:var(--g8);line-height:1.4;}
.full-line .sp{color:var(--or);margin-right:3px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:11px 16px;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;}
.btn:disabled{opacity:.35;cursor:default;}
.nav-row{display:flex;gap:7px;margin-bottom:12px;}
.btn-prev{background:white;border:2px solid var(--g2);color:var(--g6);min-width:66px;}
.btn-prev:hover:not(:disabled){border-color:var(--or);color:var(--or);}
.btn-listen{background:linear-gradient(135deg,var(--bl),#7B89F4);color:white;flex:1;}
.btn-skip{background:white;border:2px solid rgba(67,97,238,.4);color:var(--bl);min-width:66px;}
.btn-skip:hover:not(:disabled){background:var(--bl);color:white;}

/* STT 영역 */
.stt-area{margin-bottom:12px;}
.btn-speak{background:linear-gradient(135deg,var(--pu),var(--pul));color:white;width:100%;font-size:1rem;padding:15px;border-radius:14px;box-shadow:0 4px 14px rgba(124,58,237,.3);margin-bottom:10px;}
.btn-speak.listening{animation:pstt 1s ease-in-out infinite;}
@keyframes pstt{0%,100%{box-shadow:0 4px 14px rgba(124,58,237,.3);}50%{box-shadow:0 4px 28px rgba(124,58,237,.6);transform:scale(1.02);}}
.pronun-box{display:none;border-radius:14px;padding:16px;margin-bottom:10px;text-align:center;}
.pronun-box.ok{display:block;background:#ECFDF5;border:2px solid var(--gr);}
.pronun-box.ng{display:block;background:#FFF1F2;border:2px solid var(--rd);}
.pronun-emoji{font-size:2rem;margin-bottom:5px;}
.pronun-msg{font-size:.95rem;font-weight:800;color:var(--g8);margin-bottom:3px;}
.pronun-det{font-size:.8rem;font-weight:600;color:var(--g6);}
.pronun-det b{color:var(--rd);}
.btn-done{background:linear-gradient(135deg,var(--gr),#00B886);color:white;width:100%;font-size:.95rem;padding:14px;border-radius:14px;}
.btn-done:disabled{background:var(--g2);color:var(--g4);}

/* 녹음 영역 (전체 대화) */
.rec-area{background:white;border-radius:14px;padding:14px 16px;margin-bottom:12px;border:2px solid var(--g2);}
.rec-title{font-size:.72rem;font-weight:800;color:var(--g4);letter-spacing:.07em;text-transform:uppercase;margin-bottom:9px;}
.rec-row{display:flex;gap:7px;margin-bottom:7px;}
.btn-rec{background:linear-gradient(135deg,var(--rd),#FF6B8A);color:white;flex:1;padding:13px;}
.btn-rec.rec{animation:prec 1s ease-in-out infinite;}
@keyframes prec{0%,100%{box-shadow:0 4px 14px rgba(239,35,60,.3);}50%{box-shadow:0 4px 26px rgba(239,35,60,.6);}}
.btn-play{background:white;border:2px solid var(--g2);color:var(--g6);padding:13px 14px;border-radius:12px;font-size:.88rem;font-weight:800;}
.btn-play:hover:not(:disabled){border-color:var(--bl);color:var(--bl);}
.rec-hint{font-size:.8rem;font-weight:600;color:var(--g4);}
.rec-timer{font-size:.88rem;font-weight:800;color:var(--rd);margin-right:6px;}

.upload-bar{display:none;background:var(--orp);border-radius:10px;padding:9px 13px;margin-bottom:9px;}
.upload-bar.show{display:block;}
.upload-top{font-size:.8rem;font-weight:700;color:var(--or);display:flex;justify-content:space-between;margin-bottom:5px;}
.upload-bg{background:rgba(255,107,26,.2);border-radius:99px;height:6px;overflow:hidden;}
.upload-fill{height:100%;background:var(--or);border-radius:99px;transition:width .2s;width:0;}

.btn-full-done{background:linear-gradient(135deg,var(--pu),var(--pul));color:white;width:100%;font-size:.95rem;padding:14px;border-radius:14px;animation:pfd 2s ease-in-out infinite;}
@keyframes pfd{0%,100%{box-shadow:0 4px 14px rgba(124,58,237,.3);}50%{box-shadow:0 6px 22px rgba(124,58,237,.5);transform:translateY(-2px);}}
.btn-full-done:disabled{background:var(--g2);color:var(--g4);box-shadow:none;animation:none;}

.done-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.done-item{display:flex;align-items:center;gap:8px;background:white;border:2px solid var(--g2);border-radius:10px;padding:8px 12px;}
.done-n{width:22px;height:22px;background:var(--gr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:white;flex-shrink:0;}
.done-t{font-weight:700;font-size:.8rem;color:var(--g8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* COMPLETE */
.comp-wrap{text-align:center;padding:26px 20px 12px;}
.comp-emoji{font-size:3.5rem;margin-bottom:10px;animation:bounce 1s ease infinite;}
.comp-title{font-size:1.8rem;font-weight:800;color:var(--g8);margin-bottom:6px;}
.comp-title span{color:var(--or);}
.comp-sub{font-size:.9rem;color:var(--g6);font-weight:600;margin-bottom:3px;}
.comp-meta{font-size:.8rem;color:var(--g4);font-weight:700;margin-bottom:14px;}
.comp-notice{background:linear-gradient(135deg,var(--or),var(--orl));color:white;border-radius:14px;padding:14px 18px;font-size:.9rem;font-weight:700;line-height:1.7;text-align:center;}
.comp-notice strong{display:block;margin-bottom:2px;}
.btn-home{background:white;border:2px solid var(--g2);color:var(--g6);width:100%;font-size:.88rem;padding:12px;border-radius:12px;margin-top:12px;max-width:300px;}

/* RESUME */
.overlay{position:fixed;inset:0;background:rgba(20,10,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.rbox{background:white;border-radius:22px;padding:28px 24px 22px;max-width:360px;width:100%;text-align:center;}
.remoji{font-size:2.6rem;margin-bottom:8px;}
.rtitle{font-size:1.1rem;font-weight:800;color:var(--g8);margin-bottom:5px;}
.rsub{font-size:.85rem;font-weight:600;color:var(--g4);margin-bottom:18px;line-height:1.6;}
.rbtns{display:flex;flex-direction:column;gap:9px;}
.rbtn1{background:linear-gradient(135deg,var(--or),var(--orl));color:white;border:none;border-radius:12px;padding:13px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;}
.rbtn2{background:white;border:2px solid var(--g2);color:var(--g6);border-radius:12px;padding:12px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--g8);color:white;padding:9px 18px;border-radius:11px;font-weight:700;font-size:.84rem;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="kakao-banner" id="kkBanner">
  <div class="kakao-inner">
    <div class="kakao-text">📱 카카오톡에서 열었어요!
      <small>소리 듣기·녹음을 하려면 외부 브라우저로 열어주세요.</small>
    </div>
    <button class="btn-kk" onclick="openBrowser()">🌐 외부 브라우저로 열기</button>
  </div>
</div>
<div class="kk-space" id="kkSpace"></div>

<div class="header">
  <div class="hlogo">
    <img src="logo.png" alt="Point Academy" style="height:38px;width:auto;">
    Point Junior Speaking
  </div>
  <div class="hname" id="hName" style="display:none"></div>
</div>

<div class="app">

  <!-- 이름 -->
  <div class="screen active" id="scName">
    <div class="name-wrap">
      <div class="name-logo">
        <img src="logo.png" alt="Point Academy" style="height:90px;width:auto;">
      </div>
      <div class="name-title">안녕하세요! <span>이름</span>을<br>알려주세요</div>
      <div class="name-sub">녹음 파일이 선생님께 자동으로 전달돼요 😊</div>
      <div class="name-row">
        <input class="name-input" id="nameInput" type="text" placeholder="예) 홍길동" maxlength="10"
          onkeydown="if(event.key==='Enter')doName()">
        <button class="btn-go" onclick="doName()">시작! →</button>
      </div>
    </div>
  </div>

  <!-- Script 선택 -->
  <div class="screen" id="scUnits">
    <div class="sec-title">어떤 <span>Script</span>를 공부할까요?</div>
    <div class="sec-sub" id="greet">원하는 날짜의 Script를 골라보세요 🎉</div>
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <!-- 연습 -->
  <div class="screen" id="scPractice">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 나가기</button>
      <div class="ubadge" id="ubadge">Script</div>
    </div>
    <div class="prog-area">
      <div class="prog-label"><span id="progTxt">대화 1/10</span><span id="progPct">0%</span></div>
      <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="dial-hd">
      <div class="dial-num" id="dialNum">#1</div>
      <div class="dial-prog" id="dialProg"></div>
    </div>
    <div class="scard" id="scard">
      <div class="slabel" id="slabel">발음하기</div>
      <div id="scontent"></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-prev" id="btnPrev" onclick="prevStep()">◀ 이전</button>
      <button class="btn btn-listen" onclick="listenNow()">🔊 듣기</button>
      <button class="btn btn-skip" id="btnSkip" onclick="nextStep()">다음 ▶</button>
    </div>

    <!-- 개별 문장: STT -->
    <div id="areaSTT">
      <div class="stt-area">
        <button class="btn btn-speak" id="btnSpeak" onclick="doSpeak()">🎤 말하기</button>
        <div class="pronun-box" id="pronunBox">
          <div class="pronun-emoji" id="pronunEmoji"></div>
          <div class="pronun-msg" id="pronunMsg"></div>
          <div class="pronun-det" id="pronunDet"></div>
        </div>
        <button class="btn btn-done" id="btnDone" onclick="markDone()" disabled>✅ 발음 완료!</button>
      </div>
    </div>

    <!-- 전체 대화: 녹음 -->
    <div id="areaRec" style="display:none;">
      <div class="rec-area">
        <div class="rec-title">🎙 전체 대화 녹음하기</div>
        <div class="rec-row">
          <button class="btn btn-rec" id="btnRec" onclick="toggleRec()">🔴 녹음 시작</button>
          <button class="btn btn-play" id="btnPlay" onclick="playBack()" disabled>▶ 듣기</button>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="rec-timer" id="recTimer" style="display:none">00:00</span>
          <span class="rec-hint" id="recHint">녹음 후 들어보고 완료를 눌러주세요</span>
        </div>
      </div>
      <div class="upload-bar" id="uploadBar">
        <div class="upload-top"><span>📤 전송 중...</span><span id="uploadPct">0%</span></div>
        <div class="upload-bg"><div class="upload-fill" id="uploadFill"></div></div>
      </div>
      <button class="btn btn-full-done" id="btnFullDone" onclick="markFullDone()" disabled>🎉 전체 발음 완료!</button>
    </div>

    <div class="done-list" id="doneList"></div>
  </div>

  <!-- 완료 -->
  <div class="screen" id="scComplete">
    <div class="comp-wrap">
      <div class="comp-emoji">🏆</div>
      <div class="comp-title">Script <span id="compUnit"></span> 완료!</div>
      <div class="comp-sub" id="compName">정말 잘했어요! 💪</div>
      <div class="comp-meta" id="compDate"></div>
    </div>
    <div class="comp-notice">
      <strong>✅ 녹음이 선생님께 자동으로 전달됐어요!</strong>
      수고했어요! 오늘도 열심히 공부했군요 🎉
    </div>
    <div style="display:flex;justify-content:center;">
      <button class="btn btn-home" onclick="goHome()">🏠 Script 목록으로</button>
    </div>
  </div>
</div>

<!-- 이어하기 팝업 -->
<div class="overlay" id="resumeModal" style="display:none;">
  <div class="rbox">
    <div class="remoji">📌</div>
    <div class="rtitle" id="rTitle"></div>
    <div class="rsub" id="rSub"></div>
    <div class="rbtns">
      <button class="rbtn1" onclick="doResume()">✅ 이어서 하기</button>
      <button class="rbtn2" onclick="doRestart()">🔄 처음부터 다시 하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const units = [
  {
    id: 1, name: "4/3 Script", emoji: "📖",
    dialogues: [
      {lines: ["I'm kind of nervous about going into the haunted house.", "Don't worry. We can hold hands if you want.", "Thanks. I'm happy with that idea!"]},
      {lines: ["He is going to hold a meeting in 5 minutes. Can you wait?", "Sure. I'm decent at waiting patiently."]},
      {lines: ["Can you hold my bag for a second?", "Sure. Are you going to move that heavy box?", "Yes, but I'm terrible at carrying heavy things.", "Don't worry. I'm okay with helping you!"]},
      {lines: ["I'm dying to tell you a secret!", "Tell me right now! Don't hold back.", "Well, I'm bad at keeping secrets. I'm getting a new puppy!", "Wow! That's good to hear!"]},
      {lines: ["Hurry up! The movie is starting!", "Hold on! I need to buy some popcorn.", "Come on, I'm about to go inside without you.", "Okay, okay. I'm ready to go now."]},
      {lines: ["What is holding up our pizza delivery?", "I don't know, but I'm dying to eat it!", "Me too. I'm terrible at being patient when I'm hungry."]},
      {lines: ["Did you hear about Alex? He will hold a position on the student council.", "That's awesome. I'm great at organizing events, so I want to join too.", "Go for it! I'm kind of thinking about joining myself."]},
      {lines: ["I'm bad at talking to new people.", "Really? But you can hold a conversation so well!", "Thanks. I guess I'm decent at asking questions, at least."]},
      {lines: ["I'm here to help you decorate the room.", "Thanks! We are going to hold a party tonight.", "Awesome. I'm ready to blow up all these balloons!"]},
      {lines: ["Look at that diver! He can hold his breath for three minutes.", "Wow, I'm about to try it right now.", "Be careful! Not everyone is good at it."]}
    ]

// ── STATE ──
let sName = '';
let cUnit = null;
let dIdx = 0;   // dialogue index
let sIdx = 0;   // step index (0~N-1: 개별문장, N: 전체)
let doneDials = new Set();
let doneUnits = JSON.parse(localStorage.getItem('pj_done') || '{}');

// 녹음
let mr = null, chunks = [], recOn = false, recTick = null, recSec = 0;
let recBlob = null, player = new Audio();

// STT
let recog = null, recogOn = false;

const SP = ['A','B','A','B','A','B','A','B','A','B'];

// ── KAKAO ──
function detectKakao() {
  if (/kakaotalk|kakao/i.test(navigator.userAgent)) {
    document.getElementById('kkBanner').classList.add('show');
    document.getElementById('kkSpace').classList.add('show');
  }
}
function openBrowser() {
  const url = window.location.href;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    window.location.href = url;
  } else {
    window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  }
}

// ── NAME ──
function doName() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v) { toast('이름을 입력해주세요 😊'); return; }
  sName = v;
  document.getElementById('hName').textContent = v + ' ✨';
  document.getElementById('hName').style.display = 'block';
  document.getElementById('greet').textContent = v + ' 학생, 오늘도 화이팅! 🎉';
  showSc('scUnits'); renderUnits();
}

// ── UNITS ──
function renderUnits() {
  document.getElementById('unitGrid').innerHTML = units.map(u => `
    <div class="unit-card" onclick="selectUnit(${u.id})">
      ${doneUnits[u.id] ? '<div class="unit-done">완료 ✓</div>' : ''}
      <div class="unit-name">${u.emoji} ${u.name}</div>
      <div class="unit-cnt">💬 ${u.dialogues.length}개 대화</div>
    </div>`).join('');
}

function selectUnit(id) {
  cUnit = units.find(u => u.id === id);
  doneDials = new Set();
  const saved = loadProg(sName, id);
  if (saved && saved.next > 0 && saved.next < cUnit.dialogues.length) {
    saved.done.forEach(i => doneDials.add(i));
    document.getElementById('rTitle').textContent = cUnit.name + ' 진행 중이에요!';
    document.getElementById('rSub').innerHTML = '#' + saved.done.length + '대화까지 완료했어요.<br><b>#' + (saved.next + 1) + '대화</b>부터 이어서 할까요?';
    document.getElementById('resumeModal').style.display = 'flex';
  } else {
    dIdx = 0; sIdx = 0; startPractice();
  }
}

function doResume() {
  document.getElementById('resumeModal').style.display = 'none';
  const saved = loadProg(sName, cUnit.id);
  saved.done.forEach(i => doneDials.add(i));
  dIdx = saved.next; sIdx = 0; startPractice();
}
function doRestart() {
  document.getElementById('resumeModal').style.display = 'none';
  clearProg(sName, cUnit.id);
  doneDials = new Set(); dIdx = 0; sIdx = 0; startPractice();
}

function startPractice() {
  document.getElementById('ubadge').textContent = cUnit.name;
  document.getElementById('doneList').innerHTML = '';
  showSc('scPractice');
  renderDots(); loadStep();
}

// ── PROGRESS ──
function saveProg(name, uid, doneArr, next) {
  localStorage.setItem('pjp_' + name + '_' + uid, JSON.stringify({done:doneArr, next}));
}
function loadProg(name, uid) {
  const r = localStorage.getItem('pjp_' + name + '_' + uid);
  return r ? JSON.parse(r) : null;
}
function clearProg(name, uid) {
  localStorage.removeItem('pjp_' + name + '_' + uid);
}

// ── DOTS ──
function renderDots() {
  document.getElementById('dots').innerHTML = cUnit.dialogues.map((_,i) =>
    '<div class="dot" id="d'+i+'"></div>').join('');
}
function updateDots() {
  const total = cUnit.dialogues.length;
  const pct = Math.round(doneDials.size / total * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progTxt').textContent = '대화 ' + (dIdx+1) + ' / ' + total;
  document.getElementById('progPct').textContent = pct + '%';
  cUnit.dialogues.forEach((_,i) => {
    const d = document.getElementById('d'+i);
    if (!d) return;
    d.className = 'dot' + (doneDials.has(i) ? ' done' : i===dIdx ? ' cur' : '');
  });
}

// ── LOAD STEP ──
function loadStep() {
  const lines = cUnit.dialogues[dIdx].lines;
  const isFull = sIdx === lines.length;

  document.getElementById('dialNum').textContent = '#' + (dIdx+1);
  document.getElementById('dialProg').textContent = isFull
    ? '전체 대화 (' + lines.length + '문장)'
    : (sIdx+1) + ' / ' + lines.length + ' 문장';

  updateDots();
  document.getElementById('btnPrev').disabled = (sIdx === 0 && dIdx === 0);
  document.getElementById('btnSkip').disabled = isFull;

  const card = document.getElementById('scard');
  const label = document.getElementById('slabel');
  const content = document.getElementById('scontent');

  if (isFull) {
    card.className = 'scard full';
    label.textContent = '🎭 전체 대화 발음하기';
    content.innerHTML = '<div class="full-lines">' +
      lines.map((l,i) => '<div class="full-line"><span class="sp">' + (SP[i]||'?') + ':</span>' + l + '</div>').join('') +
      '</div>';
    document.getElementById('areaSTT').style.display = 'none';
    document.getElementById('areaRec').style.display = 'block';
    resetRec();
  } else {
    card.className = 'scard';
    label.textContent = (sIdx+1) + '번째 문장';
    content.innerHTML = '<div class="stext">' + lines[sIdx] + '</div>';
    document.getElementById('areaSTT').style.display = 'block';
    document.getElementById('areaRec').style.display = 'none';
    resetSTT();
  }
}

// ── TTS ──
function listenNow() {
  const lines = cUnit.dialogues[dIdx].lines;
  sIdx === lines.length ? speakAll(lines, 0) : speak(lines[sIdx]);
}
function speak(text) {
  const s = window.speechSynthesis;
  if (!s) return;
  s.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
  const vs = s.getVoices();
  const pv = vs.find(v => v.lang.startsWith('en') && /samantha/i.test(v.name))
    || vs.find(v => v.lang === 'en-US' && !/compact/i.test(v.name))
    || vs.find(v => v.lang.startsWith('en'));
  if (pv) u.voice = pv;
  s.speak(u);
}
function speakAll(lines, i) {
  if (i >= lines.length) return;
  const s = window.speechSynthesis;
  if (!s) return;
  s.cancel();
  const u = new SpeechSynthesisUtterance(lines[i]);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
  const vs = s.getVoices();
  const pv = vs.find(v => v.lang.startsWith('en') && /samantha/i.test(v.name))
    || vs.find(v => v.lang === 'en-US' && !/compact/i.test(v.name))
    || vs.find(v => v.lang.startsWith('en'));
  if (pv) u.voice = pv;
  u.onend = () => setTimeout(() => speakAll(lines, i+1), 650);
  s.speak(u);
}

// ── STT ──
function resetSTT() {
  stopRecog();
  document.getElementById('btnSpeak').textContent = '🎤 말하기';
  document.getElementById('btnSpeak').classList.remove('listening');
  document.getElementById('pronunBox').className = 'pronun-box';
  document.getElementById('btnDone').disabled = true;
}

function doSpeak() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  const target = cUnit.dialogues[dIdx].lines[sIdx];
  runSTT(target);
}

function runSTT(target) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // STT 미지원 → 바로 완료 활성화
    document.getElementById('btnDone').disabled = false;
    return;
  }
  stopRecog();
  recog = new SR();
  recog.lang = 'en-US';
  recog.continuous = false;
  recog.interimResults = false;
  recogOn = true;

  const btn = document.getElementById('btnSpeak');
  btn.textContent = '🎤 듣고 있어요...';
  btn.classList.add('listening');
  document.getElementById('pronunBox').className = 'pronun-box';

  recog.onresult = function(e) {
    const spoken = e.results[0][0].transcript.trim();
    btn.textContent = '🎤 다시 말하기';
    btn.classList.remove('listening');
    recogOn = false;
    evalPronun(spoken, target);
  };
  recog.onerror = function() {
    recogOn = false;
    btn.textContent = '🎤 다시 말하기';
    btn.classList.remove('listening');
    toast('다시 눌러서 말해주세요! 🎤');
  };
  recog.onend = function() {
    recogOn = false;
    if (btn.classList.contains('listening')) {
      btn.textContent = '🎤 다시 말하기';
      btn.classList.remove('listening');
    }
  };
  try { recog.start(); } catch(e) {
    btn.textContent = '🎤 말하기';
    btn.classList.remove('listening');
    document.getElementById('btnDone').disabled = false;
  }
}

function stopRecog() {
  if (recog && recogOn) {
    try { recog.abort(); } catch(e) {}
    recogOn = false;
  }
}

function evalPronun(spoken, target) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
  const tw = norm(target).split(/\s+/);
  const sw = norm(spoken).split(/\s+/);
  let hit = 0;
  tw.forEach(w => { if (sw.includes(w)) hit++; });
  const score = hit / tw.length;

  const box = document.getElementById('pronunBox');
  const emoji = document.getElementById('pronunEmoji');
  const msg = document.getElementById('pronunMsg');
  const det = document.getElementById('pronunDet');

  if (score >= 0.75) {
    box.className = 'pronun-box ok';
    emoji.textContent = '🎉';
    msg.textContent = '잘했어요! 발음이 좋아요!';
    det.innerHTML = '"' + spoken + '"';
    document.getElementById('btnDone').disabled = false;
    // 1.2초 후 자동으로 다음 문장
    setTimeout(() => {
      if (!document.getElementById('btnDone').disabled) markDone();
    }, 1200);
  } else {
    box.className = 'pronun-box ng';
    emoji.textContent = '🔄';
    msg.textContent = '한 번 더 해봐요!';
    const miss = tw.filter(w => !sw.includes(w)).slice(0, 3);
    det.innerHTML = miss.length
      ? '다시 연습해봐요: <b>' + miss.join(', ') + '</b>'
      : '다시 한 번 또렷하게 말해봐요!';
  }
}

// ── DONE (개별 문장) ──
function markDone() {
  const lines = cUnit.dialogues[dIdx].lines;
  if (sIdx < lines.length - 1) {
    sIdx++;
    loadStep();
  } else {
    // 마지막 문장 → 전체 대화로
    sIdx = lines.length;
    loadStep();
    toast('🎉 전체 대화를 녹음해봐요!');
  }
}

// ── 녹음 (전체 대화) ──
function resetRec() {
  if (recOn) stopRec();
  recBlob = null;
  player.src = '';
  document.getElementById('btnRec').textContent = '🔴 녹음 시작';
  document.getElementById('btnRec').classList.remove('rec');
  document.getElementById('btnPlay').disabled = true;
  document.getElementById('recTimer').style.display = 'none';
  document.getElementById('recTimer').textContent = '00:00';
  document.getElementById('recHint').textContent = '녹음 후 들어보고 완료를 눌러주세요';
  document.getElementById('btnFullDone').disabled = true;
  clearInterval(recTick);
  recSec = 0;
}

function toggleRec() {
  if (recOn) stopRec();
  else startRec();
}

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';
    mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = onRecStop;
    mr.start(100);
    recOn = true; recSec = 0;
    document.getElementById('btnRec').textContent = '⏹ 녹음 중지';
    document.getElementById('btnRec').classList.add('rec');
    document.getElementById('recTimer').style.display = 'inline';
    document.getElementById('recHint').textContent = '전체 대화를 말해주세요...';
    recTick = setInterval(() => {
      recSec++;
      const m = String(Math.floor(recSec/60)).padStart(2,'0');
      const s = String(recSec%60).padStart(2,'0');
      document.getElementById('recTimer').textContent = m + ':' + s;
    }, 1000);
  } catch(e) {
    toast('마이크 권한을 허용해주세요! 🎤');
  }
}

function stopRec() {
  if (!mr || !recOn) return;
  clearInterval(recTick);
  recOn = false;
  mr.stop();
  mr.stream.getTracks().forEach(t => t.stop());
}

function onRecStop() {
  const mime = mr.mimeType || 'audio/webm';
  recBlob = new Blob(chunks, { type: mime });
  player.src = URL.createObjectURL(recBlob);
  document.getElementById('btnRec').textContent = '🔴 다시 녹음';
  document.getElementById('btnRec').classList.remove('rec');
  document.getElementById('btnPlay').disabled = false;
  document.getElementById('recHint').textContent = '▶ 듣기로 확인하고 완료를 눌러주세요!';
  document.getElementById('btnFullDone').disabled = false;
}

function playBack() {
  if (player.src) { player.currentTime = 0; player.play(); }
}

// ── FULL DONE ──
async function markFullDone() {
  document.getElementById('btnFullDone').disabled = true;
  document.getElementById('btnFullDone').textContent = '📤 저장 중...';

  // Firebase 업로드
  if (recBlob && window._firebaseReady) {
    await uploadRec(recBlob, dIdx);
  }

  doneDials.add(dIdx);
  updateDots();
  addDoneItem(dIdx);

  const total = cUnit.dialogues.length;
  const next = findNext(dIdx);
  saveProg(sName, cUnit.id, [...doneDials], next !== -1 ? next : 0);

  if (doneDials.size >= total) {
    clearProg(sName, cUnit.id);
    doneUnits[cUnit.id] = true;
    localStorage.setItem('pj_done', JSON.stringify(doneUnits));
    showFinish();
  } else {
    toast('✅ #' + (dIdx+1) + ' 완료! 다음 대화로 이동해요');
    if (next !== -1) {
      setTimeout(() => { dIdx = next; sIdx = 0; loadStep(); }, 700);
    }
  }
}

async function uploadRec(blob, di) {
  const fb = window._fb;
  const mime = blob.type || 'audio/webm';
  const ext = mime.includes('webm') ? 'webm' : mime.includes('mp4') ? 'mp4' : 'ogg';
  const now = new Date();
  const ds = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const fname = sName + '_' + cUnit.name.replace(/\//g,'-') + '_D' + (di+1) + '_' + ds + '.' + ext;
  const path = 'recordings/' + sName + '/' + cUnit.name.replace(/\//g,'-') + '/' + fname;

  const sr = fb.ref(fb.storage, path);
  const task = fb.uploadBytesResumable(sr, blob);

  document.getElementById('uploadBar').classList.add('show');

  await new Promise(resolve => {
    task.on('state_changed',
      snap => {
        const p = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
        document.getElementById('uploadFill').style.width = p + '%';
        document.getElementById('uploadPct').textContent = p + '%';
      },
      err => { console.error(err); resolve(); },
      async () => {
        const url = await fb.getDownloadURL(task.snapshot.ref);
        document.getElementById('uploadBar').classList.remove('show');
        try {
          await fb.addDoc(fb.collection(fb.db, 'submissions'), {
            studentName: sName,
            unitId: cUnit.id,
            unitName: cUnit.name,
            dialogueNum: di + 1,
            fileName: fname,
            fileUrl: url,
            submittedAt: fb.serverTimestamp()
          });
        } catch(e) { console.error(e); }
        resolve();
      }
    );
  });
}

function findNext(from) {
  const n = cUnit.dialogues.length;
  for (let i = from+1; i < n; i++) if (!doneDials.has(i)) return i;
  for (let i = 0; i < from; i++) if (!doneDials.has(i)) return i;
  return -1;
}

function addDoneItem(i) {
  const list = document.getElementById('doneList');
  const item = document.createElement('div');
  item.className = 'done-item';
  item.innerHTML = '<div class="done-n">' + (i+1) + '</div>' +
    '<div class="done-t">#' + (i+1) + ': ' + cUnit.dialogues[i].lines[0].slice(0, 45) + '...</div>';
  list.appendChild(item);
  item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── NAV ──
function prevStep() {
  if (sIdx > 0) { sIdx--; loadStep(); }
  else if (dIdx > 0) { dIdx--; sIdx = 0; loadStep(); }
}
function nextStep() {
  const lines = cUnit.dialogues[dIdx].lines;
  if (sIdx < lines.length) { sIdx++; loadStep(); }
}

// ── FINISH ──
function showFinish() {
  const now = new Date();
  document.getElementById('compUnit').textContent = cUnit.name;
  document.getElementById('compName').textContent = sName + ' 학생, 정말 잘했어요! 💪';
  document.getElementById('compDate').textContent = '📅 ' +
    now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' 완료';
  showSc('scComplete');
}

function goHome() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopRecog();
  if (recOn) stopRec();
  showSc('scUnits'); renderUnits();
}
function showSc(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function init() {
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
  renderUnits();
  detectKakao();
}
init();
</script>
