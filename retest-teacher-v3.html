const CLAUDE_MODEL = "claude-sonnet-4-6"; // 필요시 최신 모델명으로 교체하세요

async function extractQuestionsFromImage(base64Image){
  const apiKey = getClaudeApiKey();
  if(!apiKey){
    throw new Error("API 키가 설정되지 않았어요. 상단 '⚙️ API 키 설정'에서 입력해주세요.");
  }
  // base64Image는 "data:image/png;base64,AAAA..." 형태이므로 헤더/데이터 분리
  const match = base64Image.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
  if(!match) throw new Error("이미지 형식을 읽을 수 없어요.");
  const mediaType = match[1];
  const rawData = match[2];

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 3000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: rawData } },
          { type: "text", text:
`이 시험지 사진을 보고 문제를 추출해줘. 다른 말 없이 아래 JSON 배열 형식으로만 응답해 (마크다운 코드블록 표시(백틱)도 쓰지 마):
[
  {"type":"mc","text":"문제 내용","choices":["보기1","보기2","보기3","보기4"],"correctIndex":0},
  {"type":"short","text":"문제 내용","answer":["정답","정답 동의어"]}
]
객관식은 type을 "mc"로 하고 choices와 correctIndex(0부터 시작하는 정답 인덱스)를 채워줘.
단답형은 type을 "short"로 하고 answer 배열에 정답(동의어나 다른 표현이 있으면 최대한 여러 개)을 채워줘.
중요: 시험지에 정답이 따로 표시되어 있지 않으면, 네가 직접 그 단어/문장의 뜻을 해석하거나 영단어를 유추해서 채워줘 (예: 한글 뜻 문제면 정확한 영단어를, 영단어 문제면 정확한 한글 뜻을). answer를 빈 배열로 절대 남겨두지 마. 정말 정답을 알 수 없는 경우에만 최선으로 추정한 값을 채워.`
          }
        ]
      }]
    })
  });

  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    throw new Error(`API 요청 실패 (${res.status}) ${errText.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlock = (data.content || []).find(b => b.type === "text");
  if(!textBlock) throw new Error("AI 응답에서 텍스트를 찾을 수 없어요.");
  const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(e){
    throw new Error("AI 응답을 JSON으로 해석하지 못했어요. 사진을 좀 더 선명하게 찍어서 다시 시도해주세요.");
  }
  return Array.isArray(parsed) ? parsed : [];
}

    const box = document.getElementById("prompt-display");
    try{
      await navigator.clipboard.writeText(EXTRACT_PROMPT);
      btn.textContent = "복사됨!";
    }catch(err){
      // 클립보드 API가 막혀있으면 텍스트박스를 자동 선택해서 수동 복사할 수 있게 함
      box.focus();
      box.select();
      box.setSelectionRange(0, EXTRACT_PROMPT.length);
      try{
        document.execCommand("copy");
        btn.textContent = "복사됨!";
      }catch(e2){
        btn.textContent = "아래 박스에서 직접 복사해줘";
      }
    }
    setTimeout(()=>{ btn.textContent = "프롬프트 복사"; }, 2000);
  };

  document.getElementById("btn-paste-fill").onclick = ()=>{
    const raw = document.getElementById("json-paste").value;
    const msg = document.getElementById("extract-status");
    try{
      const cleaned = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      if(!Array.isArray(parsed)) throw new Error("배열 형식이 아니에요");
      state.draftQuestions = parsed.map(q=>({...q, id:newQId()}));
      msg.innerHTML = `<div class="ok-msg">✅ ${state.draftQuestions.length}문제를 붙여넣었어요. 아래에서 확인/수정해주세요.</div>`;
      renderQEditList();
    }catch(e){
      msg.innerHTML = `<div class="err">JSON을 읽지 못했어요. Claude 답변을 통째로 복사했는지 확인해주세요.</div>`;
    }
  };

  document.getElementById("drop-zone").onclick = ()=> document.getElementById("file-input").click();
  document.getElementById("file-input").onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const b64 = await fileToBase64(file);
    state.draftImageBase64 = b64;
    document.getElementById("thumb").src = b64;
    document.getElementById("thumb").style.display = "block";
    const statusEl = document.getElementById("extract-status");
    statusEl.innerHTML = `<div class="sub"><span class="spinner"></span>AI가 문제를 읽는 중...</div>`;
    try{
      const qs = await extractQuestionsFromImage(b64);
      state.draftQuestions = qs.map(q=>({...q, id:newQId()}));
      statusEl.innerHTML = `<div class="ok-msg">✅ ${state.draftQuestions.length}문제를 찾았어요. 아래에서 확인/수정해주세요.</div>`;
      renderQEditList();
    }catch(err){
      statusEl.innerHTML = `<div class="err">AI 추출에 실패했어요 (${err.message}). 아래 "문제 직접 추가하기"로 입력해주세요.</div>`;
    }
  };

  document.getElementById("btn-manual-add").onclick = ()=>{
    state.draftQuestions.push({id:newQId(), type:"short", text:"", answer:[""]});
    renderQEditList();
  };

  renderQEditList();

  document.getElementById("btn-save-exam").onclick = async ()=>{
    const title = document.getElementById("new-title").value.trim();
    const subject = document.getElementById("new-subject").value.trim();
    const timeLimitMinutes = +document.getElementById("new-time").value || 20;
    const msg = document.getElementById("save-msg");
    if(!title){ msg.innerHTML = `<div class="err">시험 제목을 입력해주세요</div>`; return; }
    if(!state.draftQuestions.length){ msg.innerHTML = `<div class="err">문제를 1개 이상 추가해주세요</div>`; return; }
    // 편집 필드 -> state.draftQuestions 동기화
    syncQEditFromDOM();

    const problems = [];
    state.draftQuestions.forEach((q,i)=>{
      const n = i+1;
      if(!q.text || !q.text.trim()) problems.push(`문제 ${n}: 문제 내용이 비어있어요`);
      if(q.type === "mc"){
        if(!q.choices || q.choices.filter(c=>c && c.trim()).length < 2) problems.push(`문제 ${n}: 보기가 2개 이상 필요해요`);
        if(q.correctIndex === undefined || q.correctIndex === null || !q.choices || !q.choices[q.correctIndex] || !q.choices[q.correctIndex].trim()){
          problems.push(`문제 ${n}: 정답 보기를 선택 안 했어요 (라디오 버튼 체크 필요)`);
        }
      } else {
        if(!q.answer || !q.answer.filter(a=>a && a.trim()).length) problems.push(`문제 ${n}: 정답이 비어있어요`);
      }
    });
    if(problems.length){
      msg.innerHTML = `<div class="err">저장 전에 확인해주세요:<br>${problems.join("<br>")}</div>`;
      return;
    }

    await db.collection("retestExams").add({
      title, subject, timeLimitMinutes,
      questions: state.draftQuestions,
      createdAt: new Date().toISOString()
    });
    msg.innerHTML = `<div class="ok-msg">✅ 저장했어요!</div>`;
    state.draftQuestions = [];
    state.draftImageBase64 = null;
    await loadAll();
    renderExamsTab(body);
  };

  const examListEl = document.getElementById("exam-list");
  if(!state.exams.length){
    examListEl.innerHTML = `<div class="empty">아직 만든 시험지가 없어요</div>`;
  } else {
    examListEl.innerHTML = state.exams.map(ex=>`
      <div class="item">
        <div class="top"><div class="name">${ex.title}</div><button class="small-x" data-del="${ex.id}">삭제</button></div>
        <div class="meta">${ex.subject||""} · 문제 ${ex.questions.length}개 · 제한시간 ${ex.timeLimitMinutes}분</div>
      </div>
    `).join("");
    examListEl.querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("이 시험지를 삭제할까요? 배정된 재시험에는 영향 없어요.")) return;
        await db.collection("retestExams").doc(b.dataset.del).delete();
        await loadAll();
        renderExamsTab(body);
      };
    });
  }
}

function renderQEditList(){
  const wrap = document.getElementById("qedit-list");
  if(!wrap) return;
  wrap.innerHTML = state.draftQuestions.map((q,i)=>`
    <div class="qedit" data-id="${q.id}">
      <div class="qhead">
        <span>문제 ${i+1} · ${q.type==='mc'?'객관식':'단답형'}</span>
        <button type="button" class="small-x" data-remove="${q.id}">삭제</button>
      </div>
      <textarea data-field="text" placeholder="문제 내용">${q.text||""}</textarea>
      <div class="row" style="margin-top:6px;">
        <select data-field="type">
          <option value="short" ${q.type==='short'?'selected':''}>단답형</option>
          <option value="mc" ${q.type==='mc'?'selected':''}>객관식</option>
        </select>
      </div>
      ${q.type==='mc' ? renderChoicesEditor(q) : `
        <label>정답 (여러 개면 , 로 구분)</label>
        <input type="text" data-field="answer" value="${(Array.isArray(q.answer)?q.answer.join(", "):q.answer)||""}">
      `}
    </div>
  `).join("");

  wrap.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick = ()=>{
      syncQEditFromDOM();
      state.draftQuestions = state.draftQuestions.filter(q=>q.id !== b.dataset.remove);
      renderQEditList();
    };
  });
  wrap.querySelectorAll('select[data-field="type"]').forEach(sel=>{
    sel.onchange = ()=>{
      syncQEditFromDOM();
      const qid = sel.closest(".qedit").dataset.id;
      const q = state.draftQuestions.find(qq=>qq.id===qid);
      q.type = sel.value;
      if(q.type === "mc" && !q.choices) q.choices = ["","","",""];
      if(q.type === "short" && !q.answer) q.answer = [""];
      renderQEditList();
    };
  });
}

function renderChoicesEditor(q){
  const choices = q.choices && q.choices.length ? q.choices : ["","","",""];
  return `
    <label>보기 (정답 라디오 선택)</label>
    ${choices.map((c,ci)=>`
      <div class="choice-row">
        <input type="radio" name="correct_${q.id}" ${q.correctIndex===ci?'checked':''} data-choice-correct="${ci}">
        <input type="text" data-choice-text="${ci}" value="${c}" placeholder="보기 ${ci+1}">
      </div>
    `).join("")}
  `;
}

function syncQEditFromDOM(){
  const wrap = document.getElementById("qedit-list");
  if(!wrap) return;
  wrap.querySelectorAll(".qedit").forEach(box=>{
    const id = box.dataset.id;
    const q = state.draftQuestions.find(qq=>qq.id===id);
    if(!q) return;
    q.text = box.querySelector('[data-field="text"]').value;
    if(q.type === "mc"){
      const texts = [...box.querySelectorAll("[data-choice-text]")].map(i=>i.value);
      q.choices = texts;
      const checked = box.querySelector("[data-choice-correct]:checked");
      q.correctIndex = checked ? +checked.dataset.choiceCorrect : 0;
    } else {
      const raw = box.querySelector('[data-field="answer"]');
      if(raw) q.answer = raw.value.split(",").map(s=>s.trim()).filter(Boolean);
    }
  });
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ====================== 탭2: 학생 배정 ====================== */
function renderAssignTab(body){
  body.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px;">재시험 배정하기</div>
      <label>시험지 선택</label>
      <div class="exam-pick" id="exam-pick"></div>
      <label>반</label>
      <select id="as-class">
        <option value="">반 선택</option>
        ${Object.keys(CLASSES).map(c=>`<option value="${c}">${c}</option>`).join("")}
      </select>
      <label>대상 학생</label>
      <div id="stu-list" class="sub">반을 먼저 선택해주세요</div>
      <div class="row">
        <div><label>응시 시작</label><input type="date" id="as-start-date"><input type="time" id="as-start-time" value="09:00"></div>
        <div><label>응시 마감</label><input type="date" id="as-end-date"><input type="time" id="as-end-time" value="18:00"></div>
      </div>
      <div id="assign-msg"></div>
      <button class="btn-primary full" id="btn-assign">배정하기</button>
    </div>
  `;
  let selectedExamId = null;
  const examPick = document.getElementById("exam-pick");
  examPick.innerHTML = state.exams.map(ex=>`<div class="chip" data-id="${ex.id}">${ex.title}</div>`).join("") || `<div class="sub">먼저 시험지 관리 탭에서 시험지를 만들어주세요</div>`;
  examPick.querySelectorAll(".chip").forEach(chip=>{
    chip.onclick = ()=>{
      examPick.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      selectedExamId = chip.dataset.id;
    };
  });

  const classSel = document.getElementById("as-class");
  const stuList = document.getElementById("stu-list");
  classSel.onchange = ()=>{
    const c = classSel.value;
    if(!c){ stuList.innerHTML = `<div class="sub">반을 먼저 선택해주세요</div>`; return; }
    stuList.innerHTML = CLASSES[c].map(n=>`
      <label class="stu-check"><input type="checkbox" value="${n}"> ${n}</label>
    `).join("");
  };

  document.getElementById("btn-assign").onclick = async ()=>{
    const msg = document.getElementById("assign-msg");
    const className = classSel.value;
    const checked = [...stuList.querySelectorAll("input:checked")].map(i=>i.value);
    const sd = document.getElementById("as-start-date").value, st = document.getElementById("as-start-time").value;
    const ed = document.getElementById("as-end-date").value, et = document.getElementById("as-end-time").value;

    if(!selectedExamId){ msg.innerHTML = `<div class="err">시험지를 선택해주세요</div>`; return; }
    if(!className || !checked.length){ msg.innerHTML = `<div class="err">반과 학생을 선택해주세요</div>`; return; }
    if(!sd || !st || !ed || !et){ msg.innerHTML = `<div class="err">응시 기간을 모두 입력해주세요</div>`; return; }

    const exam = state.exams.find(e=>e.id===selectedExamId);
    const batch = db.batch();
    checked.forEach(name=>{
      const ref = db.collection("retestAssignments").doc();
      batch.set(ref, {
        examId: exam.id,
        examTitle: exam.title,
        subject: exam.subject || "",
        studentName: name,
        className,
        windowStart: `${sd}T${st}`,
        windowEnd: `${ed}T${et}`,
        status: "pending",
        attemptNumber: 1,
        createdAt: new Date().toISOString()
      });
    });
    await batch.commit();
    msg.innerHTML = `<div class="ok-msg">✅ ${checked.length}명에게 배정했어요</div>`;
    await loadAll();
  };
}

/* ====================== 탭3: 진행 현황 ====================== */
function renderMonitorTab(body){
  const groups = {
    "선생님 최종 확인 대기": state.assignments.filter(a=>a.status==="awaiting_final_check"),
    "재재시험 일정 승인 대기": state.assignments.filter(a=>a.status==="reschedule_requested"),
    "진행 중 / 오답노트 작성중": state.assignments.filter(a=>["in_progress","graded_awaiting_notebook"].includes(a.status)),
    "응시 대기": state.assignments.filter(a=>a.status==="pending"),
    "통과 완료": state.assignments.filter(a=>a.status==="passed"),
    "재재시험 필요": state.assignments.filter(a=>a.status==="needs_reschedule"),
    "재재시험 일정 확정": state.assignments.filter(a=>a.status==="reschedule_approved")
  };

  body.innerHTML = Object.entries(groups).map(([label, items])=>`
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">${label} (${items.length})</div>
      <div id="grp-${label.replace(/\s/g,'')}">
        ${items.length ? "" : `<div class="empty">없음</div>`}
      </div>
    </div>
  `).join("");

  Object.entries(groups).forEach(([label, items])=>{
    const el = document.getElementById(`grp-${label.replace(/\s/g,'')}`);
    if(!items.length) return;
    el.innerHTML = items.map(a=>{
      const r = a.gradeResult;
      let extra = "";
      if(a.status === "awaiting_final_check" && r){
        extra = `<div class="wrong-mini">틀린 문제 ${r.wrongCount}개 / ${r.totalQuestions}개 · ${r.willPass ? "통과 기준 충족 ✅" : `기준 초과 (${r.wrongCount}개 틀림)`}</div>
          <button class="btn-ok" data-final="${a.id}" style="margin-top:8px;">최종 통과 처리</button>`;
      } else if(a.status === "reschedule_requested"){
        const slots = (a.proposedSchedules||[]).map(s=>`<div class="wrong-mini">• ${fmtDT2(s)} <button class="btn-ghost" data-approve-slot="${a.id}::${s}" style="padding:5px 10px;font-size:12px;margin-left:6px;">이 일정으로 확정</button></div>`).join("");
        extra = slots;
      }
      return `
        <div class="item">
          <div class="top"><div class="name">${a.studentName} (${a.className})</div>${statusBadgeAdmin(a.status)}</div>
          <div class="meta">${a.examTitle} ${a.attemptNumber>1?`· ${a.attemptNumber}차`:""}</div>
          ${extra}
        </div>
      `;
    }).join("");

    el.querySelectorAll("[data-final]").forEach(btn=>{
      btn.onclick = async ()=>{
        const a = state.assignments.find(x=>x.id===btn.dataset.final);
        const r = a.gradeResult;
        if(r.willPass){
          await db.collection("retestAssignments").doc(a.id).update({status:"passed", passedAt:new Date().toISOString()});
        } else {
          await db.collection("retestAssignments").doc(a.id).update({status:"needs_reschedule"});
        }
        await loadAll();
        renderMonitorTab(body);
      };
    });
    el.querySelectorAll("[data-approve-slot]").forEach(btn=>{
      btn.onclick = async ()=>{
        const [assignId, slot] = btn.dataset.approveSlot.split("::");
        const a = state.assignments.find(x=>x.id===assignId);
        // 재재시험용 새 배정 생성 (기존 시험지를 다음 차수로 재배정)
        await db.collection("retestAssignments").doc(assignId).update({
          status: "reschedule_approved",
          approvedSchedule: slot
        });
        await db.collection("retestAssignments").add({
          examId: a.examId,
          examTitle: a.examTitle,
          subject: a.subject,
          studentName: a.studentName,
          className: a.className,
          windowStart: slot,
          windowEnd: addMinutesISO(slot, 90),
          status: "pending",
          attemptNumber: (a.attemptNumber||1) + 1,
          createdAt: new Date().toISOString()
        });
        await loadAll();
        renderMonitorTab(body);
      };
    });
  });
}

function statusBadgeAdmin(status){
  const map = {
    pending: ["b-wait","응시 대기"],
    in_progress: ["b-progress","진행 중"],
    graded_awaiting_notebook: ["b-review","오답노트중"],
    awaiting_final_check: ["b-review","최종확인 대기"],
    passed: ["b-pass","통과"],
    needs_reschedule: ["b-fail","재재시험 필요"],
    reschedule_requested: ["b-wait","일정 승인 대기"],
    reschedule_approved: ["b-pass","일정 확정"]
  };
  const [cls,label] = map[status] || ["b-wait", status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDT2(iso){
  const d = new Date(iso);
  const mm = d.getMonth()+1, dd = d.getDate();
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return `${mm}/${dd} ${hh}:${mi}`;
}
function addMinutesISO(iso, mins){
  const d = new Date(iso);
  d.setMinutes(d.getMinutes()+mins);
  return d.toISOString().slice(0,16);
}
